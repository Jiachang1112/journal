<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupons 管理（Admin）</title>

  <!-- React / Tailwind / Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.6rem .9rem}
    .btn-primary{background:#4f46e5;color:#fff}
    .btn-primary:hover{background:#4338ca}
    .btn-neutral{background:#f1f5f9}
    .btn-neutral:hover{background:#e5e7eb}
    .badge{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .6rem;font-size:.75rem}
    .badge-green{background:#dcfce7;color:#166534}
    .badge-gray{background:#e5e7eb;color:#334155}
    .badge-amber{background:#fef3c7;color:#92400e}
    .badge-red{background:#fee2e2;color:#991b1b}
    .shadow-soft{box-shadow:0 10px 30px rgba(17,24,39,.08)}
    .input{border:1px solid #e5e7eb;border-radius:.75rem;padding:.6rem .8rem}
    .input:focus{outline:none;box-shadow:0 0 0 4px rgba(99,102,241,.15);border-color:#6366f1}
    .table-sticky thead th{position:sticky;top:0;background:#fafafa;z-index:1}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">
  <div id="root" class="max-w-7xl mx-auto p-4 md:p-8"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // ========= Firebase =========
    const firebaseConfig = {
      apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
      authDomain: "journal-49230.firebaseapp.com",
      projectId: "journal-49230",
      storageBucket: "journal-49230.appspot.com",
      messagingSenderId: "894572383995",
      appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
    };
    if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ========= 小工具 =========
    const Icon = ({name, className="w-5 h-5"}) => {
      const paths = {
        logout:"M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1",
        plus:"M12 4v16m8-8H4",
        trash:"M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m-1 0v12a2 2 0 01-2 2H9a2 2 0 01-2-2V6h10z",
        toggle:"M4 12a4 4 0 008 0 4 4 0 108 0",
        search:"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
        open:"M14 3h7v7m-1.5-5.5l-9 9M5 5v14h14",
        copy:"M8 7h8v10H8zM6 9H5a2 2 0 00-2 2v6a2 2 0 002 2h8a2 2 0 002-2v-1",
        user:"M12 12a5 5 0 100-10 5 5 0 000 10zm7 10H5a7 7 0 0114 0z",
        x:"M6 18L18 6M6 6l12 12",
        check:"M5 13l4 4L19 7"
      };
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
          <path d={paths[name]||paths.search}/>
        </svg>
      );
    };

    const Toast = ({ msg, type="ok", onClose }) => {
      if(!msg) return null;
      return (
        <div className="fixed bottom-4 right-4 z-50">
          <div className={`rounded-xl px-4 py-3 shadow-soft text-sm flex items-center gap-2 ${type==="ok" ? "bg-emerald-50 text-emerald-700 border border-emerald-200":"bg-rose-50 text-rose-700 border border-rose-200"}`}>
            <Icon name={type==="ok"?"check":"x"} />
            <span>{msg}</span>
            <button onClick={onClose} className="ml-2 text-slate-500 hover:text-slate-700">關閉</button>
          </div>
        </div>
      );
    };

    // ========= Auth Bar =========
    const AuthBar = ({ user }) => {
      const [show, setShow] = useState(false);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const provider = useMemo(()=>new firebase.auth.GoogleAuthProvider(),[]);

      const sign = async (mode) => {
        try{
          if(mode==='in'){ await auth.signInWithEmailAndPassword(email, password); }
          else{ await auth.createUserWithEmailAndPassword(email, password); }
          setShow(false);
        }catch(e){ alert(e.message); }
      };
      const google = async ()=>{
        try{ await auth.signInWithPopup(provider); setShow(false); }
        catch(e){ alert(e.message); }
      };

      return (
        <div className="flex items-center gap-3">
          {user ? (
            <>
              <div className="hidden sm:flex items-center gap-2 px-3 py-1 rounded-xl bg-white/70 border">
                <Icon name="user"/><span className="text-sm">{user.email}</span>
              </div>
              <button onClick={()=>auth.signOut()} className="btn btn-neutral">登出</button>
            </>
          ) : (
            <button onClick={()=>setShow(true)} className="btn btn-primary">登入 / 註冊</button>
          )}

          {show && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
              <div className="card shadow-soft w-[92%] max-w-md p-6">
                <div className="flex items-center justify-between mb-3">
                  <div className="text-lg font-bold">登入 / 註冊</div>
                  <button onClick={()=>setShow(false)} className="btn btn-neutral"><Icon name="x"/></button>
                </div>
                <div className="space-y-3">
                  <input className="input w-full" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} />
                  <input className="input w-full" placeholder="密碼" type="password" value={password} onChange={e=>setPassword(e.target.value)} />
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={()=>sign('in')} className="btn btn-primary w-full">登入</button>
                    <button onClick={()=>sign('up')} className="btn btn-neutral w-full">註冊</button>
                  </div>
                  <button onClick={google} className="btn w-full" style="background:#ef4444;color:#fff">使用 Google</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ========= Delete Confirm =========
    const Confirm = ({ open, title, desc, onCancel, onOk })=>{
      if(!open) return null;
      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center z-50">
          <div className="card w-[92%] max-w-md p-6 shadow-soft">
            <div className="text-lg font-bold mb-1">{title}</div>
            <div className="text-slate-600 mb-4">{desc}</div>
            <div className="flex items-center justify-end gap-2">
              <button onClick={onCancel} className="btn btn-neutral">取消</button>
              <button onClick={onOk} className="btn" style="background:#ef4444;color:#fff">刪除</button>
            </div>
          </div>
        </div>
      );
    };

    // ========= Coupon Form =========
    const CouponForm = ({ onSubmit })=>{
      const [code, setCode] = useState("");
      const [active, setActive] = useState(true);
      const [months, setMonths] = useState(0);          // 可為 0，表示沒有延長月數
      const [tier, setTier] = useState("pro");
      const [maxUses, setMaxUses] = useState(100);
      const [expires, setExpires] = useState("");

      // 金額折抵
      const [discountAmount, setDiscountAmount] = useState(0); // TWD
      const [appliesTo, setAppliesTo] = useState("any");       // monthly/yearly/any

      const [toast, setToast] = useState({ msg:"", type:"ok" });

      const submit = async ()=>{
        const norm = (code||"").trim().toUpperCase();
        if(!/^[A-Z0-9_-]{3,20}$/.test(norm)){
          setToast({ msg:"代碼格式不符（3~20 的英數/底線/連字號）", type:"err" }); return;
        }
        const payload = {
          code: norm,
          active,
          discountMonths: Math.max(0, parseInt(months||"0")),
          discountAmount: Math.max(0, parseInt(discountAmount||"0")),
          appliesTo,             // 套用方案限制
          tier,                  // 套用後要給的會員層級（若純折抵金額，也可保留不變）
          maxUses: Math.max(1, parseInt(maxUses||"1")),
          expiresAt: expires ? new Date(expires).toISOString() : null
        };
        try{
          await onSubmit(payload);
          setCode(""); setActive(true); setMonths(0); setTier("pro");
          setMaxUses(100); setExpires(""); setDiscountAmount(0); setAppliesTo("any");
          setToast({ msg:`已建立/更新：${payload.code}`, type:"ok" });
        }catch(e){
          setToast({ msg:e.message||"發生錯誤", type:"err" });
        }
      };

      return (
        <div className="card p-6 shadow-soft">
          <div className="flex items-center justify-between mb-4">
            <div>
              <div className="text-lg font-bold">建立 / 更新 優惠券</div>
              <div className="text-sm text-slate-500">支援金額折抵與延長月數，可同時設定</div>
            </div>
            <span className={`badge ${active? 'badge-green':'badge-gray'}`}>{active?'啟用中':'已停用'}</span>
          </div>

          <div className="grid md:grid-cols-6 gap-3">
            <div className="md:col-span-2">
              <label className="text-sm text-slate-600">代碼</label>
              <input className="input w-full mt-1" placeholder="如 PRO100OFF" value={code} onChange={e=>setCode(e.target.value)} />
            </div>

            <div>
              <label className="text-sm text-slate-600">狀態</label>
              <select className="input w-full mt-1" value={active? "true":"false"} onChange={e=>setActive(e.target.value==="true")}>
                <option value="true">啟用</option>
                <option value="false">停用</option>
              </select>
            </div>

            <div>
              <label className="text-sm text-slate-600">延長月數</label>
              <input className="input w-full mt-1" type="number" min="0" value={months} onChange={e=>setMonths(e.target.value)} placeholder="0 表不延長"/>
            </div>

            <div>
              <label className="text-sm text-slate-600">升級層級</label>
              <select className="input w-full mt-1" value={tier} onChange={e=>setTier(e.target.value)}>
                <option value="pro">pro</option>
                <option value="vip">vip</option>
                <option value="free">free</option>
              </select>
            </div>

            <div>
              <label className="text-sm text-slate-600">使用上限</label>
              <input className="input w-full mt-1" type="number" min="1" value={maxUses} onChange={e=>setMaxUses(e.target.value)} placeholder="如 100"/>
            </div>

            <div className="md:col-span-2">
              <label className="text-sm text-slate-600">到期時間</label>
              <input className="input w-full mt-1" type="datetime-local" value={expires} onChange={e=>setExpires(e.target.value)} />
            </div>

            <div>
              <label className="text-sm text-slate-600">折抵金額（TWD）</label>
              <input className="input w-full mt-1" type="number" min="0" value={discountAmount} onChange={e=>setDiscountAmount(e.target.value)} placeholder="例如 150"/>
            </div>

            <div>
              <label className="text-sm text-slate-600">適用方案</label>
              <select className="input w-full mt-1" value={appliesTo} onChange={e=>setAppliesTo(e.target.value)}>
                <option value="any">不限</option>
                <option value="monthly">僅月費</option>
                <option value="yearly">僅年費</option>
              </select>
            </div>

            <div className="md:col-span-2 flex items-end">
              <button onClick={submit} className="btn btn-primary w-full"><Icon name="plus"/>建立 / 更新</button>
            </div>
          </div>

          <div className="text-xs text-slate-500 mt-3">寫入：/coupons/{`{code}`}（含 discountAmount / appliesTo）</div>
          <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast({msg:""})}/>
        </div>
      );
    };

    // ========= Coupons List =========
    const CouponsList = ({ rows, onToggle, onDelete, onOpenRedemptions })=>{
      const [q, setQ] = useState("");
      const [sort, setSort] = useState("createdAt_desc");
      const [copied, setCopied] = useState("");
      const [confirm, setConfirm] = useState({ open:false, row:null });

      const filtered = useMemo(()=>{
        let arr = rows.filter(r=>{
          const hit = (s)=> (s||"").toString().toLowerCase().includes(q.toLowerCase());
          return hit(r.code) || hit(r.tier) || hit(r.appliesTo);
        });
        arr.sort((a,b)=>{
          switch (sort){
            case "createdAt_desc": return (b.createdAtTS||0) - (a.createdAtTS||0);
            case "createdAt_asc":  return (a.createdAtTS||0) - (b.createdAtTS||0);
            case "code_asc":       return a.code.localeCompare(b.code);
            case "code_desc":      return b.code.localeCompare(a.code);
            default: return 0;
          }
        });
        return arr;
      },[rows,q,sort]);

      const copy = async (text)=>{
        try{ await navigator.clipboard.writeText(text); setCopied(text); setTimeout(()=>setCopied(""),1200); }catch{}
      };

      return (
        <div className="card p-4 md:p-6 shadow-soft">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
            <div className="text-lg font-bold">優惠券列表</div>
            <div className="flex items-center gap-2">
              <div className="flex items-center gap-2 border rounded-xl px-3 py-2 bg-white">
                <Icon name="search"/><input className="outline-none" placeholder="搜尋代碼 / 等級 / 方案" value={q} onChange={e=>setQ(e.target.value)} />
              </div>
              <select className="input" value={sort} onChange={e=>setSort(e.target.value)}>
                <option value="createdAt_desc">最新</option>
                <option value="createdAt_asc">最舊</option>
                <option value="code_asc">代碼 A→Z</option>
                <option value="code_desc">代碼 Z→A</option>
              </select>
            </div>
          </div>

          <!-- 桌面版表格 -->
          <div className="hidden md:block overflow-auto max-h-[60vh] rounded-xl border">
            <table className="w-full text-sm table-sticky">
              <thead className="text-left text-slate-600">
                <tr>
                  <th className="py-3 px-3">代碼</th>
                  <th>狀態</th>
                  <th>折抵金額</th>
                  <th>適用方案</th>
                  <th>延長月數</th>
                  <th>等級</th>
                  <th>使用/上限</th>
                  <th>到期</th>
                  <th>建立者</th>
                  <th>建立時間</th>
                  <th className="text-right pr-3">操作</th>
                </tr>
              </thead>
              <tbody className="divide-y">
                {filtered.map(c=>(
                  <tr key={c.id} className="odd:bg-white even:bg-slate-50">
                    <td className="py-3 px-3">
                      <div className="flex items-center gap-2">
                        <code className="px-2 py-1 rounded bg-slate-100">{c.code}</code>
                        <button onClick={()=>copy(c.code)} className="btn btn-neutral px-2 py-1">
                          <Icon name="copy"/>{copied===c.code?'已複製':'複製'}
                        </button>
                      </div>
                    </td>
                    <td>{c.active ? <span className="badge badge-green">啟用</span> : <span className="badge badge-gray">停用</span>}</td>
                    <td>{typeof c.discountAmount === 'number' ? `NT$ ${c.discountAmount}` : '—'}</td>
                    <td><span className="badge badge-amber">{c.appliesTo || 'any'}</span></td>
                    <td>{c.discountMonths ?? 0}</td>
                    <td><span className="badge badge-gray">{c.tier || 'pro'}</span></td>
                    <td>{(c.uses||0)} / {(c.maxUses||'—')}</td>
                    <td>{c.expiresAt ? new Date(c.expiresAt).toLocaleString('zh-TW') : '—'}</td>
                    <td className="text-xs">{c.createdBy||'—'}</td>
                    <td className="text-xs">{c.createdAt ? c.createdAt.toDate?.().toLocaleString('zh-TW') : '—'}</td>
                    <td className="text-right pr-3">
                      <div className="flex items-center gap-2 justify-end">
                        <button onClick={()=>onOpenRedemptions(c.code)} className="btn btn-neutral"><Icon name="open" />兌換</button>
                        <button onClick={()=>onToggle(c)} className="btn btn-neutral"><Icon name="toggle"/>啟用/停用</button>
                        <button onClick={()=>setConfirm({open:true,row:c})} className="btn" style="background:#fee2e2;color:#991b1b"><Icon name="trash"/>刪除</button>
                      </div>
                    </td>
                  </tr>
                ))}
                {filtered.length===0 && (
                  <tr><td colSpan="11" className="py-10 text-center text-slate-400">查無資料</td></tr>
                )}
              </tbody>
            </table>
          </div>

          <!-- 手機版卡片 -->
          <div className="md:hidden space-y-3">
            {filtered.map(c=>(
              <div key={c.id} className="border rounded-xl p-3 bg-white">
                <div className="flex items-center justify-between">
                  <code className="px-2 py-1 rounded bg-slate-100">{c.code}</code>
                  <div className="flex items-center gap-2">
                    {c.active ? <span className="badge badge-green">啟用</span> : <span className="badge badge-gray">停用</span>}
                    <button onClick={()=>copy(c.code)} className="btn btn-neutral px-2 py-1"><Icon name="copy"/></button>
                  </div>
                </div>
                <div className="mt-2 grid grid-cols-2 gap-2 text-sm">
                  <div>折抵：{typeof c.discountAmount==='number'?`NT$ ${c.discountAmount}`:'—'}</div>
                  <div>方案：{c.appliesTo||'any'}</div>
                  <div>延長：{c.discountMonths??0} 月</div>
                  <div>等級：{c.tier||'pro'}</div>
                  <div>使用：{(c.uses||0)} / {(c.maxUses||'—')}</div>
                  <div>到期：{c.expiresAt?new Date(c.expiresAt).toLocaleDateString('zh-TW'):'—'}</div>
                </div>
                <div className="mt-3 flex items-center justify-end gap-2">
                  <button onClick={()=>onOpenRedemptions(c.code)} className="btn btn-neutral">兌換</button>
                  <button onClick={()=>onToggle(c)} className="btn btn-neutral">啟用/停用</button>
                  <button onClick={()=>setConfirm({open:true,row:c})} className="btn" style="background:#fee2e2;color:#991b1b">刪除</button>
                </div>
              </div>
            ))}
            {filtered.length===0 && (
              <div className="text-center text-slate-400 py-10">查無資料</div>
            )}
          </div>

          <Confirm
            open={confirm.open}
            title="刪除優惠券"
            desc={`確定要刪除 ${confirm.row?.code} ? 此操作無法復原。`}
            onCancel={()=>setConfirm({open:false,row:null})}
            onOk={()=>{ onDelete(confirm.row); setConfirm({open:false,row:null}); }}
          />
        </div>
      );
    };

    const RedemptionsModal = ({ open, code, items, onClose })=>{
      if(!open) return null;
      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div className="card w-[95%] max-w-2xl max-h-[80vh] overflow-y-auto p-6 shadow-soft">
            <div className="flex items-center justify-between mb-3">
              <div className="text-lg font-bold">兌換紀錄：{code}</div>
              <button onClick={onClose} className="btn btn-neutral"><Icon name="x"/>關閉</button>
            </div>
            <div className="space-y-2">
              {items.length===0 ? (
                <div className="text-slate-400">尚無兌換紀錄</div>
              ) : items.map(r=>(
                <div key={r.id} className="border rounded-xl p-3 flex items-center justify-between bg-white">
                  <div>
                    <div className="font-mono text-sm">uid：{r.uid}</div>
                    <div className="text-xs text-slate-500">時間：{r.redeemedAt ? r.redeemedAt.toDate?.().toLocaleString('zh-TW') : '—'}</div>
                    <div className="text-xs text-slate-500">方案：{r.plan||'—'}；折抵：{typeof r.appliedAmount==='number' ? `NT$ ${r.appliedAmount}` : '—'}</div>
                  </div>
                  <div className="text-xs text-slate-500">doc：{r.id}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ========= App =========
    const App = ()=>{
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [coupons, setCoupons] = useState([]);
      const [redemptionsOpen, setRedemptionsOpen] = useState(false);
      const [redeemCode, setRedeemCode] = useState("");
      const [redeemItems, setRedeemItems] = useState([]);
      const [toast, setToast] = useState({ msg:"", type:"ok" });

      // Auth
      useEffect(()=>{
        const unsub = auth.onAuthStateChanged(async (u)=>{
          setUser(u||null);
          if(u){
            const prof = await db.collection('users').doc(u.uid).get();
            const role = prof.exists ? (prof.data().role||'user') : 'user';
            setIsAdmin(role === 'admin');
          }else{
            setIsAdmin(false);
          }
        });
        return ()=>unsub();
      },[]);

      // 即時讀取 coupons
      useEffect(()=>{
        const unsub = db.collection('coupons').orderBy('createdAt','desc').onSnapshot(s=>{
          const arr=[];
          s.forEach(d=>{
            const data=d.data();
            arr.push({
              id:d.id,
              ...data,
              createdAtTS: data.createdAt?.toMillis?.() || 0
            });
          });
          setCoupons(arr);
        });
        return ()=>unsub();
      },[]);

      const createOrUpdate = async (payload)=>{
        if(!user || !isAdmin){ throw new Error("需要管理員權限"); }
        await db.collection('coupons').doc(payload.code).set({
          ...payload,
          uses: firebase.firestore.FieldValue.increment(0), // 確保欄位存在
          createdBy: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      };

      const toggleActive = async (c)=>{
        if(!user || !isAdmin){ setToast({msg:"需要管理員權限",type:"err"}); return; }
        await db.collection('coupons').doc(c.code).set({
          active: !c.active
        }, { merge: true });
        setToast({ msg:`已${c.active?'停用':'啟用'}：${c.code}`, type:"ok" });
      };

      const removeCoupon = async (c)=>{
        if(!user || !isAdmin){ setToast({msg:"需要管理員權限",type:"err"}); return; }
        await db.collection('coupons').doc(c.code).delete();
        setToast({ msg:`已刪除：${c.code}`, type:"ok" });
      };

      const openRedemptions = async (code)=>{
        setRedeemCode(code);
        const qs = await db.collection('coupon_redemptions').where('code','==', code).orderBy('redeemedAt','desc').get();
        const arr = qs.docs.map(d=>({ id:d.id, ...d.data() }));
        setRedeemItems(arr);
        setRedemptionsOpen(true);
      };

      // 统计卡片
      const stats = useMemo(()=>{
        const total = coupons.length;
        const enabled = coupons.filter(c=>c.active).length;
        const used = coupons.reduce((s,c)=> s + (c.uses||0), 0);
        return { total, enabled, used };
      },[coupons]);

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="rounded-2xl p-6 md:p-8 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-soft">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div>
                <h1 className="text-2xl md:text-3xl font-extrabold">🎟️ 優惠券管理</h1>
                <p className="text-white/80 mt-1">建立金額折抵 / 方案限制 / 延長月數，並即時管理使用狀況</p>
              </div>
              <AuthBar user={user}/>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
              <div className="bg-white/10 rounded-xl p-4">
                <div className="text-white/80 text-sm">總數</div>
                <div className="text-2xl font-bold">{stats.total}</div>
              </div>
              <div className="bg-white/10 rounded-xl p-4">
                <div className="text-white/80 text-sm">啟用中</div>
                <div className="text-2xl font-bold">{stats.enabled}</div>
              </div>
              <div className="bg-white/10 rounded-xl p-4">
                <div className="text-white/80 text-sm">累計使用</div>
                <div className="text-2xl font-bold">{stats.used}</div>
              </div>
            </div>
          </div>

          {!user ? (
            <div className="card p-6 shadow-soft text-slate-600">請先登入</div>
          ) : !isAdmin ? (
            <div className="card p-6 shadow-soft">
              <div className="font-semibold mb-1">你已登入，但不是管理員</div>
              <div className="text-sm text-slate-600">請在 Firestore 的 <code className="bg-slate-100 px-1 rounded">/users/{`{uid}`}</code> 文件加上 <code className="bg-slate-100 px-1 rounded">role: "admin"</code> 後重新整理。</div>
            </div>
          ) : (
            <>
              <CouponForm onSubmit={createOrUpdate}/>
              <CouponsList
                rows={coupons}
                onToggle={toggleActive}
                onDelete={removeCoupon}
                onOpenRedemptions={openRedemptions}
              />
            </>
          )}

          <RedemptionsModal
            open={redemptionsOpen}
            code={redeemCode}
            items={redeemItems}
            onClose={()=>setRedemptionsOpen(false)}
          />

          <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast({msg:""})}/>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
