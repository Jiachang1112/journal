    /* Google Maps Tools */
    function waitForGoogleMaps(maxWait = 8000) {
      return new Promise((resolve, reject) => {
        if (window.google?.maps?.places) return resolve(window.google);
        const start = Date.now();
        const timer = setInterval(() => {
          if (window.google?.maps?.places) { clearInterval(timer); resolve(window.google); }
          else if (Date.now() - start > maxWait) { clearInterval(timer); reject(new Error('Google Maps 載入逾時')); }
        }, 100);
      });
    }

    /* 日期工具 */
    const toDate = (val) => {
      try {
        if (!val) return null;
        if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
        if (typeof val === 'object' && typeof val.toDate === 'function') return val.toDate();
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
      } catch { return null; }
    };
    const localDateKey = (d) => {
      if (!(d instanceof Date) || isNaN(d.getTime())) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };
    const toDateTimeLocal = (isoString) => {
      if (!isoString) return '';
      try {
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        const tzoffset = (new Date()).getTimezoneOffset() * 60000;
        const localISOTime = (new Date(date.getTime() - tzoffset)).toISOString().slice(0, 16);
        return localISOTime;
      } catch (e) { return ''; }
    };

    /* SHA-256 */
    async function sha256Hex(text){
      try{
        const enc = new TextEncoder().encode(text);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){ return `plain:${text}`; }
    }
    
    /* Storage Upload */
    const uploadFileToStorage = async (file, userId) => {
      if (!userId) throw new Error("User not authenticated for upload.");
      const storageRef = storage.ref();
      const fileExtension = file.name.split('.').pop();
      const fileName = `${userId}/${Date.now()}-${Math.random().toString(36).substring(2, 9)}.${fileExtension}`;
      const imageRef = storageRef.child(fileName);
      const snapshot = await imageRef.put(file);
      return snapshot.ref.getDownloadURL();
    };

    /* Streak */
    function calcStreak(diaries){
      const set = new Set();
      diaries.forEach(d=>{ const dt = toDate(d.createdAt); if(dt) set.add(localDateKey(dt)); });
      if(set.size===0) return { streak:0, best:0, hasToday:false };
      const keys = Array.from(set).sort();
      let best = 1, cur = 1;
      for(let i=1;i<keys.length;i++){
        const diff = Math.round((new Date(keys[i]) - new Date(keys[i-1]))/86400000);
        if(diff===1){ cur++; best=Math.max(best,cur); } else if(diff>1){ cur=1; }
      }
      const hasToday = set.has(localDateKey(new Date()));
      let streak = 0; let probe = new Date();
      while(set.has(localDateKey(probe))){ streak++; probe.setDate(probe.getDate()-1); }
      return { streak, best, hasToday };
    }

    const StreakBadge = ({ diaries }) => {
      const { streak, best, hasToday } = useMemo(()=>calcStreak(diaries), [diaries]);

        const today = new Date();
        const offset = (today.getDay()+6)%7; 
        const monday = new Date(today);
        monday.setDate(today.getDate() - offset);
        const days = [];
        for (let i=0;i<7;i++){
          const d = new Date(monday);
          d.setDate(monday.getDate()+i);
          days.push(d);
        }
        return days;
      }, []);

        const s = new Set();
        diaries.forEach(d=>{ const dt=toDate(d.createdAt); if(dt) s.add(localDateKey(dt)); });

      }, [diaries]);

            </div>
            <div className="flex items-center justify-between">
              {week.map((d, i)=>{
                const key = localDateKey(d);
                const checked = daySet.has(key);
                return (
                  <div key={i} className="w-8 h-8 rounded-full border-2 flex items-center justify-center" style={{borderColor:checked?'var(--primary)':'#cbd5e1', background:checked?'var(--primary)':'transparent'}}>

    /* AuthBar */
    const AuthBar = ({ user }) => {
      const [show, setShow] = useState(false);
      const [isSignup, setIsSignup] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [displayName, setDisplayName] = useState('');
      const provider = useMemo(()=>new firebase.auth.GoogleAuthProvider(),[]);
      
      const closeModal = () => { setShow(false); setEmail(''); setPassword(''); setDisplayName(''); };
      const submit = async () => {
        try{
          if(isSignup){
            if (!displayName.trim()) { alert('請輸入你的名字'); return; }
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            if (cred.user) await cred.user.updateProfile({ displayName: displayName.trim() });
          } else { await auth.signInWithEmailAndPassword(email, password); }
          closeModal();
        }catch(e){ alert('Auth Error: '+e.message); }
      };
      const google = async () => {
        try{ await auth.signInWithPopup(provider); closeModal(); } catch(e){ alert('Google 登入失敗：'+e.message); }
      };

      return (
        <div className="flex items-center gap-3">
          {user ? (
            <>

    };

    /* Reminder Service */
    const ReminderService = {
      key: 'diary_reminders_v2',
      load(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch{ return [] } },
      save(list){ localStorage.setItem(this.key, JSON.stringify(list)); },
      add(rem){ const list=this.load(); list.push(rem); this.save(list); },
      remove(id){ const list=this.load().filter(r=>r.id!==id); this.save(list); },
      scheduleTicker(){
        setInterval(()=>{
          let list = this.load(); const now = Date.now(); let dirty = false;
          for(const r of list){
            const due = new Date(r.at).getTime();
            if(now >= due){
              if(Notification?.permission==='granted'){ new Notification('日記提醒', { body: r.title || '該寫日記或查看備忘囉！' }); }
              if(r.freq && r.freq!=='ONCE'){ /* ... */ }else{ r.fired = true; dirty = true; }
            }
          }
          if(dirty) this.save(list.filter(r => !(r.fired && r.freq==='ONCE')));
        }, 15000);
      },
      requestPermission(){ if('Notification' in window) Notification.requestPermission(); }
    };

    /* Tag Cloud - [Fixed Button Size] */
    const TagCloud = ({ diaries, activeTag, onToggle }) => {
      const map = {}; diaries.forEach(d => (d.tags||[]).forEach(t => map[t]=(map[t]||0)+1));
      const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);

        <div className="flex flex-wrap gap-2">
          {entries.map(([tag,count])=>{
            const active = activeTag===tag;
            return (
              <button key={tag} onClick={()=>onToggle(tag)}
                className={`px-3 py-1 rounded-lg text-sm transition ${active?'primary-bg text-white':'bg-gray-100 hover:bg-gray-200'}`}

                #{tag}
              </button>
            );
          })}
        </div>
      );
    };
    
    const CalendarView = ({ diaries, onPickDate }) => {
      const [cur, setCur] = useState(new Date());
      const y = cur.getFullYear(), m = cur.getMonth();
      const first = new Date(y,m,1);
      const startDay = (first.getDay()+6)%7;
      const daysInMonth = new Date(y,m+1,0).getDate();
      const setMonth = (delta)=>setCur(new Date(y,m+delta,1));
      const hasMap = {}; diaries.forEach(d=>{ const dt=toDate(d.createdAt); if(dt) hasMap[localDateKey(dt)]=(hasMap[localDateKey(dt)]||0)+1; });
      const cells=[]; for(let i=0;i<startDay;i++) cells.push(null);
      for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,m,d));

      return (
        <div className="border rounded-2xl p-4 bg-white/80 shadow">
          <div className="flex items-center justify-between mb-2">
            <button onClick={()=>setMonth(-1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">‹</button>

              const count = hasMap[key]||0;
              return (
                <button key={i} onClick={()=>onPickDate(key)} className={`h-20 rounded-xl text-sm relative flex items-center justify-center border transition hover:shadow-md ${count?'primary-border border-2 bg-purple-50':'border-gray-200 bg-white'}`}>

      const chartInstance = useRef({ mood: null, daily: null });

      const moodCounts = useMemo(()=>{
        const map = Object.fromEntries(moodsArr.map(m=>[m,0]));
        diaries.forEach(d => map[d.mood]=(map[d.mood]||0)+1);
        return map;
      }, [diaries]);

      const dailyCounts = useMemo(()=>{
        const map = {};
        diaries.forEach(d=>{ const dt=toDate(d.createdAt); if(dt) map[localDateKey(dt)]=(map[localDateKey(dt)]||0)+1; });
        const keys = Object.keys(map).sort();
        return { labels: keys, data: keys.map(k=>map[k]) };
      }, [diaries]);

      useEffect(()=>{
        if (!window.Chart) return;
        if (chartInstance.current.mood) chartInstance.current.mood.destroy();
        if (chartInstance.current.daily) chartInstance.current.daily.destroy();

        const primary = '#7c3aed';
        const fontColor = darkMode ? '#fff' : '#111';
        
        // Mood Chart
        chartInstance.current.mood = new Chart(moodRef.current, {
          type:'doughnut',
          data:{
            labels: Object.keys(moodCounts),
            datasets:[{ data: Object.values(moodCounts), backgroundColor: ['#9333ea', '#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#6366f1', '#a855f7', '#ec4899'], borderWidth:0 }]
          },
          options:{ cutout:'65%', plugins:{ legend:{ display:false } } }
        });

        // Daily Chart
        chartInstance.current.daily = new Chart(dailyRef.current, {
          type:'bar',
          data:{
            labels: dailyCounts.labels.map(s=>{ const [y,m,d]=s.split('-'); return `${m}/${d}`; }),
            datasets:[{ label:'篇數', data: dailyCounts.data, backgroundColor:'rgba(124, 58, 237, 0.5)', borderColor:primary, borderWidth:1, borderRadius:4 }]
          },
          options:{ maintainAspectRatio: false, scales:{ x:{ grid:{ display:false } }, y:{ beginAtZero:true } }, plugins:{ legend:{ display:false } } }
        });

        return ()=>{ if(chartInstance.current.mood) chartInstance.current.mood.destroy(); if(chartInstance.current.daily) chartInstance.current.daily.destroy(); }
      }, [moodCounts, dailyCounts, darkMode]);

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
            <h4 className="font-bold mb-2">心情分佈</h4>
            <div style={{height: 320}}><canvas ref={moodRef}></canvas></div>
          </div>
          <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
            <h4 className="font-bold mb-2">每日篇數</h4>
            <div style={{height: 320}}><canvas ref={dailyRef}></canvas></div>
          </div>
        </div>
      );
    };

    /* SettingsPanel */
    const SettingsPanel = ({ open, onClose, user, darkMode, setDarkMode, profile }) => {
      if(!open) return null;
      const [activeTab, setActiveTab] = useState('personal');
      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl h-[90vh] overflow-y-auto">
            <div className="p-4 border-b flex justify-between">
              <div className="font-bold text-lg">設定</div>
              <button onClick={onClose}><Icon name="x"/></button>
            </div>
            <div className="p-4 border-b flex gap-3">
               <button onClick={()=>setActiveTab('personal')} className={`px-4 py-2 rounded-lg ${activeTab==='personal'?'primary-bg text-white':'bg-gray-100'}`}>個人</button>
               <button onClick={()=>setActiveTab('general')} className={`px-4 py-2 rounded-lg ${activeTab==='general'?'primary-bg text-white':'bg-gray-100'}`}>通用</button>
            </div>
            <div className="p-4 space-y-8">
               {activeTab === 'personal' && (
                 <div>
                    <h3 className="font-bold mb-2">帳號資訊</h3>
                    <p>Email: {user?.email}</p>
                    <p>名稱: {user?.displayName || '未設定'}</p>
                 </div>
               )}
               {activeTab === 'general' && (
                 <div>
                    <h3 className="font-bold mb-2">外觀</h3>
                    <div className="flex items-center gap-3">
                       <span>深色模式</span>
                       <label className="switch"><input type="checkbox" checked={darkMode} onChange={e=>setDarkMode(e.target.checked)}/><span className="slider"></span></label>
                    </div>
                 </div>
               )}
            </div>
          </div>
        </div>
      );
    };

    /* Location Picker */
    const LocationPicker = ({ county, placeText, darkMode, onChange }) => {
      const inputRef = useRef(null);
      useEffect(() => {
        waitForGoogleMaps().then(google => {
          if (!inputRef.current) return;
          const ac = new google.maps.places.Autocomplete(inputRef.current, { types: ['establishment', 'geocode'] });
          if (county && TAIWAN_COUNTIES.includes(county)) ac.setComponentRestrictions({ country: 'tw' });
          ac.addListener('place_changed', () => {
            const place = ac.getPlace();
            onChange({
              placeText: place.name || place.formatted_address,
              location: county ? `${county} · ${place.name}` : place.name,
              placeId: place.place_id,
              lat: place.geometry?.location?.lat(),
              lng: place.geometry?.location?.lng()
            });
          });
        }).catch(()=>{});
      }, [county]);
      return (
        <div className="grid grid-cols-1 md:grid-cols-[160px_1fr] gap-2">
          <select value={county || ''} onChange={e=>onChange({county:e.target.value, placeText:'', location:e.target.value})} className={`border rounded-lg p-2 ${darkMode?'bg-gray-700 text-white':'border-gray-300'}`}>
             <option value="">(全球)</option>
             {TAIWAN_COUNTIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <input ref={inputRef} defaultValue={placeText||''} placeholder="輸入地點..." className={`w-full border rounded-lg p-2 ${darkMode?'bg-gray-700 text-white':'border-gray-300'}`} onInput={e=>onChange({placeText:e.target.value, location:county?`${county} · ${e.target.value}`:e.target.value})}/>
        </div>
      );
    };

    /* Sidebar */
    const SidebarContent = ({ darkMode, user, activeView, setActiveView, setSidebarOpen, setSettingsOpen }) => {
      const dark = darkMode;
      const NavItem = ({ icon, text, viewName, onClick }) => {
        const active = activeView === viewName;
        return (
          <button onClick={() => { if(onClick) onClick(); else setActiveView(viewName); setSidebarOpen(false); }}
            className={`flex items-center gap-4 w-full text-left px-5 py-3 rounded-lg transition ${active ? 'bg-blue-600 text-white shadow' : (dark ? 'text-gray-300 hover:bg-gray-700' : 'text-gray-700 hover:bg-gray-100')}`}>
            <Icon name={icon} className="w-5 h-5 flex-shrink-0" />
            <span className="font-medium flex-1 truncate">{text}</span>
          </button>
        );
      };
      return (
        <div className={`flex flex-col h-full w-full ${dark ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-900 border-r border-gray-200'}`}>
          <div className={`flex items-center gap-3 p-4 ${dark ? 'border-b border-gray-700' : 'border-b'}`}>
            <div className="w-10 h-10 rounded-lg bg-blue-500 flex items-center justify-center text-white font-bold text-lg">
              {(user?.displayName || user?.email || 'U').charAt(0).toUpperCase()}
            </div>
            <span className="font-semibold text-lg truncate">{user?.displayName || user?.email || '未登入'}</span>
          </div>
          <div className="flex-1 overflow-y-auto p-3 space-y-1">
            <NavItem icon="archive" text="所有記錄" viewName="list" />
            <NavItem icon="calendar" text="日曆" viewName="calendar" />
            <NavItem icon="chart" text="分析" viewName="analysis" />
            <NavItem icon="map-pin" text="地圖" viewName="map" />
            <div className="px-5 py-2 mt-2 text-sm text-gray-500">參考</div>
            <NavItem icon="gear" text="應用設置" onClick={()=>setSettingsOpen(true)} />
            <NavItem icon="mail" text="聯絡我們" onClick={() => window.open('https://formspree.io/f/mkgknzda', '_blank')} />
          </div>
        </div>
      );
    };

    /* Main App */
    const DiaryApp = () => {
      const [user, setUser] = useState(null);
      const [diaries, setDiaries] = useState([]);
      const [filteredDiaries, setFilteredDiaries] = useState([]);
      const [currentDiary, setCurrentDiary] = useState(null);
      const [showNewDiary, setShowNewDiary] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [sortBy, setSortBy] = useState('date-desc');
      const [filterMood, setFilterMood] = useState('');
      const [darkMode, setDarkMode] = useState(false);
      const [themeColor, setThemeColor] = useState('#7c3aed');
      const [dateFilter, setDateFilter] = useState('');
      const [uploading, setUploading] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [showPremium, setShowPremium] = useState(false);
      const [profile, setProfile] = useState(null);
      const [favoritesOnly, setFavoritesOnly] = useState(false);
      const [formData, setFormData] = useState({ title:'', content:'', tags:[], mood:'😊', weather:'☀️', isPrivate:false, isFavorite:false, images:[], newImages: [], remindAt:'', createdAt: new Date().toISOString(), location: '' });
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [activeView, setActiveView] = useState('list');

      useEffect(()=>{
        const unsub = auth.onAuthStateChanged(async (u)=>{
          setUser(u||null);
          if(u){
             db.collection('users').doc(u.uid).onSnapshot(s=>setProfile(s.data()));
             db.collection('users').doc(u.uid).collection('diaries').orderBy('createdAt','desc').onSnapshot(s=>{
               const arr=[]; s.forEach(d=>arr.push({id:d.id, ...d.data()})); setDiaries(arr);
             });
          } else { setDiaries([]); }
        });
        return unsub;
      }, []);

      useEffect(()=>{
        let res = [...diaries];
        if(searchTerm) res = res.filter(d=>d.title.includes(searchTerm));
        if(selectedTag) res = res.filter(d=>d.tags.includes(selectedTag));
        if(filterMood) res = res.filter(d=>d.mood===filterMood);
        if(dateFilter) res = res.filter(d=>localDateKey(toDate(d.createdAt))===dateFilter);
        if(favoritesOnly) res = res.filter(d=>d.isFavorite);
        setFilteredDiaries(res);
      }, [diaries, searchTerm, selectedTag, filterMood, dateFilter, favoritesOnly]);

      const handleSaveDiary = async ()=>{
        if(!formData.title && !formData.content) return alert('請填寫內容');
        setUploading(true);
        try {
          let newUrls = [];
          if(formData.newImages?.length) newUrls = await Promise.all(formData.newImages.map(f=>uploadFileToStorage(f, user.uid)));
          const finalImages = [...(formData.images||[]), ...newUrls];
          const data = { ...formData, images: finalImages, updatedAt: new Date().toISOString() };
          delete data.newImages;
          if(user){
             if(currentDiary) await db.collection('users').doc(user.uid).collection('diaries').doc(currentDiary.id).set(data,{merge:true});
             else await db.collection('users').doc(user.uid).collection('diaries').add(data);
          }
          setFormData({ title:'', content:'', tags:[], mood:'😊', weather:'☀️', isPrivate:false, isFavorite:false, images:[], newImages: [], remindAt:'', createdAt: new Date().toISOString(), location: '' });
          setShowNewDiary(false); setCurrentDiary(null);
        } catch(e){ alert(e.message); } finally { setUploading(false); }
      };

      const renderMainContent = () => {
        if(activeView==='list') return (
           <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
             <div className={`lg:col-span-1 ${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                <div className="space-y-4">
                   <input className="w-full border p-2 rounded" placeholder="搜尋..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/>
                   <div className="flex flex-wrap gap-2">
                     <select className="border p-1 rounded" value={filterMood} onChange={e=>setFilterMood(e.target.value)}><option value="">心情</option>{moods.map(m=><option key={m} value={m}>{m}</option>)}</select>
                     <button onClick={()=>setFavoritesOnly(!favoritesOnly)} className={`border p-1 rounded ${favoritesOnly?'bg-yellow-200':''}`}>最愛</button>
                   </div>
                   <TagCloud diaries={diaries} activeTag={selectedTag} onToggle={setSelectedTag}/>
                   <button onClick={()=>setActiveView('analysis')} className="w-full bg-gray-200 p-2 rounded flex justify-center gap-2"><Icon name="chart"/> 分析</button>
                   <button onClick={()=>{ setCurrentDiary(null); setShowNewDiary(true); }} className="w-full primary-bg text-white p-2 rounded flex justify-center gap-2"><Icon name="plus"/> 新增</button>
                   <div className="space-y-3">
                     {filteredDiaries.map(d=>(
                       <div key={d.id} onClick={()=>{setCurrentDiary(d); setShowNewDiary(false);}} className="border p-3 rounded cursor-pointer hover:bg-gray-50">
                         <div className="font-bold">{d.title}</div>
                         <div className="text-xs text-gray-500">{toDate(d.createdAt)?.toLocaleDateString()}</div>
                       </div>
                     ))}
                   </div>
                </div>
             </div>
             <div className="lg:col-span-2">
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                   {showNewDiary ? (
                     <div className="space-y-4">
                        <div className="flex justify-between"><h2 className="text-xl font-bold">編輯/新增</h2><button onClick={()=>setShowNewDiary(false)}><Icon name="x"/></button></div>
                        <input className="w-full border p-2 rounded text-xl font-bold" placeholder="標題" value={formData.title} onChange={e=>setFormData({...formData, title:e.target.value})}/>
                        <input type="datetime-local" className="w-full border p-2 rounded" value={toDateTimeLocal(formData.createdAt)} onChange={e=>setFormData({...formData, createdAt: new Date(e.target.value).toISOString()})}/>
                        <LocationPicker county={formData.locationCounty} placeText={formData.locationPlace} darkMode={darkMode} onChange={v=>setFormData(p=>({...p, ...v}))} />
                        <div className="flex gap-2">{moods.map(m=><button key={m} onClick={()=>setFormData({...formData, mood:m})} className={`text-2xl ${formData.mood===m?'bg-purple-100':''}`}>{m}</button>)}</div>
                        <div className="flex gap-2">{allTags.map(t=><button key={t} onClick={()=>{ const ts=formData.tags.includes(t)?formData.tags.filter(x=>x!==t):[...formData.tags,t]; setFormData({...formData, tags:ts}); }} className={`border px-2 py-1 rounded text-sm ${formData.tags.includes(t)?'bg-purple-500 text-white':''}`}>#{t}</button>)}</div>
                        <textarea className="w-full border p-2 rounded h-64" placeholder="內容..." value={formData.content} onChange={e=>setFormData({...formData, content:e.target.value})}/>
                        <input type="file" multiple accept="image/*" onChange={e=>setFormData({...formData, newImages: Array.from(e.target.files)})}/>
                        <button onClick={handleSaveDiary} className="w-full primary-bg text-white p-3 rounded font-bold" disabled={uploading}>{uploading?'上傳中...':'儲存'}</button>
                     </div>
                   ) : currentDiary ? (
                     <div className="space-y-4">
                        <div className="flex justify-between"><h2 className="text-2xl font-bold">{currentDiary.title}</h2><div className="flex gap-2"><button onClick={()=>{setFormData({...currentDiary, newImages:[]}); setShowNewDiary(true);}}><Icon name="edit"/></button></div></div>
                        <div className="text-gray-500 text-sm">{toDate(currentDiary.createdAt)?.toLocaleString()} {currentDiary.location && ` @ ${currentDiary.location}`}</div>
                        <div className="flex gap-2">{currentDiary.images?.map((src,i)=><img key={i} src={src} className="w-24 h-24 object-cover rounded"/>)}</div>
                        <p className="whitespace-pre-wrap">{currentDiary.content}</p>
                     </div>
                   ) : <div className="text-center text-gray-400 py-20"><Icon name="archive" className="w-16 h-16 mx-auto mb-4"/>請選擇一篇日記</div>}
                </div>
             </div>
           </div>
        );
        if(activeView==='calendar') return <div className="max-w-7xl mx-auto p-4"><CalendarView diaries={diaries} onPickDate={d=>{setDateFilter(d); setActiveView('list');}}/></div>;
        if(activeView==='analysis') return <div className="max-w-7xl mx-auto p-4"><Charts diaries={diaries} darkMode={darkMode}/></div>;
        if(activeView==='map') return <div className="max-w-7xl mx-auto p-4"><div className="bg-white p-10 rounded shadow text-center">地圖功能開發中...</div></div>;
      };

      return (
        <div className={`min-h-screen flex ${darkMode?'bg-gray-900 text-white':'bg-transparent'}`}>
          <div className={`fixed inset-y-0 left-0 w-64 bg-white z-50 transform ${sidebarOpen?'translate-x-0':'-translate-x-full'} md:relative md:translate-x-0 transition`}>
            <SidebarContent darkMode={darkMode} user={user} activeView={activeView} setActiveView={setActiveView} setSidebarOpen={setSidebarOpen} setSettingsOpen={setSettingsOpen}/>
          </div>
          {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={()=>setSidebarOpen(false)}></div>}
          <main className="flex-1 h-screen overflow-y-auto">
            <div className="sticky top-0 bg-white shadow-sm z-40 p-4 flex justify-between items-center">
               <div className="flex items-center gap-3">
                 <button className="md:hidden" onClick={()=>setSidebarOpen(true)}><Icon name="menu"/></button>
                 <h1 className="text-xl font-bold primary-text cursor-pointer" onClick={()=>setActiveView('list')}>📔 我的日記本</h1>
               </div>
               <div className="flex items-center gap-3">
                  <button onClick={()=>setSettingsOpen(true)}><Icon name="gear"/></button>
                  <AuthBar user={user}/>
               </div>
            </div>
            <div className="p-4 max-w-7xl mx-auto"><StreakBadge diaries={diaries}/></div>
            {renderMainContent()}
            <SettingsPanel open={settingsOpen} onClose={()=>setSettingsOpen(false)} user={user} darkMode={darkMode} setDarkMode={setDarkMode} profile={profile}/>
            <PremiumModal open={showPremium} onClose={()=>setShowPremium(false)}/>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DiaryApp/>);
  </script>
</body>
</html>
