<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>Firebase 檢查工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat（與你專案相同寫法） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root{ --ok:#16a34a; --warn:#f59e0b; --err:#dc2626; --muted:#6b7280 }
    .badge{padding:.125rem .5rem;border-radius:.375rem;font-size:.75rem}
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-2">Firebase 檢查工具</h1>
    <p class="text-sm text-slate-600 mb-6">開啟本頁即自動檢查。你也可以修改下方設定後按「重新檢查」。</p>

    <!-- 設定 -->
    <div class="bg-white shadow rounded-xl p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <label class="text-sm">apiKey
          <input id="apiKey" class="w-full border rounded p-2" value="AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w">
        </label>
        <label class="text-sm">authDomain
          <input id="authDomain" class="w-full border rounded p-2" value="journal-49230.firebaseapp.com">
        </label>
        <label class="text-sm">projectId
          <input id="projectId" class="w-full border rounded p-2" value="journal-49230">
        </label>
        <label class="text-sm">appId
          <input id="appId" class="w-full border rounded p-2" value="1:894572383995:web:a41e4e58a5d3218fee6a5e">
        </label>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <button id="run" class="px-3 py-2 rounded bg-indigo-600 text-white">重新檢查</button>
        <span id="origin" class="text-xs text-slate-500"></span>
      </div>
    </div>

    <!-- 結果 -->
    <div class="space-y-4" id="results">
      <!-- 動態填入 -->
    </div>

    <!-- 詳細 Log -->
    <div class="mt-6 bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold">詳細紀錄</h2>
        <button id="clearLog" class="text-sm text-slate-600 hover:underline">清除</button>
      </div>
      <pre id="log" class="mt-2 text-xs text-slate-800 whitespace-pre-wrap"></pre>
    </div>
  </div>

<script type="text/javascript">
const $ = (id)=>document.getElementById(id);
const log = (msg, obj) => {
  const time = new Date().toISOString().slice(11,19);
  $('log').textContent += `[${time}] ${msg}` + (obj? `\n${JSON.stringify(obj, null, 2)}\n` : '\n');
};

const badge = (text, type) => {
  const color = type==='ok'?'#16a34a':type==='warn'?'#f59e0b':'#dc2626';
  return `<span class="badge" style="background:${color};color:white">${text}</span>`;
};

const render = (rows) => {
  $('results').innerHTML = rows.map(r => `
    <div class="bg-white shadow rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="font-semibold">${r.title}</div>
        <div>${r.badge}</div>
      </div>
      ${r.detail? `<div class="mt-2 text-sm text-slate-700">${r.detail}</div>`:''}
    </div>
  `).join('');
};

$('origin').textContent = `目前網域：${location.protocol}//${location.host}`;

$('clearLog').onclick = ()=>{$('log').textContent='';};

async function runChecks(){
  const cfg = {
    apiKey: $('apiKey').value.trim(),
    authDomain: $('authDomain').value.trim(),
    projectId: $('projectId').value.trim(),
    appId: $('appId').value.trim(),
  };

  const rows = [];
  log('==== 開始檢查 ====');
  log('Config', cfg);

  // A) API Key 基本檢查（REST：getProjectConfig）
  let projectConfig = null;
  try{
    const res = await fetch(`https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=${encodeURIComponent(cfg.apiKey)}`);
    const json = await res.json();
    projectConfig = json;
    if(res.ok && json.projectId){
      rows.push({
        title: 'API Key 驗證',
        badge: badge('OK', 'ok'),
        detail: `能取得專案設定（projectId=${json.projectId}）`
      });
      log('getProjectConfig OK', json);
    }else{
      const msg = (json && json.error && json.error.message) || res.statusText || '未知錯誤';
      rows.push({
        title: 'API Key 驗證',
        badge: badge('FAIL', 'err'),
        detail: `無法取得專案設定。錯誤：${msg}`
      });
      log('getProjectConfig FAIL', json);
    }
  }catch(e){
    rows.push({ title:'API Key 驗證', badge:badge('FAIL','err'), detail:`請求失敗：${e.message}` });
    log('getProjectConfig EXCEPTION', {error: e.message});
  }

  // B) Authorized Domains 比對目前網域
  if(projectConfig && projectConfig.authorizedDomains){
    const domains = projectConfig.authorizedDomains || [];
    const host = location.host;
    const isAllowed = domains.some(d => d===host || host.endsWith(`.${d}`));
    rows.push({
      title: '授權網域 (Authorized domains)',
      badge: badge(isAllowed?'OK':'FAIL', isAllowed?'ok':'err'),
      detail: `目前網域：${host}<br>Authorized domains：<code>${domains.join(', ')||'(空)'}</code><br>${isAllowed?'目前網域已被授權':'目前網域不在白名單，請到 Firebase Authentication → 設定 → 授權網域 新增。'}`
    });
    log('Authorized domains', {host, domains, isAllowed});
  }else{
    rows.push({
      title: '授權網域 (Authorized domains)',
      badge: badge('WARN', 'warn'),
      detail: '無法從 getProjectConfig 取得授權網域清單（可能前一步已失敗）。'
    });
  }

  // C) 初始化 Firebase 並檢查目前載入的 options
  let app, auth, db;
  try{
    if(firebase.apps.length){ firebase.app().delete?.(); }
  }catch(_){} // ignore
  try{
    app = firebase.initializeApp(cfg);
    auth = firebase.auth();
    db = firebase.firestore();

    const opts = firebase.app().options || {};
    const looksGood = (opts.apiKey===cfg.apiKey && opts.projectId===cfg.projectId && opts.appId===cfg.appId);
    rows.push({
      title: '前端初始化設定一致性',
      badge: badge(looksGood?'OK':'WARN', looksGood?'ok':'warn'),
      detail: `app.options = ${JSON.stringify(opts)}`
    });
    log('firebase.app().options', opts);
  }catch(e){
    rows.push({ title:'前端初始化', badge:badge('FAIL','err'), detail:`初始化失敗：${e.message}` });
    log('initializeApp EXCEPTION', {error: e.message});
  }

  // D) Auth 連線測試（不需啟用匿名登入）
  if(auth){
    try{
      const methods = await auth.fetchSignInMethodsForEmail('test@example.com');
      rows.push({
        title: 'Auth 連線',
        badge: badge('OK', 'ok'),
        detail: `fetchSignInMethodsForEmail 成功（回傳 ${methods.length} 筆方法）`
      });
      log('Auth OK', {methods});
    }catch(e){
      const em = e && (e.message || e.code) || String(e);
      rows.push({
        title: 'Auth 連線',
        badge: badge('FAIL', 'err'),
        detail: `Auth 呼叫失敗：${em}`
      });
      log('Auth FAIL', {error: em});
    }
  }

  // E) Firestore 連線測試（若被規則擋住，也視為「可連線但無權限」）
  if(db){
    try{
      await db.collection('_check').limit(1).get();
      rows.push({
        title: 'Firestore 連線',
        badge: badge('OK', 'ok'),
        detail: '讀取成功（規則允許或開放讀取）'
      });
      log('Firestore get OK');
    }catch(e){
      const code = e && e.code;
      if(code==='permission-denied'){
        rows.push({
          title: 'Firestore 連線',
          badge: badge('WARN', 'warn'),
          detail: '成功連上，但被安全規則擋住（permission-denied）。代表連線沒問題，只是規則不允許匿名讀取。'
        });
        log('Firestore permission-denied（連線正常，規則擋）');
      }else{
        rows.push({
          title: 'Firestore 連線',
          badge: badge('FAIL', 'err'),
          detail: `連線失敗：${e.message || e}`
        });
        log('Firestore get FAIL', {error: e.message || e});
      }
    }
  }

  render(rows);
  log('==== 檢查結束 ====');
}

$('run').onclick = runChecks;
window.addEventListener('load', runChecks);
</script>
</body>
</html>
