<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>📔 我的日記本｜管理後台</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat 10.12.5（與主站一致） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- 同優惠券系統的樣式集合（玻璃質感 + 按鈕 + 卡片 + 輸入框） -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;
    }
    .card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
    .glass-card{background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
    .hover-lift{transition:all .2s ease}
    .hover-lift:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,.12)}
    .gradient-bg{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
    .btn{padding:10px 14px;border-radius:12px;font-weight:700;transition:all .2s;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-primary:hover{opacity:.92;transform:translateY(-1px)}
    .btn-secondary{background:#f3f4f6;color:#374151}
    .btn-secondary:hover{background:#e5e7eb}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-danger:hover{background:#dc2626}
    input,select,textarea{border:2px solid #e5e7eb;border-radius:12px;padding:10px 14px;transition:all .2s;width:100%;background:#fff}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.12)}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:700;background:#f3e8ff;color:#6b21a8}
    .pill{display:flex;align-items:center;gap:8px;background:#f9fafb;border:1px solid #eef2f7;padding:6px 10px;border-radius:12px}

    /* ===== 初始載入遮罩（玻璃質感） ===== */
    #app-loader{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,rgba(102,126,234,.35),rgba(118,75,162,.35));
      backdrop-filter:blur(14px);
      z-index:50;
      transition:opacity .35s ease, visibility .35s ease;
    }
    #app-loader.hidden{opacity:0; visibility:hidden}

    .loader-card{
      background:rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.5);
      border-radius:22px;
      padding:22px 24px;
      box-shadow:0 20px 60px rgba(0,0,0,.15);
      min-width:280px;
    }
    .spin{
      width:42px; height:42px; border-radius:50%;
      border:4px solid #e8eaf6; border-top-color:#667eea; border-right-color:#764ba2;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 主體淡入 */
    .fade-ready{opacity:0; transform:translateY(4px); transition:opacity .35s ease, transform .35s ease;}
    .fade-in{opacity:1; transform:none;}
  </style>
</head>

<body class="min-h-screen">
  <!-- 初始 Loading（立即可見，待準備好再隱藏） -->
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="flex items-center gap-4">
        <div class="spin"></div>
        <div>
          <div class="text-sm font-bold text-gray-800">正在載入管理後台</div>
          <div class="text-xs text-gray-500">初始化 Firebase 與驗證中…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="max-w-7xl mx-auto p-4 md:p-6 fade-ready" id="hdr">
    <div class="glass-card hover-lift">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-2xl gradient-bg shadow-lg flex items-center justify-center text-white text-2xl">📔</div>
          <div>
            <h1 class="text-2xl md:text-3xl font-extrabold gradient-bg bg-clip-text text-transparent">我的日記本｜管理後台</h1>
            <p class="text-sm text-gray-600">統一風格：玻璃質感 + 紫藍漸層主題</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span id="whoami" class="pill text-sm text-gray-700 hidden"></span>
          <button id="btn-signin" class="btn btn-primary">使用 Google 登入</button>
          <button id="btn-signout" class="btn btn-secondary hidden">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 非 admin 提示 -->
  <section id="gate" class="max-w-3xl mx-auto px-4 md:px-6 hidden fade-ready">
    <div class="glass-card hover-lift text-center">
      <h2 class="text-xl font-bold mb-2">需要管理員權限</h2>
      <p class="text-gray-600">
        你已登入，但不是管理員（需要 <code>users/{uid}.role === "admin"</code>）。
      </p>
      <p class="text-sm text-gray-500 mt-1">
        若你是站主，請到 Firebase Console → Firestore 將自己的 <code>users/{uid}</code> 加上 <b>role: "admin"</b> 後重新整理。
      </p>
    </div>
  </section>

  <!-- 主畫面 -->
  <main id="app" class="max-w-7xl mx-auto px-4 md:px-6 pb-10 hidden fade-ready">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- 左：使用者清單 -->
      <section class="glass-card hover-lift lg:col-span-1">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-extrabold text-lg">使用者清單</h3>
            <p id="users-count" class="text-xs text-gray-500"></p>
          </div>
          <div class="flex items-center gap-2">
            <button id="clear-users-filter" class="btn btn-secondary">清除</button>
            <button id="refresh-users" class="btn btn-primary">重新整理</button>
          </div>
        </div>

        <div class="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2 mb-3 border border-gray-100">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="user-search" class="bg-transparent border-none outline-none w-full" placeholder="搜尋名稱 / Email / UID（即時）"/>
        </div>

        <div id="users-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">載入中…</div>
      </section>

      <!-- 右：使用者資料 + 篩選 + 日記列表 -->
      <section class="lg:col-span-2 space-y-6">

        <!-- 使用者資訊 -->
        <div class="glass-card hover-lift">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-extrabold text-lg flex items-center gap-2">
                使用者資料
                <span id="user-role" class="chip hidden"></span>
                <span id="membership-chip" class="chip hidden"></span>
              </h3>
              <div id="user-meta" class="text-sm text-gray-600 mt-1"></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="toggle-role" class="btn btn-secondary hidden">切換角色（user ⇄ admin）</button>
              <button id="download-json" class="btn btn-primary hidden">下載此使用者日記 JSON</button>
            </div>
          </div>
        </div>

        <!-- 即時篩選列 -->
        <div class="glass-card hover-lift">
          <div class="grid md:grid-cols-3 gap-3">
            <div class="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2 border border-gray-100">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input id="diary-q" class="bg-transparent border-none outline-none w-full" placeholder="關鍵字（標題 / 內容）打字即篩選"/>
            </div>
            <select id="diary-mood" class="border rounded-xl p-2">
              <option value="">心情：全部</option>
              <option>😊</option><option>😢</option><option>😡</option><option>😰</option>
              <option>😍</option><option>🤔</option><option>😴</option><option>🎉</option>
            </select>
            <div class="flex gap-2">
              <button id="clear-filter" class="btn btn-secondary w-full">清除</button>
              <button id="prev-page" class="btn btn-secondary w-full">上一頁</button>
              <button id="next-page" class="btn btn-primary w-full">下一頁</button>
            </div>
          </div>
        </div>

        <!-- 日記列表 -->
        <div class="glass-card hover-lift">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold">日記列表</h3>
            <div class="text-sm text-gray-500">每頁 30 筆</div>
          </div>
          <div id="diaries-list" class="divide-y"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
  // === Firebase 初始化 ===
  const firebaseConfig = {
    apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
    authDomain: "journal-49230.firebaseapp.com",
    projectId: "journal-49230",
    storageBucket: "journal-49230.appspot.com",
    messagingSenderId: "894572383995",
    appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ===== 小工具 =====
  const $ = (s, r=document)=>r.querySelector(s);
  const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));
  const fmtTime = (iso)=>{
    try{
      const d = new Date(typeof iso?.toDate==="function"?iso.toDate():iso);
      return isNaN(d) ? '—' : d.toLocaleString('zh-TW');
    }catch{ return '—'; }
  };

  // ===== UI refs =====
  const loader = $('#app-loader');
  const hdr = $('#hdr');
  const who = $('#whoami'), btnSignIn=$('#btn-signin'), btnSignOut=$('#btn-signout');
  const gate = $('#gate'), app = $('#app');

  const usersList = $('#users-list'), userSearch = $('#user-search'), usersCount = $('#users-count');
  const clearUsersBtn = $('#clear-users-filter'), refreshUsers = $('#refresh-users');

  const userMeta = $('#user-meta'), userRoleChip = $('#user-role'), membershipChip = $('#membership-chip');
  const toggleRoleBtn = $('#toggle-role'), downloadBtn = $('#download-json');

  const diaryList = $('#diaries-list'), diaryQ = $('#diary-q'), diaryMood = $('#diary-mood');
  const clearFilter = $('#clear-filter'), prevPageBtn = $('#prev-page'), nextPageBtn = $('#next-page');

  // ===== 狀態 =====
  let me = null, meProfile = null;
  let allUsersCache = [];
  let selectedUserId = null, selectedUserDoc = null;
  const PAGE = 30; let pagestack = []; let lastDoc = null;

  // ===== 顯示控制（載入 → 淡入） =====
  function reveal(targetEl){
    // 讓目標進入可視
    targetEl.classList.remove('hidden');
    // 啟動淡入
    requestAnimationFrame(()=> targetEl.classList.add('fade-in'));
  }
  function hideLoader(){
    loader.classList.add('hidden');
    // 頁首淡入（一次）
    hdr.classList.add('fade-in');
  }

  // ===== Auth =====
  btnSignIn.onclick = async()=>{ const p=new firebase.auth.GoogleAuthProvider(); await auth.signInWithPopup(p); };
  btnSignOut.onclick = ()=>auth.signOut();

  // 一開始先讓 Header 也準備好動畫
  hdr.classList.add('fade-ready');

  auth.onAuthStateChanged(async(u)=>{
    me = u||null;

    if(me){
      who.classList.remove('hidden');
      who.textContent = me.displayName ? `👤 ${me.displayName}` : `📧 ${me.email||me.uid}`;
    }else{
      who.classList.add('hidden');
    }
    btnSignIn.classList.toggle('hidden', !!me);
    btnSignOut.classList.toggle('hidden', !me);

    if(!me){
      // 未登入：顯示 "請登入" 的 gate？此處維持隱藏主體，只顯示 Header，並保留 Loader 淡出
      hideLoader();
      reveal(gate);
      return;
    }

    // 取自己的 role
    try{
      const meSnap = await db.collection('users').doc(me.uid).get();
      meProfile = meSnap.exists ? meSnap.data() : { role:'user' };
    }catch(err){ meProfile = { role:'user' }; }

    if(meProfile.role !== 'admin'){
      hideLoader();
      reveal(gate);
    }else{
      // 管理員：載入使用者清單，再淡出 loader，淡入主畫面
      await loadUsers();
      hideLoader();
      reveal(app);
    }
  });

  // ===== 使用者清單（即時搜尋） =====
  async function loadUsers(){
    usersList.textContent = '載入中…';
    try{
      const snap = await db.collection('users').get();
      allUsersCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      renderUserList();
    }catch(err){
      usersList.innerHTML = `<div class="text-red-600 text-sm">讀取使用者失敗：${err.message}</div>`;
    }
  }

  function renderUserList(){
    const q = userSearch.value.trim().toLowerCase();
    const rows = allUsersCache
      .filter(u=>{
        const name=(u.displayName||'').toLowerCase();
        const email=(u.email||'').toLowerCase();
        return !q || name.includes(q) || email.includes(q) || u.id.includes(q);
      })
      .sort((a,b)=> (b.membership?.tier||'').localeCompare(a.membership?.tier||''));

    usersList.innerHTML = '';
    usersCount.textContent = `（共 ${rows.length} 位）`;

    if(rows.length===0){
      usersList.innerHTML = '<div class="text-gray-200 bg-white/60 rounded-xl p-4 text-center">沒有符合的使用者</div>';
      return;
    }

    rows.forEach(u=>{
      const el = document.createElement('button');
      el.className = `w-full text-left p-3 rounded-xl border bg-white/90 hover:bg-white ${selectedUserId===u.id?'ring-2 ring-purple-400 bg-purple-50':''}`;
      const role = u.role||'user';
      const tier = u.membership?.tier||'free';
      el.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="min-w-0">
            <div class="font-semibold truncate">${u.displayName||'(未設定名稱)'}</div>
            <div class="text-xs text-gray-500 truncate">${u.email||''}</div>
            <div class="text-[11px] text-gray-400 truncate">UID：${u.id}</div>
          </div>
          <div class="text-right space-y-1 shrink-0">
            <div><span class="chip">${role}</span></div>
            <div><span class="chip">tier: ${tier}</span></div>
          </div>
        </div>`;
      el.onclick = ()=>selectUser(u.id, u);
      usersList.appendChild(el);
    });
  }

  // 即時搜尋（無需按鈕）
  userSearch.addEventListener('input', renderUserList);
  clearUsersBtn.onclick = ()=>{ userSearch.value=''; renderUserList(); };
  refreshUsers.onclick = loadUsers;

  // ===== 選擇使用者 → 載入資料 =====
  async function selectUser(uid, doc){
    selectedUserId = uid;
    selectedUserDoc = doc || allUsersCache.find(x=>x.id===uid);
    const role = selectedUserDoc?.role || 'user';
    const tier = selectedUserDoc?.membership?.tier || 'free';
    const exp  = selectedUserDoc?.membership?.expiresAt ? fmtTime(selectedUserDoc.membership.expiresAt) : null;

    userRoleChip.textContent = role; userRoleChip.classList.remove('hidden');
    membershipChip.textContent = `tier: ${tier}${exp?`｜到期：${exp}`:''}`; membershipChip.classList.remove('hidden');
    userMeta.innerHTML = `
      <div class="text-gray-600 space-y-1">
        <div>名稱：<span class="font-medium">${selectedUserDoc.displayName||'(未設定)'}</span></div>
        <div>Email：<span class="font-medium">${selectedUserDoc.email||'—'}</span></div>
      </div>`;
    toggleRoleBtn.classList.remove('hidden');
    downloadBtn.classList.remove('hidden');

    pagestack=[]; lastDoc=null;
    await loadDiariesPage({ reset:true });
    renderUserList();
  }

  // ===== 日記（分頁 + 即時篩選）=====
  async function loadDiariesPage({ reset=false, direction='next' }={}){
    if(!selectedUserId){ diaryList.innerHTML='<div class="p-3 text-gray-500 text-sm">尚未選取使用者</div>'; return; }
    diaryList.innerHTML = '<div class="p-3 text-gray-500 text-sm">載入中…</div>';

    const qText = diaryQ.value.trim().toLowerCase();
    const mood  = diaryMood.value;

    try{
      let q = db.collection('users').doc(selectedUserId).collection('diaries')
        .orderBy('createdAt','desc').limit(PAGE);

      if(direction==='next' && lastDoc){ q = q.startAfter(lastDoc); }
      if(direction==='prev' && pagestack.length>1){
        pagestack.pop();
        const startAtDoc = pagestack[pagestack.length-1];
        q = db.collection('users').doc(selectedUserId).collection('diaries')
              .orderBy('createdAt','desc').startAt(startAtDoc).limit(PAGE);
      }

      const snap = await q.get();
      if(snap.docs.length>0){
        const firstOnPage = snap.docs[0];
        if(direction==='next' || reset) pagestack.push(firstOnPage);
        lastDoc = snap.docs[snap.docs.length-1];
      }else{
        if(direction==='next') lastDoc = null;
      }

      const raw = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      const rows = raw.filter(d=>{
        const hitQ = !qText ||
          (String(d.title||'').toLowerCase().includes(qText)) ||
          (String(d.content||'').toLowerCase().includes(qText));
        const hitM = !mood || d.mood===mood;
        return hitQ && hitM;
      });
      renderDiaries(rows);
    }catch(err){
      diaryList.innerHTML = `<div class="p-3 text-red-600 text-sm">讀取失敗：${err.message}</div>`;
    }
  }

  function renderDiaries(rows){
    diaryList.innerHTML = '';
    if(rows.length===0){
      diaryList.innerHTML = '<div class="p-3 text-gray-400 text-sm">沒有資料或已到最末頁</div>';
      return;
    }
    rows.forEach(d=>{
      const tags = (d.tags||[]).map(t=>`<span class="chip mr-1 mb-1">#${t}</span>`).join('');
      const privateBadge = d.isPrivate ? `<span class="chip">私密</span>`:'';
      const imgs = Array.isArray(d.images) ? d.images.slice(0,3) : [];

      const row = document.createElement('div');
      row.className = 'py-3';
      row.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">${d.mood||''}</span>
              <span class="text-xl">${d.weather||''}</span>
              ${privateBadge}
              ${tags}
            </div>
            <div class="font-semibold truncate">${d.title||'(無標題)'}</div>
            <div class="text-xs text-gray-500">${fmtTime(d.createdAt)} ｜ ID: ${d.id}</div>
            <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${(d.isPrivate?'（私密內容）':(d.content||''))}</p>
            ${imgs.length?`<div class="flex gap-2 mt-2">${imgs.map(u=>`<img src="${u}" class="w-16 h-16 object-cover rounded border"/>`).join('')}</div>`:''}
          </div>
          <div class="flex flex-col gap-2 items-end shrink-0">
            <button data-del="${d.id}" class="btn btn-danger">刪除</button>
          </div>
        </div>`;
      diaryList.appendChild(row);
    });

    $$('button[data-del]').forEach(btn=>{
      btn.onclick = async()=>{
        const id = btn.getAttribute('data-del');
        if(!confirm('確定刪除此日記？')) return;
        await db.collection('users').doc(selectedUserId).collection('diaries').doc(id).delete();
        await loadDiariesPage({ direction:'stay' });
      };
    });
  }

  // 分頁與清除
  nextPageBtn.onclick = ()=>loadDiariesPage({ direction:'next' });
  prevPageBtn.onclick = ()=>loadDiariesPage({ direction:'prev' });
  clearFilter.onclick = ()=>{ diaryQ.value=''; diaryMood.value=''; loadDiariesPage({ reset:true }); };

  // 即時篩選（打字就套用）
  diaryQ.addEventListener('input', ()=>loadDiariesPage({ reset:true }));
  diaryMood.addEventListener('change', ()=>loadDiariesPage({ reset:true }));
  </script>
</body>
</html>
