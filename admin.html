<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>我的日記本｜管理後台</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat 10.12.5（與主站一致） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root{ --primary:#7c3aed; }
    .primary{ color:var(--primary); }
    .btn{ padding:.5rem .75rem;border:1px solid #e5e7eb;border-radius:.5rem }
    .btn:hover{ background:#f9fafb }
    .chip{ padding:.125rem .5rem;border-radius:.375rem;background:#f3e8ff;color:#6b21a8;font-size:.75rem }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
  <!-- Top bar -->
  <header class="bg-white/90 backdrop-blur sticky top-0 z-10 border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <h1 class="text-xl md:text-2xl font-bold"><span class="primary">📔 我的日記本</span>｜管理後台</h1>
      <div class="flex items-center gap-2">
        <span id="whoami" class="text-sm text-gray-600"></span>
        <button id="btn-signin" class="btn">使用 Google 登入</button>
        <button id="btn-signout" class="btn hidden">登出</button>
      </div>
    </div>
  </header>

  <!-- 非 admin 提示（已移除按鈕） -->
  <section id="gate" class="max-w-3xl mx-auto px-4 mt-8 hidden">
    <div class="bg-white rounded-2xl shadow p-6 border space-y-3 text-center">
      <h2 class="text-xl font-bold mb-2">需要管理員權限</h2>
      <p class="text-gray-600">
        你已登入，但不是管理員（需要 <code>users/{uid}.role === "admin"</code>）。
      </p>
      <p class="text-sm text-gray-500">
        若你是站主，請於 Firebase Console 手動將自己的使用者文件設為
        <span class="font-semibold text-purple-600">role: "admin"</span>。
      </p>
    </div>
  </section>

  <!-- 主畫面 -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-6 hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左：使用者清單 -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow p-4 border">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-lg">使用者清單</h3>
          <button id="refresh-users" class="btn">重新整理</button>
        </div>
        <input id="user-search" placeholder="搜尋名稱或 Email…" class="w-full border rounded-lg p-2 mb-3"/>
        <div id="users-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">載入中…</div>
      </section>

      <!-- 右：使用者資料 + 篩選 + 日記列表 -->
      <section class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-bold text-lg flex items-center gap-2">
                使用者資料
                <span id="user-role" class="chip hidden"></span>
                <span id="membership-chip" class="chip hidden"></span>
              </h3>
              <div id="user-meta" class="text-sm text-gray-600"></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="toggle-role" class="btn hidden">切換角色（user ⇄ admin）</button>
              <button id="download-json" class="btn hidden">下載此使用者日記 JSON</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="grid md:grid-cols-3 gap-3">
            <input id="diary-q" class="border rounded-lg p-2" placeholder="關鍵字（標題/內容）"/>
            <select id="diary-mood" class="border rounded-lg p-2">
              <option value="">心情：全部</option>
              <option>😊</option><option>😢</option><option>😡</option><option>😰</option>
              <option>😍</option><option>🤔</option><option>😴</option><option>🎉</option>
            </select>
            <div class="flex gap-2">
              <button id="apply-filter" class="btn w-full">套用篩選</button>
              <button id="clear-filter" class="btn w-full">清除</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow p-2 md:p-4 border">
          <div class="flex items-center justify-between px-2 md:px-0 mb-2">
            <h3 class="font-bold">日記列表</h3>
            <div class="text-sm text-gray-500">每頁 30 筆</div>
          </div>
          <div id="diaries-list" class="divide-y"></div>
          <div class="flex justify-between items-center mt-3">
            <button id="prev-page" class="btn">上一頁</button>
            <button id="next-page" class="btn">下一頁</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  // === Firebase 初始化 ===
  const firebaseConfig = {
    apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
    authDomain: "journal-49230.firebaseapp.com",
    projectId: "journal-49230",
    storageBucket: "journal-49230.appspot.com",
    messagingSenderId: "894572383995",
    appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  const $ = (s, r=document)=>r.querySelector(s);
  const toast = (m)=>alert(m);
  const gate = $('#gate'), app = $('#app');
  const who = $('#whoami'), btnSignIn = $('#btn-signin'), btnSignOut = $('#btn-signout');

  auth.onAuthStateChanged(async u=>{
    who.textContent = u ? (u.displayName || u.email || u.uid) : '未登入';
    btnSignIn.classList.toggle('hidden',!!u);
    btnSignOut.classList.toggle('hidden',!u);

    if(!u){ gate.classList.add('hidden'); app.classList.add('hidden'); return; }

    const meSnap = await db.collection('users').doc(u.uid).get();
    const me = meSnap.exists ? meSnap.data() : {};
    if(me.role!=='admin'){
      gate.classList.remove('hidden');
      app.classList.add('hidden');
      return;
    }
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    loadUsers();
  });

  btnSignIn.onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(p);
  };
  btnSignOut.onclick=()=>auth.signOut();

  // 載入使用者清單
  async function loadUsers(){
    const usersList=$('#users-list');
    usersList.textContent='載入中…';
    try{
      const snap=await db.collection('users').get();
      usersList.innerHTML='';
      snap.forEach(d=>{
        const u=d.data();
        const el=document.createElement('div');
        el.className='p-3 border rounded mb-2 hover:bg-gray-50 cursor-pointer';
        el.innerHTML=`<div class="font-semibold">${u.displayName||'(未設定)'}</div>
                      <div class="text-xs text-gray-500">${u.email||''}</div>
                      <div class="text-xs text-gray-400">${d.id}</div>`;
        el.onclick=()=>loadUserDiaries(d.id);
        usersList.appendChild(el);
      });
    }catch(e){
      usersList.innerHTML=`<div class="text-red-600 text-sm">讀取使用者失敗：${e.message}</div>`;
    }
  }

  // 載入使用者日記
  async function loadUserDiaries(uid){
    const diaryList=$('#diaries-list');
    diaryList.innerHTML='載入中…';
    try{
      const snap=await db.collection('users').doc(uid).collection('diaries').orderBy('createdAt','desc').limit(30).get();
      diaryList.innerHTML='';
      snap.forEach(d=>{
        const v=d.data();
        const el=document.createElement('div');
        el.className='p-3';
        el.innerHTML=`<div class="font-semibold">${v.title||'(無標題)'}</div>
                      <div class="text-sm text-gray-600">${v.content||''}</div>
                      <div class="text-xs text-gray-400">${new Date(v.createdAt?.toDate?.()||v.createdAt||Date.now()).toLocaleString()}</div>`;
        diaryList.appendChild(el);
      });
      if(snap.empty) diaryList.innerHTML='<div class="text-gray-400 p-3 text-sm">尚無日記</div>';
    }catch(e){
      diaryList.innerHTML=`<div class="text-red-600 text-sm">讀取日記失敗：${e.message}</div>`;
    }
  }
  </script>
</body>
</html>
