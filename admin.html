<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>我的日記本｜管理後台</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat 10.12.5（與主站一致） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root{ --primary:#7c3aed; }
    .primary{ color:var(--primary); }
    .btn{ padding:.5rem .75rem;border:1px solid #e5e7eb;border-radius:.5rem }
    .btn:hover{ background:#f9fafb }
    .btn-primary{ padding:.5rem .75rem;border-radius:.5rem;color:#fff;background:var(--primary) }
    .chip{ padding:.125rem .5rem;border-radius:.375rem;background:#f3e8ff;color:#6b21a8;font-size:.75rem }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
  <!-- Top bar -->
  <header class="bg-white/90 backdrop-blur sticky top-0 z-10 border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <h1 class="text-xl md:text-2xl font-bold"><span class="primary">📔 我的日記本</span>｜管理後台</h1>
      <div class="flex items-center gap-2">
        <span id="whoami" class="text-sm text-gray-600"></span>
        <button id="btn-signin" class="btn">使用 Google 登入</button>
        <button id="btn-signout" class="btn hidden">登出</button>
      </div>
    </div>
  </header>

 <!-- 非 admin 提示（已移除按鈕） -->
<section id="gate" class="max-w-3xl mx-auto px-4 mt-8 hidden">
  <div class="bg-white rounded-2xl shadow p-6 border space-y-3 text-center">
    <h2 class="text-xl font-bold mb-2">需要管理員權限</h2>
    <p class="text-gray-600">
      你已登入，但不是管理員（需要 <code>users/{uid}.role === "admin"</code>）。
    </p>
    <p class="text-sm text-gray-500">
      若你是站主，請由 Firebase Console 手動將自己的使用者文件設為
      <span class="font-semibold text-purple-600">role: "admin"</span>。
    </p>
  </div>
</section>

  <!-- 主畫面 -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-6 hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左：使用者清單 -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow p-4 border">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-lg">使用者清單</h3>
          <button id="refresh-users" class="btn">重新整理</button>
        </div>
        <input id="user-search" placeholder="搜尋名稱或 Email…" class="w-full border rounded-lg p-2 mb-3"/>
        <div id="users-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">載入中…</div>
      </section>

      <!-- 右：使用者資料 + 篩選 + 日記列表 -->
      <section class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-bold text-lg flex items-center gap-2">
                使用者資料
                <span id="user-role" class="chip hidden"></span>
                <span id="membership-chip" class="chip hidden"></span>
              </h3>
              <div id="user-meta" class="text-sm text-gray-600"></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="toggle-role" class="btn hidden">切換角色（user ⇄ admin）</button>
              <button id="download-json" class="btn hidden">下載此使用者日記 JSON</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="grid md:grid-cols-3 gap-3">
            <input id="diary-q" class="border rounded-lg p-2" placeholder="關鍵字（標題/內容）"/>
            <select id="diary-mood" class="border rounded-lg p-2">
              <option value="">心情：全部</option>
              <option>😊</option><option>😢</option><option>😡</option><option>😰</option>
              <option>😍</option><option>🤔</option><option>😴</option><option>🎉</option>
            </select>
            <div class="flex gap-2">
              <button id="apply-filter" class="btn w-full">套用篩選</button>
              <button id="clear-filter" class="btn w-full">清除</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow p-2 md:p-4 border">
          <div class="flex items-center justify-between px-2 md:px-0 mb-2">
            <h3 class="font-bold">日記列表</h3>
            <div class="text-sm text-gray-500">每頁 30 筆</div>
          </div>
          <div id="diaries-list" class="divide-y"></div>
          <div class="flex justify-between items-center mt-3">
            <button id="prev-page" class="btn">上一頁</button>
            <button id="next-page" class="btn">下一頁</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  // === Firebase 初始化（沿用你的設定） ===
  const firebaseConfig = {
    apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
    authDomain: "journal-49230.firebaseapp.com",
    projectId: "journal-49230",
    storageBucket: "journal-49230.appspot.com",
    messagingSenderId: "894572383995",
    appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ===== 工具 =====
  const $ = (s, r=document)=>r.querySelector(s);
  const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));
  const fmtTime = (iso)=>{
    try{ const d=new Date(typeof iso?.toDate==="function"?iso.toDate():iso); return isNaN(d)?'—':d.toLocaleString('zh-TW'); }catch{ return '—'; }
  };
  const toast = (msg)=>{ alert(msg); };

  // ===== UI refs =====
  const gate = $('#gate'), app = $('#app'), who = $('#whoami');
  const btnSignIn  = $('#btn-signin'), btnSignOut = $('#btn-signout');
  const makeMeAdmin = $('#make-me-admin'), ruleHelp = $('#rule-help'), rulesSnippet = $('#rules-snippet');

  const usersList = $('#users-list'), userSearch = $('#user-search'), refreshUsers = $('#refresh-users');
  const userMeta = $('#user-meta'), userRoleChip = $('#user-role'), membershipChip = $('#membership-chip');
  const toggleRoleBtn = $('#toggle-role'), downloadBtn = $('#download-json');

  const diaryList = $('#diaries-list'), diaryQ = $('#diary-q'), diaryMood = $('#diary-mood');
  const applyFilter = $('#apply-filter'), clearFilter = $('#clear-filter');
  const prevPageBtn = $('#prev-page'), nextPageBtn = $('#next-page');

  // ===== 狀態 =====
  let me = null, meProfile = null, selectedUserId = null, selectedUserDoc = null;
  const PAGE = 30; let pagestack = []; let lastDoc = null;
  let allUsersCache = [];

  // ===== Auth =====
  btnSignIn.onclick = async()=>{ const p=new firebase.auth.GoogleAuthProvider(); await auth.signInWithPopup(p); };
  btnSignOut.onclick = ()=>auth.signOut();
  ruleHelp.onclick = ()=>rulesSnippet.classList.toggle('hidden');

  auth.onAuthStateChanged(async(u)=>{
    me = u||null;
    who.textContent = me ? (me.displayName || me.email || me.uid) : '未登入';
    btnSignIn.classList.toggle('hidden', !!me);
    btnSignOut.classList.toggle('hidden', !me);

    if(!me){ gate.classList.add('hidden'); app.classList.add('hidden'); return; }

    // 讀自己的 role（抓不到就視為 user）
    try{
      const meSnap = await db.collection('users').doc(me.uid).get();
      meProfile = meSnap.exists ? meSnap.data() : { role:'user' };
    }catch(err){
      console.error('讀取自己 users/{uid} 失敗：', err);
      meProfile = { role:'user' };
    }

    if(meProfile.role !== 'admin'){
      gate.classList.remove('hidden'); app.classList.add('hidden');
    }else{
      gate.classList.add('hidden'); app.classList.remove('hidden');
      await loadUsers();
    }
  });

  // 一鍵把自己設為 admin（只有不是 admin 才看得到 gate 區塊）
  makeMeAdmin.onclick = async()=>{
    if(!me){ toast('請先登入'); return; }
    try{
      await db.collection('users').doc(me.uid).set({
        role:'admin',
        email: me.email || null,
        displayName: me.displayName || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      toast('已把你設為 admin，重新載入頁面即可進入後台');
      location.reload();
    }catch(err){ console.error(err); toast('寫入失敗：'+err.message); }
  };

  // ===== 使用者清單（加上 try/catch，錯誤時不會卡在「載入中」） =====
  async function loadUsers(){
    usersList.textContent = '載入中…';
    try{
      const snap = await db.collection('users').get();
      allUsersCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      renderUserList();
    }catch(err){
      console.error('讀取 users 失敗：', err);
      usersList.innerHTML = `<div class="text-red-600 text-sm">讀取使用者失敗：${err.message}<br/>請確認 Firestore 規則已允許 admin 列出 users。</div>`;
    }
  }
  function renderUserList(){
    const q = userSearch.value.trim().toLowerCase();
    const rows = allUsersCache
      .filter(u=>{
        const name = (u.displayName||'').toLowerCase();
        const email= (u.email||'').toLowerCase();
        return !q || name.includes(q) || email.includes(q) || u.id.includes(q);
      })
      .sort((a,b)=> (b.membership?.tier||'').localeCompare(a.membership?.tier||''));
    usersList.innerHTML = '';
    if(rows.length===0){
      usersList.innerHTML = '<div class="text-gray-400 text-sm px-2">尚無使用者文件（請先讓 App 寫入 users/{uid}）</div>';
      return;
    }
    rows.forEach(u=>{
      const el = document.createElement('button');
      el.className = `w-full text-left p-3 rounded-lg border hover:bg-gray-50 ${selectedUserId===u.id?'border-2 border-purple-400 bg-purple-50':''}`;
      const role = u.role||'user';
      const tier = u.membership?.tier||'free';
      el.innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold">${u.displayName||'(未設定名稱)'}</div>
            <div class="text-xs text-gray-500">${u.email||''}</div>
            <div class="text-xs text-gray-500">UID：${u.id}</div>
          </div>
          <div class="text-right space-y-1">
            <div><span class="chip">${role}</span></div>
            <div><span class="chip">tier: ${tier}</span></div>
          </div>
        </div>`;
      el.onclick = ()=> selectUser(u.id, u);
      usersList.appendChild(el);
    });
  }
  userSearch.oninput = renderUserList;
  refreshUsers.onclick = loadUsers;

  // ===== 選擇使用者 → 載資料 =====
  async function selectUser(uid, doc){
    selectedUserId = uid;
    selectedUserDoc = doc || allUsersCache.find(x=>x.id===uid);
    const role = selectedUserDoc?.role || 'user';
    const tier = selectedUserDoc?.membership?.tier || 'free';
    const exp  = selectedUserDoc?.membership?.expiresAt ? fmtTime(selectedUserDoc.membership.expiresAt) : null;

    $('#user-role').textContent = role;
    $('#user-role').classList.remove('hidden');
    $('#membership-chip').textContent = `tier: ${tier}${exp?`｜到期：${exp}`:''}`;
    $('#membership-chip').classList.remove('hidden');
    userMeta.innerHTML = `
      <div class="text-gray-600">
        <div>名稱：<span class="font-medium">${selectedUserDoc.displayName||'(未設定)'}</span></div>
        <div>Email：<span class="font-medium">${selectedUserDoc.email||'—'}</span></div>
      </div>`;
    toggleRoleBtn.classList.remove('hidden');
    downloadBtn.classList.remove('hidden');

    pagestack = []; lastDoc = null;
    await loadDiariesPage({ reset:true });
    renderUserList();
  }

  // ===== 日記（分頁 + 篩選） =====
  async function loadDiariesPage({ reset=false, direction='next' }={}){
    if(!selectedUserId){ diaryList.innerHTML='<div class="p-3 text-gray-500 text-sm">尚未選取使用者</div>'; return; }
    diaryList.innerHTML = '<div class="p-3 text-gray-500 text-sm">載入中…</div>';

    const qText = diaryQ.value.trim().toLowerCase();
    const mood  = diaryMood.value;

    try{
      let q = db.collection('users').doc(selectedUserId).collection('diaries')
        .orderBy('createdAt','desc').limit(PAGE);

      if(direction==='next' && lastDoc){ q = q.startAfter(lastDoc); }
      if(direction==='prev' && pagestack.length>1){
        pagestack.pop();
        const startAtDoc = pagestack[pagestack.length-1];
        q = db.collection('users').doc(selectedUserId).collection('diaries')
              .orderBy('createdAt','desc').startAt(startAtDoc).limit(PAGE);
      }
      const snap = await q.get();

      if(snap.docs.length>0){
        const firstOnPage = snap.docs[0];
        if(direction==='next' || reset) pagestack.push(firstOnPage);
        lastDoc = snap.docs[snap.docs.length-1];
      }else{
        if(direction==='next') lastDoc = null;
      }

      const raw = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      const rows = raw.filter(d=>{
        const hitQ = !qText ||
          (String(d.title||'').toLowerCase().includes(qText)) ||
          (String(d.content||'').toLowerCase().includes(qText));
        const hitM = !mood || d.mood===mood;
        return hitQ && hitM;
      });
      renderDiaries(rows);
    }catch(err){
      console.error('讀取 diaries 失敗：', err);
      diaryList.innerHTML = `<div class="p-3 text-red-600 text-sm">讀取失敗：${err.message}</div>`;
    }
  }
  function renderDiaries(rows){
    diaryList.innerHTML = '';
    if(rows.length===0){ diaryList.innerHTML = '<div class="p-3 text-gray-400 text-sm">沒有資料或已到最末頁</div>'; return; }
    rows.forEach(d=>{
      const tags = (d.tags||[]).map(t=>`<span class="chip mr-1 mb-1">#${t}</span>`).join('');
      const privateBadge = d.isPrivate ? `<span class="chip">私密</span>`:'';
      const imgs = Array.isArray(d.images) ? d.images.slice(0,3) : [];
      const row = document.createElement('div');
      row.className = 'p-3';
      row.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">${d.mood||''}</span>
              <span class="text-xl">${d.weather||''}</span>
              ${privateBadge}
              ${tags}
            </div>
            <div class="font-semibold truncate">${d.title||'(無標題)'}</div>
            <div class="text-xs text-gray-500">${fmtTime(d.createdAt)} ｜ ID: ${d.id}</div>
            <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${(d.isPrivate?'（私密內容）':(d.content||''))}</p>
            ${imgs.length?`<div class="flex gap-2 mt-2">${imgs.map(u=>`<img src="${u}" class="w-16 h-16 object-cover rounded border"/>`).join('')}</div>`:''}
          </div>
          <div class="flex flex-col gap-2 items-end">
            <button data-del="${d.id}" class="btn text-red-600">刪除</button>
          </div>
        </div>`;
      diaryList.appendChild(row);
    });
    $$('button[data-del]').forEach(btn=>{
      btn.onclick = async()=>{
        const id = btn.getAttribute('data-del');
        if(!confirm('確定刪除此日記？')) return;
        await db.collection('users').doc(selectedUserId).collection('diaries').doc(id).delete();
        await loadDiariesPage({ direction:'stay' });
      };
    });
  }
  nextPageBtn.onclick = ()=>loadDiariesPage({ direction:'next' });
  prevPageBtn.onclick = ()=>loadDiariesPage({ direction:'prev' });
  applyFilter.onclick = ()=>loadDiariesPage({ reset:true });
  clearFilter.onclick = ()=>{ diaryQ.value=''; diaryMood.value=''; loadDiariesPage({ reset:true }); };

  // 下載全部 JSON
  downloadBtn.onclick = async()=>{
    if(!selectedUserId) return;
    if(!confirm('下載此使用者「全部」日記為 JSON？（可能較久）')) return;
    try{
      let q = db.collection('users').doc(selectedUserId).collection('diaries').orderBy('createdAt','desc');
      const all = []; let last=null;
      while(true){
        let cur = q; if(last) cur = cur.startAfter(last);
        const snap = await cur.limit(500).get();
        if(snap.empty) break;
        snap.forEach(d=>all.push({ id:d.id, ...d.data() }));
        last = snap.docs[snap.docs.length-1];
        if(snap.size<500) break;
      }
      const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${selectedUserId}_diaries.json`; a.click();
      URL.revokeObjectURL(url);
    }catch(err){
      console.error(err); toast('下載失敗：'+err.message);
    }
  };

  // 切換被選使用者角色
  toggleRoleBtn.onclick = async()=>{
    if(!selectedUserId || !selectedUserDoc) return;
    const next = selectedUserDoc.role==='admin' ? 'user' : 'admin';
    if(!confirm(`將此使用者角色改為 ${next} ？`)) return;
    try{
      await db.collection('users').doc(selectedUserId).set({ role: next }, { merge:true });
      selectedUserDoc.role = next;
      const idx = allUsersCache.findIndex(u=>u.id===selectedUserId);
      if(idx>=0) allUsersCache[idx].role = next;
      await selectUser(selectedUserId, selectedUserDoc);
    }catch(err){ console.error(err); toast('更新角色失敗：'+err.message); }
  };
  </script>
</body>
</html>
