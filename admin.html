<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>我的日記本｜管理後台</title>

  <!-- UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase compat 10.12.5（與你現有版本一致） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

  <style>
    :root{ --primary:#7c3aed; }
    .primary{ color:var(--primary); }
    .btn{ @apply px-3 py-2 rounded-lg border hover:bg-gray-50; }
    .btn-primary{ @apply px-3 py-2 rounded-lg text-white; background:var(--primary); }
    .chip{ @apply px-2 py-0.5 rounded bg-purple-100 text-purple-700 text-xs; }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
  <!-- Top bar -->
  <header class="bg-white/90 backdrop-blur sticky top-0 z-10 border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <h1 class="text-xl md:text-2xl font-bold"><span class="primary">📔 我的日記本</span>｜管理後台</h1>
      <div class="flex items-center gap-2">
        <span id="whoami" class="text-sm text-gray-600"></span>
        <button id="btn-signin" class="btn">使用 Google 登入</button>
        <button id="btn-signout" class="btn hidden">登出</button>
      </div>
    </div>
  </header>

  <!-- Gate -->
  <section id="gate" class="max-w-3xl mx-auto px-4 mt-8 hidden">
    <div class="bg-white rounded-2xl shadow p-6 border">
      <h2 class="text-xl font-bold mb-2">權限不足</h2>
      <p class="text-gray-600 mb-3">你已登入，但不是管理員（需要 <code>users/{uid}.role === "admin"</code>）。</p>
      <p class="text-sm text-gray-500">
        請用管理員帳號登入，或請現有管理員將你的角色設為 admin。
      </p>
    </div>
  </section>

  <!-- Main -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-6 hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左：使用者清單 -->
      <section class="lg:col-span-1 bg-white rounded-2xl shadow p-4 border">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-lg">使用者清單</h3>
          <button id="refresh-users" class="btn">重新整理</button>
        </div>
        <input id="user-search" placeholder="搜尋名稱或 Email…" class="w-full border rounded-lg p-2 mb-3"/>
        <div id="users-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1"></div>
      </section>

      <!-- 右：選定使用者明細 + 日記 -->
      <section class="lg:col-span-2 space-y-6">
        <!-- 使用者檔案 -->
        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-bold text-lg flex items-center gap-2">
                使用者資料
                <span id="user-role" class="chip hidden"></span>
                <span id="membership-chip" class="chip hidden"></span>
              </h3>
              <div id="user-meta" class="text-sm text-gray-600"></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="toggle-role" class="btn hidden">切換角色（user ⇄ admin）</button>
              <button id="download-json" class="btn hidden">下載此使用者日記 JSON</button>
            </div>
          </div>
        </div>

        <!-- 篩選列 -->
        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="grid md:grid-cols-3 gap-3">
            <input id="diary-q" class="border rounded-lg p-2" placeholder="關鍵字（標題/內容）"/>
            <select id="diary-mood" class="border rounded-lg p-2">
              <option value="">心情：全部</option>
              <option>😊</option><option>😢</option><option>😡</option><option>😰</option>
              <option>😍</option><option>🤔</option><option>😴</option><option>🎉</option>
            </select>
            <div class="flex gap-2">
              <button id="apply-filter" class="btn w-full">套用篩選</button>
              <button id="clear-filter" class="btn w-full">清除</button>
            </div>
          </div>
        </div>

        <!-- 日記列表 -->
        <div class="bg-white rounded-2xl shadow p-2 md:p-4 border">
          <div class="flex items-center justify-between px-2 md:px-0 mb-2">
            <h3 class="font-bold">日記列表</h3>
            <div class="text-sm text-gray-500">
              每頁 30 筆
            </div>
          </div>
          <div id="diaries-list" class="divide-y"></div>
          <div class="flex justify-between items-center mt-3">
            <button id="prev-page" class="btn">上一頁</button>
            <button id="next-page" class="btn">下一頁</button>
          </div>
        </div>

        <!-- 優惠券管理（簡版） -->
        <div class="bg-white rounded-2xl shadow p-4 border">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold">優惠券管理</h3>
            <button id="refresh-coupons" class="btn">重新整理</button>
          </div>
          <div class="grid md:grid-cols-4 gap-2 mb-2">
            <input id="coupon-code" class="border rounded-lg p-2" placeholder="代碼，如 OFF200"/>
            <input id="coupon-amount" type="number" class="border rounded-lg p-2" placeholder="折抵金額（NT$）"/>
            <select id="coupon-active" class="border rounded-lg p-2">
              <option value="true">啟用</option>
              <option value="false">停用</option>
            </select>
            <button id="save-coupon" class="btn-primary">建立 / 更新</button>
          </div>
          <div id="coupon-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
  // ===== Firebase 初始化（沿用你的設定） =====
  const firebaseConfig = {
    apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
    authDomain: "journal-49230.firebaseapp.com",
    projectId: "journal-49230",
    storageBucket: "journal-49230.appspot.com",
    messagingSenderId: "894572383995",
    appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ===== 元件 =====
  const $ = (s, r=document)=>r.querySelector(s);
  const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));
  const fmtTime = (iso)=>{
    try{ const d=new Date(typeof iso?.toDate==="function"?iso.toDate():iso); return isNaN(d)?'—':d.toLocaleString('zh-TW'); }catch{ return '—'; }
  };

  // ===== UI refs =====
  const gate = $('#gate');
  const app  = $('#app');
  const who  = $('#whoami');
  const btnSignIn  = $('#btn-signin');
  const btnSignOut = $('#btn-signout');

  const usersList     = $('#users-list');
  const userSearch    = $('#user-search');
  const refreshUsers  = $('#refresh-users');
  const userMeta      = $('#user-meta');
  const userRoleChip  = $('#user-role');
  const membershipChip= $('#membership-chip');
  const toggleRoleBtn = $('#toggle-role');
  const downloadBtn   = $('#download-json');

  const diaryList   = $('#diaries-list');
  const diaryQ      = $('#diary-q');
  const diaryMood   = $('#diary-mood');
  const applyFilter = $('#apply-filter');
  const clearFilter = $('#clear-filter');
  const prevPageBtn = $('#prev-page');
  const nextPageBtn = $('#next-page');

  const couponCode   = $('#coupon-code');
  const couponAmount = $('#coupon-amount');
  const couponActive = $('#coupon-active');
  const couponList   = $('#coupon-list');
  const refreshCoupons = $('#refresh-coupons');
  const saveCoupon     = $('#save-coupon');

  // ===== 狀態 =====
  let me = null;               // 目前登入者
  let meProfile = null;        // 目前登入者 users/{uid} 資料
  let selectedUserId = null;   // 左側被選取的使用者
  let selectedUserDoc = null;

  // 分頁
  const PAGE = 30;
  let pagestack = [];   // 堆疊保存每一頁的起點
  let lastDoc = null;   // 下一頁的起點（上一批的最後一筆）

  // ===== Auth =====
  btnSignIn.onclick = async()=>{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  };
  btnSignOut.onclick = ()=>auth.signOut();

  auth.onAuthStateChanged(async(u)=>{
    me = u||null;
    who.textContent = me ? (me.displayName || me.email || me.uid) : '未登入';
    btnSignIn.classList.toggle('hidden', !!me);
    btnSignOut.classList.toggle('hidden', !me);

    if(!me){
      gate.classList.add('hidden');
      app.classList.add('hidden');
      return;
    }
    // 讀我自己的 role
    const meSnap = await db.collection('users').doc(me.uid).get().catch(()=>null);
    meProfile = meSnap?.exists ? meSnap.data() : { role:'user' };

    if(meProfile.role !== 'admin'){
      gate.classList.remove('hidden');
      app.classList.add('hidden');
      return;
    }

    gate.classList.add('hidden');
    app.classList.remove('hidden');
    await loadUsers();
    await loadCoupons();
  });

  // ===== 使用者清單 =====
  let allUsersCache = [];
  async function loadUsers(){
    usersList.innerHTML = '<div class="text-gray-500 text-sm px-2">載入中…</div>';
    const snap = await db.collection('users').get();
    allUsersCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    renderUserList();
  }
  function renderUserList(){
    const q = userSearch.value.trim().toLowerCase();
    const rows = allUsersCache
      .filter(u=>{
        const name = (u.displayName||'').toLowerCase();
        const email= (u.email||'').toLowerCase();
        return !q || name.includes(q) || email.includes(q) || u.id.includes(q);
      })
      .sort((a,b)=> (b.membership?.tier||'').localeCompare(a.membership?.tier||'')); // 簡單排序：會員在前
    usersList.innerHTML = '';
    if(rows.length===0){
      usersList.innerHTML = '<div class="text-gray-400 text-sm px-2">沒有符合的使用者</div>';
      return;
    }
    rows.forEach(u=>{
      const el = document.createElement('button');
      el.className = `w-full text-left p-3 rounded-lg border hover:bg-gray-50 ${selectedUserId===u.id?'border-2 border-purple-400 bg-purple-50':''}`;
      const role = u.role||'user';
      const tier = u.membership?.tier||'free';
      el.innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold">${u.displayName||'(未設定名稱)'}</div>
            <div class="text-xs text-gray-500">${u.email||''}</div>
            <div class="text-xs text-gray-500">UID：${u.id}</div>
          </div>
          <div class="text-right space-y-1">
            <div><span class="chip">${role}</span></div>
            <div><span class="chip">tier: ${tier}</span></div>
          </div>
        </div>
      `;
      el.onclick = ()=> selectUser(u.id, u);
      usersList.appendChild(el);
    });
  }
  userSearch.oninput = renderUserList;
  refreshUsers.onclick = loadUsers;

  async function selectUser(uid, doc){
    selectedUserId = uid;
    selectedUserDoc = doc || allUsersCache.find(x=>x.id===uid) || (await db.collection('users').doc(uid).get()).data();

    // 檔案區塊
    const role = selectedUserDoc?.role || 'user';
    const tier = selectedUserDoc?.membership?.tier || 'free';
    const exp  = selectedUserDoc?.membership?.expiresAt ? fmtTime(selectedUserDoc.membership.expiresAt) : null;

    userRoleChip.textContent = role;
    userRoleChip.classList.remove('hidden');
    membershipChip.textContent = `tier: ${tier}${exp?`｜到期：${exp}`:''}`;
    membershipChip.classList.remove('hidden');

    userMeta.innerHTML = `
      <div class="text-gray-600">
        <div>名稱：<span class="font-medium">${selectedUserDoc.displayName||'(未設定)'}</span></div>
        <div>Email：<span class="font-medium">${selectedUserDoc.email||'—'}</span></div>
        <div>私密日記密碼：${selectedUserDoc.privatePasswordHash ? '<span class="text-green-700">已設定</span>' : '<span class="text-gray-400">未設定</span>'}</div>
      </div>
    `;
    toggleRoleBtn.classList.remove('hidden');
    downloadBtn.classList.remove('hidden');

    // 重置分頁並載入第一頁
    pagestack = [];
    lastDoc = null;
    await loadDiariesPage({ reset:true });
    renderUserList(); // 讓左邊高亮更新
  }

  // ===== 載入日記（分頁） =====
  async function loadDiariesPage({ reset=false, direction='next' }={}){
    if(!selectedUserId){ diaryList.innerHTML='<div class="p-3 text-gray-500 text-sm">尚未選取使用者</div>'; return; }

    const qText = diaryQ.value.trim().toLowerCase();
    const mood  = diaryMood.value;

    // 基本 query
    let q = db.collection('users').doc(selectedUserId).collection('diaries').orderBy('createdAt','desc').limit(PAGE);

    if(direction==='next' && lastDoc){
      q = q.startAfter(lastDoc);
    }
    if(direction==='prev' && pagestack.length>1){
      // 退回上一頁：pop 當前頁起點，取上上一頁起點
      pagestack.pop();
      const startAtDoc = pagestack[pagestack.length-1];
      q = db.collection('users').doc(selectedUserId).collection('diaries').orderBy('createdAt','desc').startAt(startAtDoc).limit(PAGE);
    }else if(direction==='prev' && pagestack.length<=1){
      // 已在第一頁
      q = db.collection('users').doc(selectedUserId).collection('diaries').orderBy('createdAt','desc').limit(PAGE);
    }
    const snap = await q.get();

    // 記住分頁位置（第一筆做為該頁起點）
    if(snap.docs.length>0){
      const firstOnPage = snap.docs[0];
      if(direction==='next' || reset){
        pagestack.push(firstOnPage);
      }
      lastDoc = snap.docs[snap.docs.length-1];
    } else {
      if(direction==='next') lastDoc = null;
    }

    // 先把本頁結果 render，再做前端過濾（關鍵字/心情）
    const raw = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    const rows = raw.filter(d=>{
      const hitQ = !qText ||
        (String(d.title||'').toLowerCase().includes(qText)) ||
        (String(d.content||'').toLowerCase().includes(qText));
      const hitM = !mood || d.mood===mood;
      return hitQ && hitM;
    });

    renderDiaries(rows);
  }

  function renderDiaries(rows){
    diaryList.innerHTML = '';
    if(rows.length===0){
      diaryList.innerHTML = '<div class="p-3 text-gray-400 text-sm">沒有資料或已到最末頁</div>';
      return;
    }
    rows.forEach(d=>{
      const tags = (d.tags||[]).map(t=>`<span class="chip mr-1 mb-1">#${t}</span>`).join('');
      const privateBadge = d.isPrivate ? `<span class="chip">私密</span>`:'';
      const fav = d.isFavorite ? 'text-red-500' : 'text-gray-300';
      const imgs = Array.isArray(d.images) ? d.images.slice(0,3) : [];

      const row = document.createElement('div');
      row.className = 'p-3';
      row.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-2xl">${d.mood||''}</span>
              <span class="text-xl">${d.weather||''}</span>
              ${privateBadge}
              ${tags}
            </div>
            <div class="font-semibold truncate">${d.title||'(無標題)'}</div>
            <div class="text-xs text-gray-500">${fmtTime(d.createdAt)} ｜ ID: ${d.id}</div>
            <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${(d.isPrivate?'（已標示私密，內容可能應受保護）':(d.content||''))}</p>
            ${imgs.length?`
              <div class="flex gap-2 mt-2">${imgs.map(u=>`<img src="${u}" class="w-16 h-16 object-cover rounded border"/>`).join('')}</div>
            `:''}
          </div>
          <div class="flex flex-col gap-2 items-end">
            <button data-del="${d.id}" class="btn text-red-600">刪除</button>
            <div class="${fav}" title="${d.isFavorite?'已加最愛':'未加最愛'}">♥</div>
          </div>
        </div>
      `;
      diaryList.appendChild(row);
    });

    // 綁定刪除
    $$('button[data-del]').forEach(btn=>{
      btn.onclick = async()=>{
        const id = btn.getAttribute('data-del');
        if(!confirm('確定刪除此日記？')) return;
        await db.collection('users').doc(selectedUserId).collection('diaries').doc(id).delete();
        // 重新載入目前頁
        await loadDiariesPage({ reset:false, direction:'stay' });
      };
    });
  }

  // 分頁按鈕
  nextPageBtn.onclick = ()=>loadDiariesPage({ direction:'next' });
  prevPageBtn.onclick = ()=>loadDiariesPage({ direction:'prev' });

  // 篩選
  applyFilter.onclick = ()=>loadDiariesPage({ reset:true });
  clearFilter.onclick = ()=>{
    diaryQ.value=''; diaryMood.value='';
    loadDiariesPage({ reset:true });
  };

  // 下載 JSON（目前頁或全部）
  downloadBtn.onclick = async()=>{
    if(!selectedUserId) return;
    if(!confirm('下載此使用者「全部」日記為 JSON？（可能較久）')) return;
    let q = db.collection('users').doc(selectedUserId).collection('diaries').orderBy('createdAt','desc');
    const all = [];
    let last=null;
    while(true){
      let cur = q; if(last) cur = cur.startAfter(last);
      const snap = await cur.limit(500).get();
      if(snap.empty) break;
      snap.forEach(d=>all.push({ id:d.id, ...d.data() }));
      last = snap.docs[snap.docs.length-1];
      if(snap.size<500) break;
    }
    const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`${selectedUserId}_diaries.json`; a.click();
    URL.revokeObjectURL(url);
  };

  // 切換角色
  toggleRoleBtn.onclick = async()=>{
    if(!selectedUserId || !selectedUserDoc) return;
    const now = selectedUserDoc.role==='admin' ? 'user' : 'admin';
    if(!confirm(`將此使用者角色改為 ${now} ？`)) return;
    await db.collection('users').doc(selectedUserId).set({ role: now }, { merge:true });
    // 更新快取與畫面
    selectedUserDoc.role = now;
    const idx = allUsersCache.findIndex(u=>u.id===selectedUserId);
    if(idx>=0) allUsersCache[idx].role = now;
    await selectUser(selectedUserId, selectedUserDoc);
  };

  // ===== 優惠券管理 =====
  async function loadCoupons(){
    couponList.innerHTML = '<div class="text-gray-500 text-sm">載入中…</div>';
    const snap = await db.collection('coupons').orderBy(firebase.firestore.FieldPath.documentId()).get();
    const rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    couponList.innerHTML = '';
    if(rows.length===0){
      couponList.innerHTML = '<div class="text-gray-400 text-sm">尚無優惠券</div>';
      return;
    }
    rows.forEach(c=>{
      const line = document.createElement('div');
      line.className = 'p-2 rounded border flex items-center justify-between';
      line.innerHTML = `
        <div>
          <div class="font-medium">${c.id}</div>
          <div class="text-xs text-gray-500">折抵：NT$ ${Number(c.discountAmount||0)} ｜ 啟用：${c.active!==false}</div>
        </div>
        <div class="flex gap-2">
          <button data-on="${c.id}" class="btn">${c.active!==false?'停用':'啟用'}</button>
          <button data-delc="${c.id}" class="btn text-red-600">刪除</button>
        </div>
      `;
      couponList.appendChild(line);
    });

    // 啟用/停用
    $$('button[data-on]').forEach(b=>{
      b.onclick = async()=>{
        const id = b.getAttribute('data-on');
        const doc = rows.find(x=>x.id===id);
        const next = !(doc.active!==false);
        await db.collection('coupons').doc(id).set({ active: next }, { merge:true });
        loadCoupons();
      };
    });
    // 刪除
    $$('button[data-delc]').forEach(b=>{
      b.onclick = async()=>{
        const id = b.getAttribute('data-delc');
        if(!confirm(`刪除優惠券 ${id} ？`)) return;
        await db.collection('coupons').doc(id).delete();
        loadCoupons();
      };
    });
  }

  refreshCoupons.onclick = loadCoupons;
  saveCoupon.onclick = async()=>{
    const code = couponCode.value.trim();
    const amount = Math.max(0, parseInt(couponAmount.value||'0'));
    const active = (couponActive.value==='true');
    if(!code){ alert('請輸入代碼'); return; }
    await db.collection('coupons').doc(code).set({
      code, discountAmount: amount, active,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: me?.uid||'(admin)'
    }, { merge:true });
    couponCode.value=''; couponAmount.value='0';
    loadCoupons();
  };

  // ===== Firestore 規則參考（請放到你的規則中，僅供參考）
  /*
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function isAdmin() {
        return request.auth != null && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == "admin";
      }

      // 讓用戶自己讀/寫自己的資料
      match /users/{uid} {
        allow read, update: if request.auth != null && request.auth.uid == uid;
        allow create: if request.auth != null;
        // 管理員可讀寫所有 users/* 文件
        allow read, write: if isAdmin();

        match /diaries/{doc} {
          // 本人或管理員
          allow read, write: if (request.auth != null && request.auth.uid == uid) || isAdmin();
        }
      }

      match /coupons/{code} {
        allow read: if true;
        allow write: if isAdmin();
      }
      match /coupon_redemptions/{id} {
        allow read: if isAdmin();
        allow write: if isAdmin();
      }
    }
