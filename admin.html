<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理後台 - 我的日記本</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    :root { --primary: #7c3aed; }
    .primary-bg { background: var(--primary) !important; }
    .primary-text { color: var(--primary) !important; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase 初始化
    const firebaseConfig = {
      apiKey: "AIzaSyCiho09ggVwKk96ItVof-iB38NrZkr_k5w",
      authDomain: "journal-49230.firebaseapp.com",
      projectId: "journal-49230",
      storageBucket: "journal-49230.appspot.com",
      messagingSenderId: "894572383995",
      appId: "1:894572383995:web:a41e4e58a5d3218fee6a5e"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 圖示元件
    const Icon = ({ name, className="w-5 h-5" }) => {
      const paths = {
        user: "M12 12a5 5 0 100-10 5 5 0 000 10zm7 10H5a7 7 0 0114 0z",
        users: "M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75",
        book: "M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 016.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z",
        gift: "M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z",
        search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
        x: "M6 18L18 6M6 6l12 12",
        trash: "M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2m-6 5v6m4-6v6",
        edit: "M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z",
        shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
        activity: "M22 12h-4l-3 9L9 3l-3 9H2",
        menu: "M3 12h18M3 6h18M3 18h18",
      };
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" 
             strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
          <path d={paths[name]} />
        </svg>
      );
    };

    // 日期工具
    const toDate = (val) => {
      try {
        if (!val) return null;
        if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
        if (typeof val === 'object' && typeof val.toDate === 'function') {
          return val.toDate();
        }
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
      } catch { return null; }
    };

    // 統計卡片元件
    const StatCard = ({ icon, title, value, subtitle, color = "blue" }) => {
      const colorClasses = {
        blue: "bg-blue-500",
        green: "bg-green-500",
        purple: "bg-purple-500",
        orange: "bg-orange-500"
      };
      return (
        <div className="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition">
          <div className="flex items-center justify-between">
            <div>
              <p className="text-gray-500 text-sm mb-1">{title}</p>
              <h3 className="text-3xl font-bold mb-1">{value}</h3>
              {subtitle && <p className="text-xs text-gray-400">{subtitle}</p>}
            </div>
            <div className={`${colorClasses[color]} p-4 rounded-lg text-white`}>
              <Icon name={icon} className="w-8 h-8" />
            </div>
          </div>
        </div>
      );
    };

    // 使用者表格元件
    const UsersTable = ({ users, onEdit, onDelete, onViewDiaries }) => {
      const [search, setSearch] = useState('');
      
      const filtered = useMemo(() => {
        return users.filter(u => 
          u.email?.toLowerCase().includes(search.toLowerCase()) ||
          u.displayName?.toLowerCase().includes(search.toLowerCase()) ||
          u.uid?.toLowerCase().includes(search.toLowerCase())
        );
      }, [users, search]);

      return (
        <div className="bg-white rounded-xl shadow-md p-6">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-xl font-bold">使用者列表</h3>
            <div className="relative">
              <input
                type="text"
                placeholder="搜尋使用者..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
              />
              <Icon name="search" className="absolute left-3 top-2.5 text-gray-400" />
            </div>
          </div>
          
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-50">
                <tr>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">使用者</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Email</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">角色</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">會員</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">日記數</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">操作</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {filtered.map(user => (
                  <tr key={user.uid} className="hover:bg-gray-50 transition">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-semibold">
                          {user.displayName?.charAt(0)?.toUpperCase() || user.email?.charAt(0)?.toUpperCase() || '?'}
                        </div>
                        <div>
                          <div className="font-medium">{user.displayName || '未設定'}</div>
                          <div className="text-xs text-gray-500">{user.uid.slice(0, 8)}...</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-4 py-3 text-sm">{user.email}</td>
                    <td className="px-4 py-3">
                      <span className={`px-2 py-1 text-xs rounded-full ${
                        user.role === 'admin' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'
                      }`}>
                        {user.role || 'user'}
                      </span>
                    </td>
                    <td className="px-4 py-3">
                      <span className={`px-2 py-1 text-xs rounded-full ${
                        user.membership?.tier === 'vip' ? 'bg-yellow-100 text-yellow-700' :
                        user.membership?.tier === 'pro' ? 'bg-blue-100 text-blue-700' :
                        'bg-gray-100 text-gray-700'
                      }`}>
                        {user.membership?.tier || 'free'}
                      </span>
                    </td>
                    <td className="px-4 py-3 text-sm font-medium">{user.diaryCount || 0}</td>
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => onViewDiaries(user)}
                          className="p-2 hover:bg-purple-50 rounded-lg text-purple-600"
                          title="查看日記"
                        >
                          <Icon name="book" className="w-4 h-4" />
                        </button>
                        <button
                          onClick={() => onEdit(user)}
                          className="p-2 hover:bg-blue-50 rounded-lg text-blue-600"
                          title="編輯"
                        >
                          <Icon name="edit" className="w-4 h-4" />
                        </button>
                        <button
                          onClick={() => onDelete(user.uid)}
                          className="p-2 hover:bg-red-50 rounded-lg text-red-600"
                          title="刪除"
                        >
                          <Icon name="trash" className="w-4 h-4" />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {filtered.length === 0 && (
              <div className="text-center py-8 text-gray-400">
                沒有找到符合的使用者
              </div>
            )}
          </div>
        </div>
      );
    };

    // 優惠券表格元件
    const CouponsTable = ({ coupons, onDelete }) => {
      return (
        <div className="bg-white rounded-xl shadow-md p-6">
          <h3 className="text-xl font-bold mb-4">優惠券管理</h3>
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead className="bg-gray-50">
                <tr>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">代碼</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">折抵金額</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">延長月數</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">狀態</th>
                  <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">操作</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {coupons.map(coupon => (
                  <tr key={coupon.code} className="hover:bg-gray-50 transition">
                    <td className="px-4 py-3 font-mono font-semibold">{coupon.code}</td>
                    <td className="px-4 py-3">NT$ {coupon.discountAmount || 0}</td>
                    <td className="px-4 py-3">{coupon.discountMonths || 0} 月</td>
                    <td className="px-4 py-3">
                      <span className={`px-2 py-1 text-xs rounded-full ${
                        coupon.active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'
                      }`}>
                        {coupon.active ? '啟用' : '停用'}
                      </span>
                    </td>
                    <td className="px-4 py-3">
                      <button
                        onClick={() => onDelete(coupon.code)}
                        className="p-2 hover:bg-red-50 rounded-lg text-red-600"
                        title="刪除"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {coupons.length === 0 && (
              <div className="text-center py-8 text-gray-400">
                尚無優惠券
              </div>
            )}
          </div>
        </div>
      );
    };

    // 使用者編輯 Modal
    const UserEditModal = ({ user, onClose, onSave }) => {
      const [formData, setFormData] = useState({
        role: user?.role || 'user',
        tier: user?.membership?.tier || 'free',
        expiresAt: user?.membership?.expiresAt || ''
      });

      if (!user) return null;

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-xl font-bold">編輯使用者</h3>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg">
                <Icon name="x" />
              </button>
            </div>
            
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium mb-2">Email</label>
                <input
                  type="text"
                  value={user.email}
                  disabled
                  className="w-full border rounded-lg p-2 bg-gray-50"
                />
              </div>
              
              <div>
                <label className="block text-sm font-medium mb-2">角色</label>
                <select
                  value={formData.role}
                  onChange={e => setFormData({...formData, role: e.target.value})}
                  className="w-full border rounded-lg p-2"
                >
                  <option value="user">user</option>
                  <option value="admin">admin</option>
                </select>
              </div>
              
              <div>
                <label className="block text-sm font-medium mb-2">會員等級</label>
                <select
                  value={formData.tier}
                  onChange={e => setFormData({...formData, tier: e.target.value})}
                  className="w-full border rounded-lg p-2"
                >
                  <option value="free">free</option>
                  <option value="pro">pro</option>
                  <option value="vip">vip</option>
                </select>
              </div>
              
              <div>
                <label className="block text-sm font-medium mb-2">會員到期日</label>
                <input
                  type="date"
                  value={formData.expiresAt ? new Date(formData.expiresAt).toISOString().slice(0, 10) : ''}
                  onChange={e => setFormData({...formData, expiresAt: e.target.value ? new Date(e.target.value).toISOString() : ''})}
                  className="w-full border rounded-lg p-2"
                />
              </div>
              
              <button
                onClick={() => onSave(user.uid, formData)}
                className="w-full primary-bg text-white py-2 rounded-lg hover:opacity-90"
              >
                儲存變更
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 日記檢視 Modal
    const DiariesModal = ({ user, diaries, onClose }) => {
      if (!user) return null;

      return (
        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div className="flex items-center justify-between p-6 border-b">
              <div>
                <h3 className="text-xl font-bold">{user.displayName || user.email} 的日記</h3>
                <p className="text-sm text-gray-500">共 {diaries.length} 篇</p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg">
                <Icon name="x" />
              </button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-6">
              <div className="space-y-4">
                {diaries.map(diary => {
                  const dt = toDate(diary.createdAt);
                  const dateText = dt ? dt.toLocaleDateString('zh-TW') : '—';
                  return (
                    <div key={diary.id} className="border rounded-lg p-4 hover:shadow-md transition">
                      <div className="flex items-start justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="text-2xl">{diary.mood || '😊'}</span>
                          <span className="text-lg">{diary.weather || '☀️'}</span>
                        </div>
                        <div className="text-sm text-gray-500">{dateText}</div>
                      </div>
                      <h4 className="font-bold mb-2">{diary.title}</h4>
                      <p className="text-sm text-gray-600 line-clamp-3">{diary.content}</p>
                      {diary.tags?.length > 0 && (
                        <div className="flex gap-1 mt-2 flex-wrap">
                          {diary.tags.map(tag => (
                            <span key={tag} className="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded">
                              #{tag}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                {diaries.length === 0 && (
                  <div className="text-center py-8 text-gray-400">
                    此使用者尚未撰寫任何日記
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 主要管理後台元件
    const AdminDashboard = () => {
      const [currentUser, setCurrentUser] = useState(null);
      const [users, setUsers] = useState([]);
      const [coupons, setCoupons] = useState([]);
      const [totalDiaries, setTotalDiaries] = useState(0);
      const [loading, setLoading] = useState(true);
      const [editingUser, setEditingUser] = useState(null);
      const [viewingDiaries, setViewingDiaries] = useState(null);
      const [userDiaries, setUserDiaries] = useState([]);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      // 驗證管理員身份
      useEffect(() => {
        const unsubAuth = auth.onAuthStateChanged(async (user) => {
          if (user) {
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.data();
            if (userData?.role === 'admin') {
              setCurrentUser(user);
              loadData();
            } else {
              alert('您沒有管理員權限');
              auth.signOut();
            }
          }
          setLoading(false);
        });
        return () => unsubAuth();
      }, []);

      // 載入所有資料
      const loadData = async () => {
        try {
          // 載入使用者
          const usersSnap = await db.collection('users').get();
          const usersData = await Promise.all(usersSnap.docs.map(async (doc) => {
            const data = doc.data();
            const diariesSnap = await db.collection('users').doc(doc.id).collection('diaries').get();
            return {
              uid: doc.id,
              email: data.email || '',
              displayName: data.displayName || '',
              role: data.role || 'user',
              membership: data.membership || { tier: 'free', expiresAt: null },
              diaryCount: diariesSnap.size
            };
          }));
          setUsers(usersData);

          // 計算總日記數
          const total = usersData.reduce((sum, u) => sum + u.diaryCount, 0);
          setTotalDiaries(total);

          // 載入優惠券
          const couponsSnap = await db.collection('coupons').get();
          const couponsData = couponsSnap.docs.map(doc => ({
            code: doc.id,
            ...doc.data()
          }));
          setCoupons(couponsData);
        } catch (error) {
          alert('載入資料失敗：' + error.message);
        }
      };

      // 編輯使用者
      const handleSaveUser = async (uid, formData) => {
        try {
          await db.collection('users').doc(uid).set({
            role: formData.role,
            membership: {
              tier: formData.tier,
              expiresAt: formData.expiresAt || null
            }
          }, { merge: true });
          alert('更新成功');
          setEditingUser(null);
          loadData();
        } catch (error) {
          alert('更新失敗：' + error.message);
        }
      };

      // 刪除使用者
      const handleDeleteUser = async (uid) => {
        if (!confirm('確定要刪除此使用者嗎？這將同時刪除其所有日記！')) return;
        try {
          // 刪除使用者的所有日記
          const diariesSnap = await db.collection('users').doc(uid).collection('diaries').get();
          const batch = db.batch();
          diariesSnap.docs.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          
          // 刪除使用者文件
          await db.collection('users').doc(uid).delete();
          alert('刪除成功');
          loadData();
        } catch (error) {
          alert('刪除失敗：' + error.message);
        }
      };

      // 查看使用者日記
      const handleViewDiaries = async (user) => {
        try {
          const diariesSnap = await db.collection('users').doc(user.uid).collection('diaries')
            .orderBy('createdAt', 'desc')
            .get();
          const diariesData = diariesSnap.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          setUserDiaries(diariesData);
          setViewingDiaries(user);
        } catch (error) {
          alert('載入日記失敗：' + error.message);
        }
      };

      // 刪除優惠券
      const handleDeleteCoupon = async (code) => {
        if (!confirm('確定要刪除此優惠券嗎？')) return;
        try {
          await db.collection('coupons').doc(code).delete();
          alert('刪除成功');
          loadData();
        } catch (error) {
          alert('刪除失敗：' + error.message);
        }
      };

      // 登入頁面
      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
              <p className="text-gray-600">載入中...</p>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-blue-50">
            <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
              <div className="text-center mb-6">
                <Icon name="shield" className="w-16 h-16 mx-auto mb-4 text-purple-600" />
                <h2 className="text-2xl font-bold">管理後台登入</h2>
                <p className="text-gray-500 mt-2">請使用管理員帳號登入</p>
              </div>
              <button
                onClick={() => {
                  const provider = new firebase.auth.GoogleAuthProvider();
                  auth.signInWithPopup(provider);
                }}
                className="w-full primary-bg text-white py-3 rounded-lg hover:opacity-90"
              >
                使用 Google 登入
              </button>
            </div>
          </div>
        );
      }

      const stats = {
        totalUsers: users.length,
        premiumUsers: users.filter(u => u.membership?.tier !== 'free').length,
        totalDiaries: totalDiaries,
        activeCoupons: coupons.filter(c => c.active).length
      };

      return (
        <div className="flex h-screen overflow-hidden bg-gray-50">
          {/* 側邊欄 */}
          <div className={`
            fixed md:static inset-y-0 left-0 z-50 w-64 bg-white border-r transform transition-transform
            ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
          `}>
            <div className="p-6">
              <h1 className="text-2xl font-bold primary-text mb-6">📊 管理後台</h1>
              <div className="space-y-2">
                <div className="flex items-center gap-3 p-3 bg-purple-50 rounded-lg">
                  <Icon name="user" className="text-purple-600" />
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium truncate">{currentUser.email}</div>
                    <div className="text-xs text-gray-500">管理員</div>
                  </div>
                </div>
              </div>
            </div>
            <div className="px-6 pb-6">
              <button
