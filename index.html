const ReminderService = {
key: 'diary_reminders_v2',
load(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch{ return [] } },
save(list){ localStorage.setItem(this.key, JSON.stringify(list)); },
add(rem){
const list=this.load(); list.push(rem); this.save(list);
},
remove(id){
const list=this.load().filter(r=>r.id!==id); this.save(list);
},
_nextTime(cur, freq){
if(freq==='DAILY'){ const d = new Date(cur); d.setDate(d.getDate()+1); return d; }
if(freq==='WEEKLY'){ const d = new Date(cur); d.setDate(d.getDate()+7); return d; }
return null;
},
scheduleTicker(){
setInterval(()=>{
let list = this.load(); const now = Date.now(); let dirty = false;
for(const r of list){
const due = new Date(r.at).getTime();
if(now >= due){
if(Notification?.permission==='granted'){ new Notification('日記提醒', { body: r.title || '該寫日記或查看備忘囉！' }); }
if(r.freq && r.freq!=='ONCE'){
const next = this._nextTime(new Date(r.at), r.freq);
if(next){ r.at = next.toISOString(); r.fired = false; dirty = true; }
}else{ r.fired = true; dirty = true; }
}
}
const keep = list.filter(r => !(r.fired && (!r.freq || r.freq==='ONCE')));
if(dirty || keep.length !== list.length){ this.save(keep); }
}, 15000);
},
requestPermission(){
if('Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); }
}
};

const TagCloud = ({ diaries, activeTag, onToggle }) => {
const map = {};
diaries.forEach(d => (d.tags||[]).forEach(t => map[t]=(map[t]||0)+1));
const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
if(entries.length===0) return <p className="text-gray-400">還沒有標籤</p>;
const max = Math.max(...entries.map(e=>e[1]));
return (
<div className="flex flex-wrap gap-2">
{entries.map(([tag,count])=>{
const size = 12 + Math.round(8*(count/max));
const active = activeTag===tag;
return (
<button key={tag}
onClick={()=>onToggle(tag)}
className={`px-2 py-1 rounded-lg ${active?'primary-bg text-white':'bg-gray-100 hover:bg-gray-200'}`}
style={{ fontSize: size }}
title={`#${tag} ×${count}`}
>
#{tag}
</button>
);
})}
</div>
);
};

const CalendarView = ({ diaries, onPickDate }) => {
const [cur, setCur] = useState(new Date());
const y = cur.getFullYear(), m = cur.getMonth();
const first = new Date(y,m,1);
const startDay = (first.getDay()+6)%7;
const daysInMonth = new Date(y,m+1,0).getDate();
const setMonth = (delta)=>{ const d=new Date(y,m+delta,1); setCur(d); };
const hasMap = {};
diaries.forEach(d=>{
const day = new Date(d.createdAt).toISOString().slice(0,10);
hasMap[day] = (hasMap[day]||0)+1;
});
const cells=[];
for(let i=0;i<startDay;i++) cells.push(null);
for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,m,d));
return (
<div className="border rounded-2xl p-4">
<div className="flex items-center justify-between mb-2">
<button onClick={()=>setMonth(-1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">‹</button>
<div className="font-bold">{y} 年 {m+1} 月</div>
<button onClick={()=>setMonth(1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">›</button>
</div>
<div className="grid grid-cols-7 gap-2 text-center text-sm text-gray-500 mb-2">
{['一','二','三','四','五','六','日'].map(d=><div key={d}>{d}</div>)}
</div>
<div className="grid grid-cols-7 gap-2">
{cells.map((d,i)=>{
if(!d) return <div key={i}></div>;
const key = d.toISOString().slice(0,10);
const count = hasMap[key]||0;
return (
<button key={i}
onClick={()=>onPickDate(key)}
className={`h-20 rounded-xl border relative ${count? 'primary-border border-2 bg-purple-50':'border-gray-200'}`}
>
<div className="absolute top-2 left-2 text-sm">{d.getDate()}</div>
{count>0 && (
<div className="absolute bottom-2 right-2 text-xs px-2 py-0.5 rounded-full primary-bg text-white">
{count} 篇
</div>
)}
</button>
);
})}
</div>
</div>
);

const Charts = ({ diaries, darkMode }) => {
const moodRef = useRef(null);
const dailyRef = useRef(null);
const moodChart = useRef(null);
const dailyChart = useRef(null);
const moodCounts = useMemo(()=>{
const map = Object.fromEntries(moods.map(m=>[m,0]));
diaries.forEach(d => map[d.mood]=(map[d.mood]||0)+1);
return map;
},[diaries]);
const dailyCounts = useMemo(()=>{
const map = {};
diaries.forEach(d=>{
const day = new Date(d.createdAt).toISOString().slice(0,10);
map[day]=(map[day]||0)+1;
});
const keys = Object.keys(map).sort();
return { labels: keys, data: keys.map(k=>map[k]) };
},[diaries]);
useEffect(()=>{
if(moodChart.current){ moodChart.current.destroy(); }
if(dailyChart.current){ dailyChart.current.destroy(); }
moodChart.current = new Chart(moodRef.current, {
type:'doughnut',
data:{
labels:Object.keys(moodCounts),
datasets:[{ data:Object.values(moodCounts) }]
},
options:{ plugins:{legend:{position:'bottom'} } }
});
dailyChart.current = new Chart(dailyRef.current, {
type:'bar',
data:{
labels: dailyCounts.labels,
datasets:[{ label:'每日篇數', data: dailyCounts.data }]
},
options:{
scales:{ x:{ ticks:{ color: darkMode?'#fff':'#000' } },
y:{ ticks:{ color: darkMode?'#fff':'#000' } } },
plugins:{ legend:{ display:false } }
}
});

/* =========================

// Helper to add months to a date
const addMonths = (date, months) => {
    const d = new Date(date);
    d.setMonth(d.getMonth() + months);
    return d;
};

// 處理付費方案購買
const handlePurchase = async (plan) => {
    if(!user) { alert('請先登入'); return; }
    const months = plan === 'yearly' ? 12 : 1;
    const tier = 'pro'; // 假設購買後獲得 'pro' 等級
    
    // 決定新的到期日
    let currentExpiry = membership.expiresAt ? new Date(membership.expiresAt) : new Date();
    // 如果會員已過期，則從今天開始計算
    if (new Date() > currentExpiry) {
        currentExpiry = new Date();
    }
    const newExpiry = addMonths(currentExpiry, months);

    try {
        await db.collection('users').doc(user.uid).set({
            membership: {
                tier: tier,
                expiresAt: newExpiry.toISOString(),
            }
        }, { merge: true });
        alert(`成功升級到 ${tier} 會員，延長 ${months} 個月至 ${newExpiry.toLocaleDateString('zh-TW')}！`);
        setShowPremium(false); // 關閉模態框
    } catch(e) {
        alert('購買失敗：' + e.message);
    }
};

// 處理優惠券套用 (PremiumModal / SettingsPanel 共用)
const handleApplyCoupon = async (code) => {
    if(!user) { alert('請先登入'); return; }
    if(!code) { alert('請輸入優惠券代碼'); return; }

    try {
        const couponSnap = await db.collection('coupons').doc(code).get();
        if(!couponSnap.exists) { alert('優惠券不存在'); return; }
        
        const coupon = couponSnap.data();
        if(!coupon.active) { alert('優惠券已停用'); return; }
        if(!coupon.months || coupon.months < 1) { alert('優惠券無效'); return; }

        const months = coupon.months;
        const tier = 'pro'; // 假設優惠券給予 'pro' 等級
        
        // 決定新的到期日
        let currentExpiry = membership.expiresAt ? new Date(membership.expiresAt) : new Date();
        // 如果會員已過期，則從今天開始計算
        if (new Date() > currentExpiry) {
            currentExpiry = new Date();
        }
        const newExpiry = addMonths(currentExpiry, months);

        await db.collection('users').doc(user.uid).set({
            membership: {
                tier: tier,
                expiresAt: newExpiry.toISOString(),
            }
        }, { merge: true });
        
        alert(`成功套用優惠券 [${code}]，延長 ${months} 個月至 ${newExpiry.toLocaleDateString('zh-TW')}！`);

    } catch(e) {
        alert('套用優惠券失敗：' + e.message);
    }
};

// 處理管理員建立優惠券
const handleCreateCoupon = async ({ code, months, active }) => {
    if(!isAdmin) { alert('權限不足'); return; }
    if(!code || !months || months < 1) { alert('請填寫有效的代碼和月數'); return; }

    try {
        await db.collection('coupons').doc(code).set({
            months: months,
            active: active,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`成功建立優惠券：${code} (延長 ${months} 個月, ${active?'啟用':'停用'})`);
    } catch(e) {
        alert('建立優惠券失敗：' + e.message);
    }
};

    if (!user) { alert('請先登入'); return; }

    let newExpiry = null;
    if (tier !== 'free') {
        const date = new Date();
        newExpiry = addMonths(date, 12).toISOString();
    }

    try {
        await db.collection('users').doc(user.uid).set({
            membership: {
                tier: tier,
                expiresAt: newExpiry,
            }
        }, { merge: true });
        alert(`成功將會員等級設定為 ${tier}`);

filtered.sort((a,b)=>{

case 'date-asc': return new Date(a.createdAt) - new Date(b.createdAt);
case 'title': return (a.title||'').localeCompare(b.title||'');
default: return 0;
}
});
setFilteredDiaries(filtered);
},[diaries, searchTerm, selectedTag, filterMood, sortBy, dateFilter, favoritesOnly]);

    const { id, ...data } = formData;
    const isNew = !id;
    
    // 清理資料
    const payload = {
        ...data,
        content: data.content.trim(),
        title: data.title.trim() || '無標題日記',
        createdAt: isNew ? firebase.firestore.FieldValue.serverTimestamp() : currentDiary.createdAt,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        authorId: user.uid,
    };
    
    // 如果是私密日記，免費會員不能用
    if(payload.isPrivate && membership.tier==='free'){

        return;

    try {
        if(isNew){
            await db.collection('users').doc(user.uid).collection('diaries').add(payload);

    const a = document.createElement('a');
    a.href = url;
    a.download = `diary_export_${new Date().toISOString().slice(0,10)}.json`;

const importDiaries = (file) => {
    if(!user){ alert('請先登入才能匯入資料'); return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if(!Array.isArray(data)){ throw new Error('檔案格式錯誤'); }
            if(!window.confirm(`確定要匯入 ${data.length} 篇日記嗎？這將會新增到您的雲端資料中。`)) return;
            
            let successCount = 0;

                    content: d.content || '',
                    tags: d.tags || [],
                    mood: d.mood || ' 😊 ',
                    weather: d.weather || ' ☀️ ',
                    isPrivate: d.isPrivate || false,
                    isFavorite: d.isFavorite || false,
                    images: d.images || [],
                    createdAt: d.createdAt ? new Date(d.createdAt) : firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    authorId: user.uid,
                };
                await db.collection('users').doc(user.uid).collection('diaries').add(payload);
                successCount++;
            }
            alert(`成功匯入 ${successCount} 篇日記！`);
        } catch(err) {
            alert('匯入失敗：'+err.message);

    };
    reader.readAsText(file);
};

const onRestoreFromStorage = async () => {
    if(!user){ alert('請先登入'); return; }
    if(membership.tier==='free'){ alert('還原功能僅限付費會員使用'); return; }
    if(!window.confirm('確定要從雲端還原日記嗎？這將會新增到您目前的資料中。')) return;
    
    try {
        const ref = storage.ref().child(`${user.uid}/${BACKUP_PATH}`);

        const res = await fetch(url);
        const data = await res.json();
        
        if(!Array.isArray(data)){ throw new Error('備份檔案格式錯誤'); }
        
        let successCount = 0;
        for(const d of data){
            const payload = {
                title: d.title || '還原日記',
                content: d.content || '',
                tags: d.tags || [],
                mood: d.mood || ' 😊 ',
                weather: d.weather || ' ☀️ ',
                isPrivate: d.isPrivate || false,
                isFavorite: d.isFavorite || false,
                images: d.images || [],
                createdAt: d.createdAt ? new Date(d.createdAt) : firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                authorId: user.uid,
            };
            await db.collection('users').doc(user.uid).collection('diaries').add(payload);
            successCount++;
        }
        
        alert(`成功從雲端還原 ${successCount} 篇日記！`);

                    </button>
                </div>
                
                {/* 標籤雲 */}
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
                    <h3 className="font-semibold mb-3">熱門標籤</h3>
                    <TagCloud diaries={diaries} activeTag={selectedTag} onToggle={(tag)=>setSelectedTag(selectedTag===tag?'':tag)}/>
                </div>
                
                {/* 篩選與排序 */}
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
                    <h3 className="font-semibold mb-3">篩選與排序</h3>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label className="text-sm block mb-1 text-gray-500">心情</label>
                            <select value={filterMood} onChange={e=>setFilterMood(e.target.value)} className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}>
                                <option value="">所有心情</option>
                                {moods.map(m=><option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-sm block mb-1 text-gray-500">排序</label>
                            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}>
                                <option value="date-desc">日期 (新→舊)</option>
                                <option value="date-asc">日期 (舊→新)</option>
                                <option value="title">標題</option>
                            </select>
                        </div>
                    </div>
                    {dateFilter && (
                        <div className="mb-3">
                            <span className="text-sm block mb-1 text-gray-500">日期篩選</span>
                            <div className="flex items-center gap-2">
                                <span className={`px-3 py-1 rounded-lg primary-bg text-white font-medium`}>{dateFilter}</span>
                                <button onClick={()=>setDateFilter('')} className="text-red-500 hover:text-red-600">清除</button>
                            </div>
                        </div>
                    )}
                    <button onClick={()=>{setSearchTerm('');setSelectedTag('');setFilterMood('');setDateFilter('');}} className="w-full px-3 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm">清除所有篩選</button>
                </div>
                
                {/* 日曆 */}
                <CalendarView diaries={diaries} onPickDate={(d)=>setDateFilter(d)}/>
            </div>
            
            {/* Right Main Area: List & Detail */}
            <div className="lg:col-span-2 space-y-6">
                {/* 日記列表 */}
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4 h-[400px] overflow-y-auto`}>
                    <h3 className="font-semibold mb-4 border-b pb-2">日記列表 ({filteredDiaries.length} 篇)</h3>
                    <div className="space-y-4">
                        {filteredDiaries.length === 0 ? (
                            <p className="text-gray-400">找不到符合條件的日記。</p>
                        ):(
                            filteredDiaries.map(d=>(
                                <div key={d.id} onClick={()=>setCurrentDiary(d)}
                                    className={`p-3 border rounded-xl cursor-pointer hover:shadow-md transition ${currentDiary?.id===d.id ? 'primary-border border-2 bg-purple-50':'border-gray-200'}`}>
                                    <div className="flex items-center justify-between">
                                        <div className="font-bold text-lg line-clamp-2">{d.title}</div>
                                        <div className="flex items-center gap-2 text-sm text-gray-500">
                                            {d.isFavorite && <Icon name="heart" className="w-4 h-4 text-yellow-500" fill={true}/>}
                                            {d.mood} {d.weather}
                                        </div>
                                    </div>
                                    <p className="text-sm text-gray-600 line-clamp-2 mt-1">{d.content}</p>
                                    <div className="text-xs text-gray-400 mt-2 flex justify-between items-center">
                                        <span>{new Date(d.createdAt).toLocaleDateString('zh-TW')}</span>
                                        <div className="flex flex-wrap gap-1">
                                            {(d.tags||[]).map(t=><span key={t} className="px-1.5 py-0.5 bg-gray-100 rounded text-gray-500">{t}</span>)}
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
                
                {/* 日記新增/編輯/檢視 */}
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
                    <h3 className="font-semibold mb-4 border-b pb-2">{showNewDiary?'新增/編輯日記':'日記詳情'}</h3>
                    {showNewDiary ? (
                        <DiaryForm 
                            formData={formData} 
                            setFormData={setFormData} 
                            onSave={saveDiary} 
                            onCancel={()=>{setShowNewDiary(false);setCurrentDiary(null);}}
                            onDelete={currentDiary?.id ? deleteDiary : null}
                            onImageUpload={handleImageUpload}
                            onImageRemove={handleImageRemove}
                            uploading={uploading}
                            darkMode={darkMode}
                            membership={membership}
                        />
                    ) : currentDiary ? (
                        <DiaryDetail 
                            diary={currentDiary} 
                            onEdit={()=>{setShowNewDiary(true);setFormData(currentDiary);}}
                            onDelete={deleteDiary}
                            darkMode={darkMode}
                        />
                    ) : (
                        <div className="flex items-center justify-center h-full text-gray-400">
                            <div className="text-center">
                                <Icon name="calendar" className="w-20 h-20 mx-auto mb-4"/>
                                <p className="text-xl">選擇一篇日記來查看，或建立新的日記</p>
                            </div>
                        </div>
                    )}
                </div>
                
                {/* 圖表 */}
                <Charts diaries={diaries} darkMode={darkMode}/>
            </div>
        </div>
    </div>
    
    {/* Modals */}
    <PremiumModal 
        open={showPremium} 
        onClose={()=>setShowPremium(false)} 
        onApplyCoupon={handleApplyCoupon} // 傳遞新的實作函式
        onPurchase={handlePurchase} // 傳遞新的實作函式
        membership={membership} 
        user={user} 
    />
    <SettingsPanel 
        open={settingsOpen} 
        onClose={()=>setSettingsOpen(false)}
        exportDiaries={exportDiaries}
        importDiaries={importDiaries}
        themeColor={themeColor}
        setThemeColor={setThemeColor}
        reminders={reminders}
        onAddReminder={onAddReminder}
        onRemoveReminder={onRemoveReminder}
        profile={profile}
        isAdmin={isAdmin}
        onCreateCoupon={handleCreateCoupon} // 傳遞新的實作函式
        onApplyCoupon={handleApplyCoupon} // 傳遞新的實作函式
        membership={membership}
        onSetMembershipTier={handleSetMembershipTier} // 傳遞新的實作函式
        onBackupToStorage={onBackupToStorage}
        onRestoreFromStorage={onRestoreFromStorage}
        todayShortcut={todayShortcut}
        toggleFavoritesOnly={toggleFavoritesOnly}
        favoritesOnly={favoritesOnly}
        darkMode={darkMode}
        setDarkMode={setDarkMode}
    />
</div>
);
};

/* =========================
其他元件：DiaryForm & DiaryDetail (從原程式碼末段還原，以確保完整性)
==========================*/

// DiaryForm
const DiaryForm = ({ formData, setFormData, onSave, onCancel, onDelete, onImageUpload, onImageRemove, uploading, darkMode, membership }) => {
    const handleTagChange = (tag) => {
        setFormData(prev=>{
            const tags = prev.tags.includes(tag)
                ? prev.tags.filter(t=>t!==tag)
                : [...prev.tags, tag];
            return {...prev, tags};
        });
    };
    
    // 檢查私密日記權限
    const togglePrivate = (e) => {
        const checked = e.target.checked;
        if(checked && membership.tier==='free'){
            alert('私密日記功能僅限付費會員使用，請先升級');
            return;
        }
        setFormData(prev=>({...prev, isPrivate:checked}));
    };

    return (
        <div className="space-y-4">
            <input value={formData.title} onChange={e=>setFormData(prev=>({...prev, title:e.target.value}))} 
                placeholder="標題" className={`w-full text-xl font-bold p-2 border-b ${darkMode?'bg-gray-800 border-gray-700':'border-gray-300'}`}/>
            
            <textarea value={formData.content} onChange={e=>setFormData(prev=>({...prev, content:e.target.value}))} 
                placeholder="寫下你的心情..." rows="8" className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}/>
                
            <div className="grid grid-cols-3 gap-4">
                {/* 心情 */}
                <div>
                    <label className="text-sm block mb-1 text-gray-500">心情</label>
                    <select value={formData.mood} onChange={e=>setFormData(prev=>({...prev, mood:e.target.value}))} 
                        className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}>
                        {moods.map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                </div>
                {/* 天氣 */}
                <div>
                    <label className="text-sm block mb-1 text-gray-500">天氣</label>
                    <select value={formData.weather} onChange={e=>setFormData(prev=>({...prev, weather:e.target.value}))} 
                        className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}>
                        {weathers.map(w=><option key={w} value={w}>{w}</option>)}
                    </select>
                </div>
                {/* 最愛 */}
                <div className="flex items-end justify-center">
                    <label className="flex items-center space-x-2 p-2 rounded-lg cursor-pointer bg-gray-100">
                        <input type="checkbox" checked={formData.isFavorite} onChange={e=>setFormData(prev=>({...prev, isFavorite:e.target.checked}))} className="form-checkbox text-yellow-500"/>
                        <span className="text-sm">最愛 <Icon name="heart" className="w-4 h-4 inline-block text-yellow-500" fill={true}/></span>
                    </label>
                </div>
            </div>
            
            {/* 標籤 */}
            <div>
                <label className="text-sm block mb-1 text-gray-500">標籤</label>
                <div className="flex flex-wrap gap-2">
                    {allTags.map(tag=>(
                        <button key={tag} onClick={()=>handleTagChange(tag)}
                            className={`px-3 py-1 rounded-full text-sm transition ${formData.tags.includes(tag)?'primary-bg text-white':'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>
                            #{tag}
                        </button>
                    ))}
                </div>
            </div>
            
            {/* 圖片上傳 */}
            <div className="border rounded-xl p-3 space-y-3">
                <label className="text-sm block text-gray-500">圖片 (付費會員限定)</label>
                {formData.images?.length > 0 && (
                    <div className="flex flex-wrap gap-3">
                        {formData.images.map(url=>(
                            <div key={url} className="relative w-24 h-24">
                                <img src={url} className="w-full h-full object-cover rounded-lg border"/>
                                <button onClick={()=>onImageRemove(url)} className="absolute top-0 right-0 p-1 bg-red-500 text-white rounded-full"><Icon name="x" className="w-3 h-3"/></button>
                            </div>
                        ))}
                    </div>
                )}
                <label className={`px-3 py-2 rounded-lg border cursor-pointer flex items-center gap-2 w-full justify-center ${membership.tier==='free' ? 'opacity-50 cursor-not-allowed':''}`}>
                    {uploading ? '上傳中...' : <><Icon name="image"/><span>上傳圖片 ({formData.images.length}/3)</span></>}
                    <input type="file" accept="image/*" className="hidden" disabled={uploading || membership.tier==='free' || formData.images.length>=3} onChange={e=>e.target.files[0]&&onImageUpload(e.target.files[0])}/>
                </label>
            </div>
            
            {/* 私密日記 */}
            <div className="flex items-center space-x-2">
                <label className="switch">
                    <input type="checkbox" checked={formData.isPrivate} onChange={togglePrivate}/>
                    <span className="slider"></span>
                </label>
                <span className="text-sm text-gray-500">私密日記 <Icon name="lock" className="w-4 h-4 inline-block"/> (付費會員限定)</span>
            </div>

            {/* 提醒（簡易） */}
            <div className="border-t pt-4">
                <label className="text-sm block mb-1 text-gray-500">設定單次提醒 (選填)</label>
                <input type="datetime-local" value={formData.remindAt ? formData.remindAt.slice(0,16) : ''} 
                    onChange={e=>setFormData(prev=>({...prev, remindAt:new Date(e.target.value).toISOString()}))}
                    className={`w-full p-2 border rounded-lg ${darkMode?'bg-gray-700 border-gray-600':'border-gray-300'}`}/>
                <p className="text-xs text-gray-400 mt-1">此處僅記錄，實際定時提醒請到設定面板設定</p>
            </div>
            
            {/* 按鈕 */}
            <div className="flex justify-between gap-3 pt-4 border-t">
                <button onClick={onCancel} className="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">取消</button>
                {onDelete && <button onClick={()=>onDelete(formData.id)} className="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600">刪除</button>}
                <button onClick={onSave} className="flex-1 primary-bg text-white rounded-lg py-2 flex items-center justify-center gap-2">
                    <Icon name="save" className="w-5 h-5"/>
                    <span>儲存日記</span>
                </button>
            </div>
        </div>
    );
};

// DiaryDetail
const DiaryDetail = ({ diary:currentDiary, onEdit, onDelete, darkMode }) => {
    return (
        <div className="h-[400px] overflow-y-auto space-y-6">
            <div className="flex justify-between items-start">
                <h3 className="text-3xl font-extrabold">{currentDiary.title}</h3>
                <div className="flex items-center gap-2">
                    <button onClick={onEdit} className="p-2 rounded-full hover:bg-gray-100"><Icon name="edit"/></button>
                    <button onClick={()=>onDelete(currentDiary.id)} className="p-2 rounded-full hover:bg-red-50 text-red-500"><Icon name="trash"/></button>
                </div>
            </div>
            
            <div className="space-y-2">
                <div className="flex items-center gap-4 text-sm text-gray-500">
                    <span><Icon name="calendar" className="w-4 h-4 inline-block mr-1"/> {new Date(currentDiary.createdAt).toLocaleDateString('zh-TW')}</span>
                    {currentDiary.mood && <span>心情: {currentDiary.mood}</span>}
                    {currentDiary.weather && <span>天氣: {currentDiary.weather}</span>}
                    {currentDiary.isFavorite && <span className="text-yellow-500">★ 最愛</span>}
                </div>
                
                {currentDiary.remindAt && (
                    <div className="flex items-center gap-2 text-sm text-blue-500">
                        <Icon name="bell" className="w-4 h-4"/>
                        <span>提醒於: {new Date(currentDiary.remindAt).toLocaleString('zh-TW')}</span>
                    </div>
                )}
            </div>
            
            {currentDiary.tags?.length > 0 && (
                <div className="flex flex-wrap gap-2">
                    {currentDiary.tags.map(t=>(
                        <span key={t} className="px-3 py-1 rounded-full primary-bg text-white text-sm">#{t}</span>
                    ))}
                </div>
            )}
            
            {currentDiary.images?.length>0 && (
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                    {currentDiary.images.map((url,i)=><img key={i} src={url} className="w-full h-40 object-cover rounded-xl border"/>)}
                </div>
            )}
            
            <div className="prose max-w-none">
                <p className="text-lg whitespace-pre-wrap">{currentDiary.content}</p>
            </div>
            
            {currentDiary.isPrivate && (
                <div className="flex items-center gap-2 text-gray-500 text-sm">
                    <Icon name="lock" className="w-4 h-4"/><span>這是一篇私密日記</span>
                </div>
            )}
        </div>
    );
};

ReactDOM.render(<DiaryApp/>, document.getElementById('root'));
</script>
</body>
</html>
