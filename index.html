    const moods = ['😊','😢','😡','😰','😍','🤔','😴','🎉'];
    const weathers = ['☀️','⛅','☁️','🌧️','⛈️','🌈','❄️','🌙'];
    const allTags = ['生活','工作','旅遊','學習','健康','人際關係','興趣'];

    /* 日期工具 */
    const toDate = (val) => {
      try {
        if (!val) return null;
        if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
        if (typeof val === 'object' && typeof val.toDate === 'function') {
          const d = val.toDate(); return isNaN(d.getTime()) ? null : d;
        }
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
      } catch { return null; }
    };
    const localDateKey = (d) => {
      if (!(d instanceof Date) || isNaN(d.getTime())) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };

    /* SHA-256 */
    async function sha256Hex(text){
      try{
        const enc = new TextEncoder().encode(text);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){
        return `plain:${text}`;
      }
    }

    /* Streak */
    function calcStreak(diaries){
      const set = new Set();
      diaries.forEach(d=>{
        const dt = toDate(d.createdAt); if(!dt) return;
        set.add(localDateKey(dt));
      });
      if(set.size===0) return { streak:0, best:0, hasToday:false };

      const keys = Array.from(set).sort();
      let best = 1, cur = 1;
      for(let i=1;i<keys.length;i++){
        const prev = new Date(keys[i-1]);
        const now  = new Date(keys[i]);
        const diff = Math.round((now - prev)/86400000);
        if(diff===1){ cur++; best=Math.max(best,cur); }
        else if(diff>1){ cur=1; }
      }

      const todayKey = localDateKey(new Date());
      const hasToday = set.has(todayKey);
      let streak = 0; let probe = new Date();
      while(set.has(localDateKey(probe))){ streak++; probe.setDate(probe.getDate()-1); }

      return { streak, best, hasToday };
    }

    const StreakBadge = ({ diaries }) => {
  // 1) 連續天數（沿用你原本的）
  const { streak, best, hasToday } = useMemo(()=>calcStreak(diaries), [diaries]);

  // 2) 本週 7 天：從星期一開始
  const daySet = useMemo(()=>{
    const s = new Set();
    diaries.forEach(d=>{
      const dt = toDate(d.createdAt);
      if (dt) s.add(localDateKey(dt));
    });
    return s;
  }, [diaries]);

  const week = useMemo(()=>{
    const today = new Date();
    const offset = (today.getDay()+6)%7; // 0=Mon, … 6=Sun
    const monday = new Date(today);
    monday.setDate(today.getDate() - offset);

    const days = [];
    for (let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      days.push(d);
    }
    return days;
  }, []);

  const wcn = ['一','二','三','四','五','六','日'];

  const tier =
    streak >= 30 ? { name:'火焰傳奇', icon:'trophy' } :
    streak >= 7  ? { name:'堅持之火', icon:'calendar' } :
    streak >= 3  ? { name:'起步之星', icon:'heart' } :
                   { name:'加油打氣', icon:'star' };
  const tip = hasToday ? '已完成今日打卡！' : '今天還沒寫喔～';

  return (
    <div className="flex items-center gap-4 px-4 py-3 rounded-2xl border bg-white/80 shadow flex-wrap">

          <div className="text-2xl font-extrabold">

      {/* 右側：本週打卡七日列 */}

                  </svg>
                ) : null}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

    /* 登入元件 */

    /* 提醒服務（略，與你現有相同） */
    const ReminderService = {
      key: 'diary_reminders_v2',
      load(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch{ return [] } },
      save(list){ localStorage.setItem(this.key, JSON.stringify(list)); },
      add(rem){ const list=this.load(); list.push(rem); this.save(list); },
      remove(id){ const list=this.load().filter(r=>r.id!==id); this.save(list); },
      _nextTime(cur, freq){
        if(freq==='DAILY'){ const d = new Date(cur); d.setDate(d.getDate()+1); return d; }
        if(freq==='WEEKLY'){ const d = new Date(cur); d.setDate(d.getDate()+7); return d; }
        return null;
      },
      scheduleTicker(){
        setInterval(()=>{
          let list = this.load(); const now = Date.now(); let dirty = false;
          for(const r of list){
            const due = new Date(r.at).getTime();
            if(now >= due){
              if(Notification?.permission==='granted'){ new Notification('日記提醒', { body: r.title || '該寫日記或查看備忘囉！' }); }
              if(r.freq && r.freq!=='ONCE'){
                const next = this._nextTime(new Date(r.at), r.freq);
                if(next){ r.at = next.toISOString(); r.fired = false; dirty = true; }
              }else{ r.fired = true; dirty = true; }
            }
          }
          const keep = list.filter(r => !(r.fired && (!r.freq || r.freq==='ONCE')));
          if(dirty || keep.length !== list.length){ this.save(keep); }
        }, 15000);
      },
      requestPermission(){
        if('Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); }
      }
    };

    /* Tag Cloud / Calendar / Charts（與你現有相同，略去註解） */
    const TagCloud = ({ diaries, activeTag, onToggle }) => {
      const map = {}; diaries.forEach(d => (d.tags||[]).forEach(t => map[t]=(map[t]||0)+1));
      const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0) return <p className="text-gray-400">還沒有標籤</p>;
      const max = Math.max(...entries.map(e=>e[1]));
      return (
        <div className="flex flex-wrap gap-2">
          {entries.map(([tag,count])=>{
            const size = 12 + Math.round(8*(count/max));
            const active = activeTag===tag;
            return (
              <button key={tag}
                onClick={()=>onToggle(tag)}
                className={`px-2 py-1 rounded-lg ${active?'primary-bg text-white':'bg-gray-100 hover:bg-gray-200'}`}
                style={{ fontSize: size }}
                title={`#${tag} ×${count}`}
              >#{tag}</button>
            );
          })}
        </div>
      );
    };

    const CalendarView = ({ diaries, onPickDate }) => {
      const [cur, setCur] = useState(new Date());
      const y = cur.getFullYear(), m = cur.getMonth();
      const first = new Date(y,m,1);
      const startDay = (first.getDay()+6)%7;
      const daysInMonth = new Date(y,m+1,0).getDate();
      const setMonth = (delta)=>{ const d=new Date(y,m+delta,1); setCur(d); };

      const hasMap = {};
      diaries.forEach(d=>{
        const dt = toDate(d.createdAt);
        if (dt) { const day = localDateKey(dt); if (day) hasMap[day] = (hasMap[day]||0)+1; }
      });

      const cells=[]; for(let i=0;i<startDay;i++) cells.push(null);
      for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,m,d));

      return (
        <div className="border rounded-2xl p-4">
          <div className="flex items-center justify-between mb-2">
            <button onClick={()=>setMonth(-1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">‹</button>
            <div className="font-bold">{y} 年 {m+1} 月</div>
            <button onClick={()=>setMonth(1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">›</button>
          </div>
          <div className="grid grid-cols-7 gap-2 text-center text-sm text-gray-500 mb-2">
            {['一','二','三','四','五','六','日'].map(d=><div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-2">
            {cells.map((d,i)=>{
              if(!d) return <div key={i}></div>;
              const key = localDateKey(d);
              const count = hasMap[key]||0;
              return (
                <button key={i}
                  onClick={()=>onPickDate(key)}
                  className={`h-20 rounded-xl border relative ${count? 'primary-border border-2 bg-purple-50':'border-gray-200'}`}
                >
                  <div className="absolute top-2 left-2 text-sm">{d.getDate()}</div>
                  {count>0 && (
                    <div className="absolute bottom-2 right-2 text-xs px-2 py-0.5 rounded-full primary-bg text-white">
                      {count} 篇
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // Charts 元件 (保持原樣，用於 Summary 頁面)
    const Charts = ({ diaries, darkMode }) => {
      const moodRef  = useRef(null);
      const dailyRef = useRef(null);
      const moodChart  = useRef(null);
      const dailyChart = useRef(null);

      // 取主題色（--primary），並做透明度工具
      const getPrimary = () =>
        getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#7c3aed';
      const rgba = (hex, a=1)=>{
        const h = hex.replace('#','');
        const bigint = parseInt(h.length===3 ? h.split('').map(x=>x+x).join('') : h,16);
        const r=(bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
        return `rgba(${r},${g},${b},${a})`;
      };

      /* 資料 */
      const moodsArr = ['😊','😢','😡','😰','😍','🤔','😴','🎉'];
      const moodCounts = useMemo(()=>{
        const map = Object.fromEntries(moodsArr.map(m=>[m,0]));
        diaries.forEach(d => map[d.mood]=(map[d.mood]||0)+1);
        return map;
      }, [diaries]);

      const dailyCounts = useMemo(()=>{
        const map = {};
        diaries.forEach(d=>{
          const dt = toDate(d.createdAt);
          if (dt) {
            const k = localDateKey(dt);
            map[k] = (map[k]||0)+1;
          }
        });
        const keys = Object.keys(map).sort();
        return { labels: keys, data: keys.map(k=>map[k]) };
      }, [diaries]);

      /* 置中統計字：甜甜圈中央顯示 */
      const centerTextPlugin = {
        id: 'centerText',
        afterDraw(chart, args, opts){
          const {ctx, chartArea:{width,height}} = chart;
          if(!opts?.text) return;
          ctx.save();
          ctx.font = `600 ${opts.fontSize||20}px system-ui, -apple-system`;
          ctx.fillStyle = opts.color||'#111';
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(opts.text, width/2, height/2);
          ctx.restore();
        }
      };

      useEffect(()=>{
        // 清除舊圖
        moodChart.current?.destroy();
        dailyChart.current?.destroy();

        const primary = getPrimary();

        // 1) 心情甜甜圈
        const moodData = Object.values(moodCounts);
        const total = moodData.reduce((a,b)=>a+b,0);
        const donutColors = [
          rgba(primary, .9), rgba('#ef4444', .8), rgba('#f59e0b', .8), rgba('#06b6d4', .8),
          rgba('#a855f7', .85), rgba('#10b981', .8), rgba('#9ca3af', .8), rgba('#3b82f6', .8)
        ];
        moodChart.current = new Chart(moodRef.current, {
          type:'doughnut',
          data:{
            labels: Object.keys(moodCounts),
            datasets:[{
              data: moodData,
              backgroundColor: donutColors.slice(0, moodData.length),
              borderWidth: 0,
              hoverOffset: 8,
              spacing: 2
            }]
          },
          options:{
            cutout: '65%',
            plugins:{
              legend:{ display:false },
              tooltip:{
                backgroundColor: rgba('#111827', .9),
                titleColor:'#fff', bodyColor:'#fff',
                padding:12, cornerRadius:10,
                callbacks:{
                  label(ctx){
                    const v = ctx.parsed;
                    const p = total? Math.round(v/total*100):0;
                    return `  ${v} 篇（${p}%）`;
                  }
                }
              }
            },

    // ✅ 新增：簡化版 ChartsSmall 元件 (適用於左側邊欄)
    const ChartsSmall = ({ diaries, darkMode }) => {
      const moodRef  = useRef(null);
      const moodChart  = useRef(null);
      const getPrimary = () => getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#7c3aed';
      const rgba = (hex, a=1)=>{
        const h = hex.replace('#','');
        const bigint = parseInt(h.length===3 ? h.split('').map(x=>x+x).join('') : h,16);
        const r=(bigint>>16)&255, g=(bigint>>8)&255, b=(bigint)&255;
        return `rgba(${r},${g},${b},${a})`;
      };
      const moodsArr = ['😊','😢','😡','😰','😍','🤔','😴','🎉'];
      const moodCounts = useMemo(()=>{
        const map = Object.fromEntries(moodsArr.map(m=>[m,0]));
        diaries.forEach(d => map[d.mood]=(map[d.mood]||0)+1);
        return map;
      }, [diaries]);
      const total = diaries.length || 0;
      useEffect(()=>{
        moodChart.current?.destroy();
        if(total===0) return;
        const primary = getPrimary();
        const moodData = Object.values(moodCounts);
        const donutColors = [
          rgba(primary, .9), rgba('#ef4444', .8), rgba('#f59e0b', .8), rgba('#06b6d4', .8),
          rgba('#a855f7', .85), rgba('#10b981', .8), rgba('#9ca3af', .8), rgba('#3b82f6', .8)
        ];
        moodChart.current = new Chart(moodRef.current, {
          type:'doughnut',
          data:{
            labels: Object.keys(moodCounts),
            datasets:[{
              data: moodData,
              backgroundColor: donutColors.slice(0, moodData.length),
              borderWidth: 0, hoverOffset: 4, spacing: 1
            }]
          },
          options:{
            cutout: '70%', maintainAspectRatio: false,
            plugins:{ legend:{ display:false }, tooltip:{ enabled:false } },
            animation:{ duration:800, easing:'easeOutQuart' }
          }
        });
        return ()=>moodChart.current?.destroy();
      }, [moodCounts, total]);

      if (total===0) return <p className="text-sm text-gray-400">尚無日記數據</p>;

      const happy = moodCounts['😊']||0;
      return (
        <div className="flex items-center gap-4">
          <div className="w-20 h-20 flex-shrink-0" style={{position:'relative'}}>
            <canvas ref={moodRef}></canvas>
            <div className="absolute inset-0 flex items-center justify-center text-sm font-bold text-gray-700 dark:text-gray-300">
              {total}

          <div className="text-sm space-y-1">
            <p className="font-medium">總計：{total} 篇</p>
            <p>開心 (😊)：{happy} 篇</p>

            <span className="text-sm">更新於: {updatedText}</span>
            {currentDiary.isPrivate && <Icon name="lock" className="w-5 h-5"/>}
          </div>

          {(currentDiary.tags||[]).length>0 && (
            <div className="flex gap-2 flex-wrap">
              {currentDiary.tags.map(t=><span key={t} className="bg-purple-200 text-purple-700 px-3 py-1 rounded-full">#{t}</span>)}
            </div>
          )}

          {currentDiary.images?.length>0 && (
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
              {currentDiary.images.map((url,i)=><img key={i} src={url} className="w-full h-40 object-cover rounded-xl border"/>)}
            </div>
          )}

          <div className="prose max-w-none">
            <p className="text-lg whitespace-pre-wrap">{currentDiary.content}</p>
          </div>
        </div>
      );
    };

    const NewDiaryForm = ({ formData, setFormData, handleSaveDiary, handleUploadImages, uploading, currentDiary, resetForm }) => {
      const isEditing = !!currentDiary;

      const TagPill = ({ tag, onRemove }) => (
        <span className="flex items-center bg-purple-200 text-purple-700 rounded-full px-3 py-1 text-sm mr-2 mb-2">
          #{tag}
          <button onClick={onRemove} className="ml-2 text-purple-600 hover:text-purple-800">×</button>
        </span>
      );

      const handleAddTag = (tag) => {
        if (tag && !formData.tags.includes(tag)) {
          setFormData(prev => ({...prev, tags:[...(prev.tags||[]), tag]}));
        }
      };
      const handleRemoveTag = (tag) => {
        setFormData(prev => ({...prev, tags:prev.tags.filter(t=>t!==tag)}));
      };
      const handleTagInput = (e) => {
        if(e.key === 'Enter'){
          e.preventDefault();
          handleAddTag(e.target.value.trim());
          e.target.value = '';
        }
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between mb-2">
            <h2 className="text-2xl font-bold">{isEditing?'編輯日記':'新增日記'}</h2>
            <button onClick={resetForm} className="text-red-500 hover:text-red-700">取消/清除</button>
          </div>
          <input value={formData.title} onChange={e=>setFormData({...formData,title:e.target.value})} placeholder="標題"
                 className="w-full text-xl font-bold border rounded-lg p-2 focus:ring-2 focus:ring-purple-500 focus:outline-none"/>

          {/* Mood & Weather */}
          <div className="flex flex-wrap gap-3">
            <label className="text-sm font-medium">心情：</label>
            <div className="flex gap-2">
              {moods.map(m=>(
                <button key={m} onClick={()=>setFormData({...formData, mood:m})}
                        className={`p-2 rounded-lg text-2xl transition ${formData.mood===m?'ring-2 primary-border bg-purple-100':'hover:bg-gray-100'}`}>
                  {m}
                </button>
              ))}
            </div>
          </div>
          <div className="flex flex-wrap gap-3">
            <label className="text-sm font-medium">天氣：</label>
            <div className="flex gap-2">
              {weathers.map(w=>(
                <button key={w} onClick={()=>setFormData({...formData, weather:w})}
                        className={`p-2 rounded-lg text-lg transition ${formData.weather===w?'ring-2 primary-border bg-purple-100':'hover:bg-gray-100'}`}>
                  {w}
                </button>
              ))}
            </div>
          </div>

          <textarea value={formData.content} onChange={e=>setFormData({...formData,content:e.target.value})} placeholder="內容" rows="8"
                    className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>

          {/* Tags */}
          <div className="border rounded-lg p-2">
            <div className="flex flex-wrap">
              {(formData.tags||[]).map(t=>(
                <TagPill key={t} tag={t} onRemove={()=>handleRemoveTag(t)}/>
              ))}
            </div>
            <input placeholder="輸入標籤 (按 Enter 新增)" onKeyPress={handleTagInput}
                   className="w-full border-t border-gray-200 mt-2 pt-2 focus:outline-none"/>
            <div className="flex flex-wrap gap-2 mt-2">
              {allTags.filter(t=>!(formData.tags||[]).includes(t)).map(t=>(
                <button key={t} onClick={()=>handleAddTag(t)}
                        className="text-xs bg-gray-100 px-2 py-1 rounded-full hover:bg-gray-200">#{t}</button>
              ))}
            </div>
          </div>

          {/* Images */}
          <div className="border rounded-lg p-2">
            <label className="block text-sm font-medium mb-2">圖片 ({formData.images?.length||0} 張)</label>
            <div className="flex gap-2 flex-wrap">
              {formData.images.map((url,i)=>(
                <div key={i} className="relative">
                  <img src={url} className="w-24 h-24 object-cover rounded-lg border"/>
                  <button onClick={()=>setFormData(prev=>({...prev, images: prev.images.filter((_,idx)=>idx!==i)}))} className="absolute -top-2 -right-2 bg-black/60 text-white rounded-full w-6 h-6 flex items-center justify-center">×</button>
                </div>
              ))}
            </div>
            <label className="mt-2 block w-full py-2 text-center border-dashed border-2 rounded-lg cursor-pointer hover:bg-gray-50">
              {uploading?'上傳中...':'選擇圖片上傳'}
              <input type="file" accept="image/*" multiple className="hidden" onChange={e=>handleUploadImages(e.target.files)} disabled={uploading}/>
            </label>
          </div>

          {/* Options */}
          <div className="flex items-center gap-4 flex-wrap">
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={formData.isPrivate} onChange={e=>setFormData({...formData,isPrivate:e.target.checked})} className="w-5 h-5"/>
              <Icon name="lock"/><span>私密日記</span>
            </label>
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={formData.isFavorite} onChange={e=>setFormData({...formData,isFavorite:e.target.checked})} className="w-5 h-5"/>
              <Icon name="heart"/><span>加入最愛</span>
            </label>
          </div>

          {/* Reminder */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-medium mb-2">提醒時間（本地）</label>
              <input type="datetime-local" value={formData.remindAt} onChange={e=>setFormData({...formData, remindAt:e.target.value})} className="w-full border rounded-lg p-2"/>
              <div className="text-xs text-gray-500 mt-1">到時會發出桌面通知（需保持瀏覽器開啟或定期檢查）。</div>
            </div>
          </div>


          <button onClick={handleSaveDiary} className="w-full primary-bg text-white py-3 rounded-lg text-lg font-bold hover:opacity-90 flex items-center justify-center gap-2">
            <Icon name="save"/> {isEditing?'儲存修改':'發布日記'}
          </button>
        </div>
      );
    };


    /* =========================
       主應用程式
    ==========================*/
    const App = () => {
      const [user, setUser] = useState(null);
      const [diaries, setDiaries] = useState([]);
      const [activeView, setActiveView] = useState('list'); // 'list', 'summary'
      const [currentDiary, setCurrentDiary] = useState(null);
      const [showNewDiary, setShowNewDiary] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('date-desc');
      const [filterMood, setFilterMood] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [privateUnlockHash, setPrivateUnlockHash] = useState(null); // 用於解鎖私密日記
      const [darkMode, setDarkMode] = useState(false);
      const [themeColor, setThemeColor] = useState(localStorage.getItem('themeColor')||'#7c3aed');
      const [dateFilter, setDateFilter] = useState('');
      const [uploading, setUploading] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);

      // Premium
      const [showPremium, setShowPremium] = useState(false);
      const [appliedCoupon, setAppliedCoupon] = useState(null); // === Coupon 金額折抵 ===
      const [selectedPlan, setSelectedPlan] = useState('monthly'); // === Coupon 金額折抵 ===

      // Profile / 會員
      const [profile, setProfile] = useState(null);
      const isAdmin = profile?.role === 'admin';
      const membership = profile?.membership || { tier:'free', expiresAt:null };
      const [favoritesOnly, setFavoritesOnly] = useState(false);


      const [formData, setFormData] = useState({
        title:'', content:'', tags:[], mood:'😊', weather:'☀️', isPrivate:false, isFavorite:false, images:[], remindAt:''
      });

      /* Init / Global Effects */
      useEffect(()=>{
        ReminderService.requestPermission();
        ReminderService.scheduleTicker();
      },[]);

      useEffect(()=>{
        document.documentElement.style.setProperty('--primary', themeColor);
        localStorage.setItem('themeColor', themeColor);
      },[themeColor]);

      useEffect(()=>{
        localStorage.setItem('darkMode', darkMode ? '1' : '0');
        if(darkMode){
          document.body.classList.add('dark');
        }else{
          document.body.classList.remove('dark');
        }
      }, [darkMode]);

      useEffect(()=>{
        const dm = localStorage.getItem('darkMode');
        if(dm==='1') setDarkMode(true);
      },[]);


      /* Auth + Firestore */
      useEffect(()=>{
        const unsub = auth.onAuthStateChanged(async (u)=>{
          setUser(u||null);
          if(u){
            // 讀取 Profile
            db.collection('users').doc(u.uid).onSnapshot(s=>{
              if(s.exists){
                const d = s.data();
                setProfile({
                  role: d.role||'user',
                  membership: d.membership||{tier:'free',expiresAt:null},
                  privatePasswordHash: d.privatePasswordHash
                });
                setPrivateUnlockHash(d.privatePasswordHash); // 同步到解鎖 Hash
              }else{
                setProfile({ role:'user', membership:{ tier:'free', expiresAt:null }, privatePasswordHash: undefined });
                setPrivateUnlockHash(undefined);
              }
            });
            // 讀取 Diaries
            db.collection('users').doc(u.uid).collection('diaries')
              .orderBy('createdAt','desc')
              .onSnapshot(snap=>{
                const arr = [];
                snap.forEach(doc=>arr.push({ id:doc.id, ...doc.data() }));
                setDiaries(arr);
              }, err=>alert('讀取日記失敗：'+err.message));
          }else{
            // 離線模式：讀取 localStorage
            const localDiaries = JSON.parse(localStorage.getItem('localDiaries')||'[]');
            setDiaries(localDiaries.map(d=>({...d, createdAt:d.createdAt||new Date().toISOString()})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
            setProfile(null);
            setPrivateUnlockHash(localStorage.getItem('privatePasswordHash')); // 從 local 讀取解鎖 Hash
          }
        });
        return ()=>unsub();
      },[]);

      /* Data Processing */
      const filteredDiaries = useMemo(()=>{
        let list = [...diaries];

        // 搜尋
        if(searchTerm){
          const searchLower = searchTerm.toLowerCase();
          list = list.filter(d=>
            d.title.toLowerCase().includes(searchLower) ||
            d.content.toLowerCase().includes(searchLower) ||
            (d.tags||[]).some(t=>t.toLowerCase().includes(searchLower))
          );
        }
        // 篩選心情
        if(filterMood){
          list = list.filter(d=>d.mood===filterMood);
        }
        // 篩選標籤
        if(selectedTag){
          list = list.filter(d=>(d.tags||[]).includes(selectedTag));
        }
        // 篩選日期
        if(dateFilter){
          list = list.filter(d=>{
            const dt = toDate(d.createdAt);
            return dt && localDateKey(dt)===dateFilter;
          });
        }
        // 只看最愛
        if(favoritesOnly){
          list = list.filter(d=>d.isFavorite);
        }

        // 排序
        list.sort((a,b)=>{
          if(sortBy==='date-asc') return toDate(a.createdAt)-toDate(b.createdAt);
          if(sortBy==='title') return a.title.localeCompare(b.title, 'zh-TW');
          return toDate(b.createdAt)-toDate(a.createdAt); // date-desc (預設)
        });

        return list;
      }, [diaries, searchTerm, sortBy, filterMood, selectedTag, dateFilter, favoritesOnly]);


      /* Diary CRUD & Logic */
      const resetForm = ()=>{
        setFormData({ title:'', content:'', tags:[], mood:'😊', weather:'☀️', isPrivate:false, isFavorite:false, images:[], remindAt:'' });
        setCurrentDiary(null);
        setShowNewDiary(false);
      };

      const handleUploadImages = async (files)=>{
        if(!files || files.length===0) return;
        setUploading(true);
        try{
          const urls=[];
          for(const f of files){
            if(!user){
              // 離線模式：使用本地 blob URL
              urls.push(URL.createObjectURL(f));
            }else{
              // 線上模式：上傳到 Firebase Storage
              const id = formData.id || (currentDiary?.id) || db.collection('_').doc().id;
              const ref = storage.ref().child(`${user.uid}/${id}/${Date.now()}_${f.name}`);
              await ref.put(f);
              const url = await ref.getDownloadURL();
              urls.push(url);
            }
          }
          setFormData(prev=>({...prev, images:[...(prev.images||[]), ...urls]}));
        }catch(e){
          alert('上傳失敗：'+e.message);
        } finally{
          setUploading(false);
        }
      };

      // 儲存日記
      const handleSaveDiary = async ()=>{
        if(!formData.title || !formData.content){
          alert('請填寫標題和內容');
          return;
        }

        const docData = {
          title: formData.title,
          content: formData.content,
          tags: formData.tags||[],
          mood: formData.mood||'😊',
          weather: formData.weather||'☀️',
          isPrivate: !!formData.isPrivate,
          isFavorite: !!formData.isFavorite,
          images: formData.images||[],
          createdAt: currentDiary?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };

        // 提醒服務
        if(formData.remindAt){
          const when = new Date(formData.remindAt);
          if (!isNaN(when.getTime())) {
            ReminderService.add({
              id: (currentDiary?.id)||docData.createdAt,
              at: when.toISOString(),
              title: docData.title,
              freq: 'ONCE',
              fired:false
            });
            alert('提醒已設定：'+when.toLocaleString('zh-TW'));
          } else {
            alert('提醒時間格式不正確，已忽略。');
          }
        }

        if(user){
          // 線上模式
          const col = db.collection('users').doc(user.uid).collection('diaries');
          if(currentDiary){
            await col.doc(currentDiary.id).set(docData, { merge:true });
          } else {
            await col.add(docData);
          }
        }else{
          // 離線模式
          const id = currentDiary?.id || Date.now().toString();
          const newItem = { id, ...docData };
          let updatedDiaries;
          if(currentDiary){
            updatedDiaries = diaries.map(d=>d.id===id?newItem:d);
          } else{
            updatedDiaries = [newItem, ...diaries];
          }
          localStorage.setItem('localDiaries', JSON.stringify(updatedDiaries));
          setDiaries(updatedDiaries); // 手動更新 state
        }
        resetForm();
      };

      const handleDeleteDiary = async (id)=>{
        if(!confirm('確定要刪除這篇日記嗎？')) return;
        if(user){
          await db.collection('users').doc(user.uid).collection('diaries').doc(id).delete();
        } else{
          const updatedDiaries = diaries.filter(d=>d.id!==id);
          localStorage.setItem('localDiaries', JSON.stringify(updatedDiaries));
          setDiaries(updatedDiaries);
        }
        if(currentDiary?.id===id) setCurrentDiary(null);
      };

      const handleEditDiary = (diary)=>{
        setCurrentDiary(diary);
        setFormData({ ...diary, remindAt:'' });
        setShowNewDiary(true);
      };

      const toggleFavorite = async (id)=>{
        if(user){
          const doc = diaries.find(d=>d.id===id);
          await db.collection('users').doc(user.uid).collection('diaries').doc(id)
            .set({ isFavorite: !doc.isFavorite }, { merge:true });
        }else{
          const updatedDiaries = diaries.map(d=>d.id===id?{...d, isFavorite:!d.isFavorite}:d);
          localStorage.setItem('localDiaries', JSON.stringify(updatedDiaries));
          setDiaries(updatedDiaries);
          setCurrentDiary(d=>d.id===id?updatedDiaries.find(ud=>ud.id===id):d);
        }
      };

      // 解鎖私密日記的輔助函數
      const unlockPrivateDiary = async (password) => {
        const hashed = await sha256Hex(password);
        if(hashed===privateUnlockHash){
          setCurrentDiary(c=>({...c, isPrivate:false, isUnlocked:true}));
          return true;
        }
        return false;
      };


      /* Settings Handlers */
      const exportDiaries = ()=>{
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(diaries,null,2));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `diary_backup_${localDateKey(new Date())}.json`);
        dl.click();
      };
      const importDiaries = (file)=>{
        const reader = new FileReader();
        reader.onload = async (e)=>{
          try{
            const arr = JSON.parse(e.target.result);
            if(!Array.isArray(arr)){ throw new Error('檔案格式不正確'); }
            if(user){
              // 線上模式：批次寫入
              const batch = db.batch();
              const col = db.collection('users').doc(user.uid).collection('diaries');
              arr.forEach(d=>{
                const ref = d.id ? col.doc(d.id) : col.doc();
                batch.set(ref, d, { merge:true });
              });
              await batch.commit();
            }else{
              // 離線模式：覆蓋或合併
              const existing = JSON.parse(localStorage.getItem('localDiaries')||'[]');
              const merged = [...existing.filter(ed=>!arr.some(ad=>ad.id===ed.id)), ...arr];
              localStorage.setItem('localDiaries', JSON.stringify(merged));
              setDiaries(merged); // 手動更新 state
            }
            alert(`已匯入 ${arr.length} 篇日記`);
          }catch(err){ alert('匯入失敗：'+err.message); }
        };
        reader.readAsText(file);
      };

      const onBackupToStorage = async ()=>{
        if(!user){ alert('請先登入才能備份'); return; }
        const dataStr = JSON.stringify(diaries.map(d=>{
          const {id, ...rest} = d; return rest; // 移除 id，避免重複的 id
        }),null,2);
        const ref = storage.ref().child(`${user.uid}/backup/latest.json`);
        await ref.putString(dataStr, 'raw', { contentType:'application/json' });
        alert('備份完成 ✅');
      };

      const onRestoreFromStorage = async ()=>{
        if(!user){ alert('請先登入才能還原'); return; }
        const ref = storage.ref().child(`${user.uid}/backup/latest.json`);
        const url = await ref.getDownloadURL();
        const res = await fetch(url);
        if(!res.ok){ alert('找不到備份檔案'); return; }
        const arr = await res.json();
        const batch = db.batch();
        const col = db.collection('users').doc(user.uid).collection('diaries');
        arr.forEach(d=>{
          const ref = d.id ? col.doc(d.id) : col.doc();
          batch.set(ref, d, { merge:true });
        });
        await batch.commit();
        alert('已從 Storage 還原最新備份');
      };

      const todayShortcut = ()=>{
        const today = localDateKey(new Date());
        setDateFilter(today);
        setCurrentDiary(null);
        setShowNewDiary(false);
      };

      const toggleFavoritesOnly = ()=> setFavoritesOnly(v=>!v);

      // 提醒 CRUD
      const onAddReminder = ({title, when, freq})=>{
        const id = `rem_${Date.now()}`;
        const dt = new Date(when);
        if (isNaN(dt.getTime())) { alert('時間格式不正確'); return; }
        ReminderService.add({ id, title, at: dt.toISOString(), freq, fired:false });
        alert('已新增提醒');
      };
      const onRemoveReminder = (id)=>{
        ReminderService.remove(id);
        alert('已刪除提醒');
      };

      // 設定會員層級（示範）
      const onSetMembershipTier = async (tier)=>{
        if(!user){ alert('請先登入'); return; }
        const expiresAt = membership?.expiresAt ? toDate(membership.expiresAt) : new Date();
        if(tier==='free'){
          await db.collection('users').doc(user.uid).set({ membership:{ tier:'free', expiresAt:null }}, {merge:true});
        }else{
          const base = expiresAt || new Date();
          base.setDate(base.getDate()+30);
          await db.collection('users').doc(user.uid).set({ membership:{ tier, expiresAt: base.toISOString() }},{merge:true});
        }
        alert('會員狀態已更新（示範）');
      };

      // 建立優惠券（管理員）：支援 discountAmount（優先）
      const onCreateCoupon = async ({code, months, active, discountAmount})=>{
        if(!user || !isAdmin){ alert('需要管理員權限'); return; }
        if(!code){ alert('請輸入代碼'); return; }
        const payload = {
          code, active: !!active,
          discountAmount: Math.max(0, parseInt(discountAmount||0)),
          discountMonths: Math.max(0, parseInt(months||0)) || null,
          createdBy: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('coupons').doc(code).set(payload, { merge:true });
        alert('已建立/更新優惠券：'+code);
      };

      // 套用優惠券（讀取折抵金額）— 支援未登入試算；真的購買時才記錄兌換
      const onApplyCoupon = async (code)=>{
        if(!user){ alert('請先登入才能套用優惠券'); return; }
        if(!code){ alert('請輸入優惠券代碼'); return; }
        try{
          const snap = await db.collection('coupons').doc(code).get();
          if(!snap.exists){ alert('優惠券不存在'); return; }
          const c = snap.data();
          if(c.active === false){ alert('此優惠券未啟用'); return; }
          const discountAmount = Math.max(0, Number(c.discountAmount||0));
          if(discountAmount <= 0){ alert('此優惠券未設定折抵金額'); return; }
          setAppliedCoupon({ code, discountAmount, active:true });
          alert(`已套用優惠券：${code}（可折抵 NT$ ${discountAmount}）`);
        }catch(err){ alert('讀取優惠券失敗：' + err.message); }
      };

      const onClearCoupon = ()=> setAppliedCoupon(null);

      // 付款示範（用折抵後金額）
      const onPurchase = async (plan, coupon, basePrice, duePrice)=> {
        if(!user){ alert('請先登入'); return; }
        if(duePrice === 0 && basePrice > 0){
          if(!confirm(`您確定要以免費（NT$ 0）兌換 ${plan} 方案嗎？`)) return;
        }

        // 模擬付款成功，並更新會員狀態
        const months = plan==='yearly'?12:1;
        const tier = 'pro'; // 假設付費都是 pro

        const expiresAt = membership?.expiresAt ? toDate(membership.expiresAt) : new Date();
        const base = expiresAt || new Date();
        // 如果 base 在未來，則從 base 往後加；否則從今天往後加
        base.setDate(base.getDate() + (base > new Date() ? 0 : 0));
        base.setMonth(base.getMonth() + months);

        await db.collection('users').doc(user.uid).set({
          membership:{
            tier,
            expiresAt: base.toISOString(),
            lastPurchase: firebase.firestore.FieldValue.serverTimestamp(),
            lastPlan: plan,
            lastPaid: duePrice
          }
        }, {merge:true});

        if(coupon){
          // 兌換紀錄
          await db.collection('couponRedemptions').add({
            userId: user.uid,
            couponCode: coupon.code,
            redeemedAt: firebase.firestore.FieldValue.serverTimestamp(),
            plan, duePrice
          });
        }
        setShowPremium(false);
        setAppliedCoupon(null);
        alert(`恭喜！已成功升級為 ${tier.toUpperCase()} 會員！`);
      };


      /* Render */
      const renderMainContent = () => {
        switch(activeView){
          case 'summary':
            return (
              <div className="max-w-7xl mx-auto p-4 space-y-6">
                <StreakBadge diaries={diaries}/>
                <Charts diaries={diaries} darkMode={darkMode}/>
                <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                  <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="calendar"/><span>日曆檢視</span></h3>
                  <CalendarView diaries={diaries} onPickDate={(d)=>{ setDateFilter(d); setActiveView('list'); }} />
                  {dateFilter && (
                    <div className="mt-3 text-sm">
                      目前篩選日期：<span className="font-semibold">{dateFilter}</span>
                      <button onClick={()=>setDateFilter('')} className="ml-2 px-2 py-0.5 rounded bg-gray-200 hover:bg-gray-300">清除</button>
                    </div>
                  )}
                </div>
              </div>
            );
          case 'list':
            return (
              <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* ✅ 左欄：篩選 + 新增 + 清單 + 【分析圖表】 */}
                {/* 移除 max-h-screen overflow-y-auto，讓主視窗捲動 */}
                <div className={`lg:col-span-1 ${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6 space-y-4`}>
                  
                  {/* === 篩選區 === */}
                  <div className="relative">
                    <div className="absolute left-3 top-3"><Icon name="search" className="w-5 h-5 text-gray-400"/></div>
                    <input type="text" placeholder="搜尋日記..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                      className={`w-full pl-10 pr-4 py-2 rounded-lg border ${darkMode?'bg-gray-700 border-gray-600 text-white':'border-gray-300'} focus:ring-2 focus:outline-none`}/>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode?'bg-gray-700 text-white':'bg-gray-100'}`}>
                      <option value="date-desc">最新優先</option>
                      <option value="date-asc">最舊優先</option>
                      <option value="title">標題排序</option>
                    </select>
                    <select value={filterMood} onChange={e=>setFilterMood(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode?'bg-gray-700 text-white':'bg-gray-100'}`}>
                      <option value="">所有心情</option>
                      {moods.map(m=> <option key={m} value={m}>{m}</option>)}
                    </select>
                    <button onClick={todayShortcut} className="px-2 py-1 rounded-full text-sm border">今天</button>
                    <button onClick={toggleFavoritesOnly} className={`px-2 py-1 rounded-full text-sm border ${favoritesOnly?'bg-yellow-50':''}`}>只看最愛</button>
                  </div>
                  {dateFilter && (
                    <div className="text-sm">
                      日期篩選：<span className="font-semibold">{dateFilter}</span>
                      <button onClick={()=>setDateFilter('')} className="ml-2 px-2 py-0.5 rounded bg-gray-200 hover:bg-gray-300">清除</button>
                    </div>
                  )}
                  <div>
                    <div className="text-sm mb-2 text-gray-500">標籤雲（點擊篩選）</div>
                    <TagCloud diaries={diaries} activeTag={selectedTag} onToggle={(t)=> setSelectedTag(selectedTag===t?'':t) } />
                  </div>
                  
                  {/* [✅ 新增圖表區塊 - 在篩選區下方] */}
                  <div className="pt-4 border-t mt-4">
                    <h3 className="text-xl font-bold mb-3">數據分析</h3>
                    <ChartsSmall diaries={diaries} darkMode={darkMode}/>
                  </div>
                  
                  <button onClick={()=>{resetForm(); setShowNewDiary(true);}}
                    className="w-full primary-bg text-white py-3 rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
                    <Icon name="plus"/> 新增日記
                  </button>
                  
                  {/* === 日記清單區 === */}
                  <div className="space-y-3">
                    {filteredDiaries.length===0 ? (
                      <div className="text-center py-8 text-gray-400"><p>還沒有日記，快來寫一篇吧！</p></div>
                    ) : filteredDiaries.map(d=>{
                      const dt = toDate(d.createdAt);
                      const dateText = dt ? dt.toLocaleDateString('zh-TW') : '—';
                      return (
                        <div key={d.id}
                          onClick={()=>{ setCurrentDiary(d); setShowNewDiary(false); setDateFilter(''); }}
                          className={`p-4 rounded-lg cursor-pointer transition ${currentDiary?.id===d.id ? 'bg-purple-100 border-2 primary-border' : darkMode?'bg-gray-700 hover:bg-gray-600':'bg-gray-50 hover:bg-gray-100'}`}>
                          <div className="flex items-start justify-between mb-2">
                            <div className="flex items-center gap-2">
                              <span className="text-2xl">{d.mood}</span>
                              <span className="text-lg">{d.weather}</span>
                            </div>
                            <div className="flex items-center gap-2">
                              {d.isFavorite && <Icon name="heart" className="w-4 h-4 text-red-500" fill={true}/>}
                              {d.isPrivate && <Icon name="lock" className="w-4 h-4"/>}
                            </div>
                          </div>
                          <h3 className="font-bold mb-1">{d.title}</h3>
                          <p className="text-sm text-gray-500 mb-2">{dateText}</p>
                          {d.isPrivate ? (
                            <div className="text-xs text-gray-500 italic flex items-center gap-1">
                              <Icon name="lock" className="w-3 h-3" />
                              <span>私密內容已隱藏</span>
                            </div>
                          ) : (
                            <p className="text-sm line-clamp-2">{d.content}</p>
                          )}
                          {(d.tags||[]).length>0 && (
                            <div className="flex gap-1 mt-2 flex-wrap">
                              {d.tags.map(t=><span key={t} className="text-xs bg-purple-200 text-purple-700 px-2 py-1 rounded">#{t}</span>)}
                            </div>
                          )}
                          {d.images?.length>0 && (
                            <div className="mt-2 flex gap-2 overflow-x-auto">
                              {d.images.slice(0,3).map((url,i)=>(
                                <img key={i} src={url} className="w-16 h-16 object-cover rounded-lg border"/>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 右欄：日曆 + 編輯/檢視 (移除 Charts) */}
                <div className="lg:col-span-2 grid grid-cols-1 gap-6">
                  {/* 日曆 */}
                  <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                    <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="calendar"/><span>日曆檢視</span></h3>
                    <CalendarView diaries={diaries} onPickDate={(d)=>{ setDateFilter(d); setCurrentDiary(null); setShowNewDiary(false); }} />
                    {dateFilter && (
                      <div className="mt-3 text-sm">
                        目前篩選日期：<span className="font-semibold">{dateFilter}</span>
                        <button onClick={()=>setDateFilter('')} className="ml-2 px-2 py-0.5 rounded bg-gray-200 hover:bg-gray-300">清除</button>
                      </div>
                    )}
                  </div>

                  {/* 編輯/檢視 (新增 sticky top-20) */}
                  <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6 sticky top-20`}> 
                    {showNewDiary ? (
                      <NewDiaryForm formData={formData} setFormData={setFormData} handleSaveDiary={handleSaveDiary} handleUploadImages={handleUploadImages} uploading={uploading} currentDiary={currentDiary} resetForm={resetForm}/>
                    ) : currentDiary ? (
                      <DiaryViewer currentDiary={currentDiary} onEdit={handleEditDiary} onDelete={handleDeleteDiary} onToggleFavorite={toggleFavorite} onUnlock={unlockPrivateDiary} canUnlock={privateUnlockHash} />
                    ) : (
                      <div className="flex items-center justify-center h-full text-gray-400">
                        <div className="text-center">
                          <Icon name="archive" className="w-20 h-20 mx-auto mb-4"/>
                          <p className="text-xl">選擇一篇日記來查看，或建立新的日記</p>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          default:
            return <div className="max-w-7xl mx-auto p-4">請選擇檢視模式</div>;
        }
      };


      return (
        <div className={`min-h-screen ${darkMode?'bg-gray-900 text-white':'bg-transparent'}`}>
          {/* Top Bar */}
          <div className={`${darkMode?'bg-gray-800':'bg-white'} shadow-lg sticky top-0 z-50`}>
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-4">
              <h1 className="text-2xl font-bold primary-text">📔 我的日記本</h1>
              <div className="flex items-center gap-3 flex-wrap">
                
                {/* 模式切換 */}
                <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-700">
                  <button onClick={()=>setActiveView('list')} className={`px-2 py-1 rounded-full text-sm ${activeView==='list'?'primary-bg text-white':'hover:bg-gray-200 dark:hover:bg-gray-600'}`}>所有記錄</button>
                  <button onClick={()=>setActiveView('summary')} className={`px-2 py-1 rounded-full text-sm ${activeView==='summary'?'primary-bg text-white':'hover:bg-gray-200 dark:hover:bg-gray-600'}`}>分析總覽</button>
                </div>

                <button onClick={()=>setShowPremium(true)} className="px-3 py-1 rounded-lg primary-bg text-white">
                  Get Premium
                </button>
                {/* 取代原本的設定按鈕 */}
                <button onClick={()=>setSettingsOpen(true)} title="設定" className={`group w-10 h-10 rounded-full flex items-center justify-center ring-1 transition hover:scale-105 ${darkMode ? 'ring-white/20 hover:ring-white/30 bg-transparent' : 'ring-black/10 hover:ring-black/20 bg-transparent'}`}
                >
                  <Icon name="gear" className="w-6 h-6"/>
                </button>
                <AuthBar user={user}/>
              </div>
            </div>
          </div>

          {/* Streak */}
          {activeView === 'list' && (
            <div className="max-w-7xl mx-auto px-4 pt-4">
              <StreakBadge diaries={diaries}/>
            </div>
          )}

          {/* Premium */}
          <PremiumModal
            open={showPremium} onClose={()=>setShowPremium(false)}
            onApplyCoupon={onApplyCoupon} onClearCoupon={onClearCoupon}
            onPurchase={onPurchase} membership={membership} user={user}
            appliedCoupon={appliedCoupon} selectedPlan={selectedPlan} setSelectedPlan={setSelectedPlan}
          />
          {/* 設定面板 */}
          <SettingsPanel
            open={settingsOpen} onClose={()=>setSettingsOpen(false)}
            exportDiaries={exportDiaries} importDiaries={importDiaries}
            themeColor={themeColor} setThemeColor={setThemeColor}
            reminders={ReminderService.load()} onAddReminder={onAddReminder} onRemoveReminder={onRemoveReminder}
            profile={profile} isAdmin={isAdmin} onCreateCoupon={onCreateCoupon} onApplyCoupon={onApplyCoupon}
            membership={membership} onSetMembershipTier={onSetMembershipTier}
            onBackupToStorage={onBackupToStorage} onRestoreFromStorage={onRestoreFromStorage}
            todayShortcut={todayShortcut} toggleFavoritesOnly={toggleFavoritesOnly} favoritesOnly={favoritesOnly}
            darkMode={darkMode} setDarkMode={setDarkMode} user={user}
          />

          {/* 主區 */}
          {renderMainContent()}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
