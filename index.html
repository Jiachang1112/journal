<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日記本 📔</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .line-clamp-2 { 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .gradient-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-pink { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .gradient-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .gradient-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .gradient-orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG 圖示組件
        const Icon = ({ name, className = "w-5 h-5", fill = false }) => {
            const icons = {
                search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
                plus: "M12 4v16m8-8H4",
                calendar: "M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z",
                heart: "M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z",
                lock: "M5 11h14a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2v-7a2 2 0 012-2zm2-4a5 5 0 0110 0v4H7V7z",
                trash: "M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2m-6 5v6m4-6v6",
                edit: "M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z",
                save: "M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z",
                x: "M6 18L18 6M6 6l12 12",
                moon: "M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z",
                sun: "M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 6a6 6 0 100 12 6 6 0 000-12z",
                download: "M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m4-5l5 5m0 0l5-5m-5 5V3",
                upload: "M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5-5m0 0L7 8m5-5v12",
                chart: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z",
                settings: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z",
                star: "M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z",
                clock: "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z",
            };
            return React.createElement('svg', {
                className: className,
                fill: fill ? "currentColor" : "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round",
                viewBox: "0 0 24 24"
            }, React.createElement('path', { d: icons[name] }));
        };

        const DiaryApp = () => {
            const [diaries, setDiaries] = useState([]);
            const [filteredDiaries, setFilteredDiaries] = useState([]);
            const [currentDiary, setCurrentDiary] = useState(null);
            const [showNewDiary, setShowNewDiary] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedTag, setSelectedTag] = useState('');
            const [sortBy, setSortBy] = useState('date-desc');
            const [filterMood, setFilterMood] = useState('');
            const [darkMode, setDarkMode] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [themeColor, setThemeColor] = useState('purple');
            const [showCalendar, setShowCalendar] = useState(false);
            const [formData, setFormData] = useState({
                title: '',
                content: '',
                tags: [],
                mood: '😊',
                weather: '☀️',
                isPrivate: false,
                isFavorite: false,
            });

            const moods = ['😊', '😢', '😡', '😰', '😍', '🤔', '😴', '🎉', '😎', '🥳', '🤗', '😌'];
            const weathers = ['☀️', '⛅', '☁️', '🌧️', '⛈️', '🌈', '❄️', '🌙', '🌪️', '🔥', '💨', '🌊'];
            const allTags = ['生活', '工作', '旅遊', '學習', '健康', '人際關係', '興趣', '美食', '運動', '閱讀', '音樂', '電影'];

            // 載入範例日記
            useEffect(() => {
                const savedDiaries = localStorage.getItem('myDiaries');
                if (savedDiaries) {
                    setDiaries(JSON.parse(savedDiaries));
                } else {
                    const sampleDiaries = [
                        {
                            id: '1',
                            title: '美好的一天',
                            content: '今天天氣很好，去公園散步，心情很愉快。看到很多人在運動，也遇到了老朋友，聊了很久。決定以後要多出去走走，享受大自然的美好。',
                            tags: ['生活', '健康'],
                            mood: '😊',
                            weather: '☀️',
                            isPrivate: false,
                            isFavorite: true,
                            createdAt: new Date('2025-10-18').toISOString(),
                            updatedAt: new Date('2025-10-18').toISOString()
                        },
                        {
                            id: '2',
                            title: '工作上的挑戰',
                            content: '今天遇到了一個難題，花了很多時間才解決。雖然很累，但學到了很多東西。感謝團隊的支持和幫助。',
                            tags: ['工作', '學習'],
                            mood: '🤔',
                            weather: '☁️',
                            isPrivate: false,
                            isFavorite: false,
                            createdAt: new Date('2025-10-17').toISOString(),
                            updatedAt: new Date('2025-10-17').toISOString()
                        },
                        {
                            id: '3',
                            title: '週末計畫',
                            content: '這個週末想去爬山，希望天氣好。也想去看那部期待很久的電影。還要記得買一些日用品。',
                            tags: ['生活', '興趣'],
                            mood: '😍',
                            weather: '🌈',
                            isPrivate: false,
                            isFavorite: false,
                            createdAt: new Date('2025-10-16').toISOString(),
                            updatedAt: new Date('2025-10-16').toISOString()
                        }
                    ];
                    setDiaries(sampleDiaries);
                }
            }, []);

            // 儲存到 localStorage
            useEffect(() => {
                if (diaries.length > 0) {
                    localStorage.setItem('myDiaries', JSON.stringify(diaries));
                }
            }, [diaries]);

            // 過濾和排序
            useEffect(() => {
                let filtered = [...diaries];
                if (searchTerm) {
                    filtered = filtered.filter(d => 
                        d.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        d.content.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                if (selectedTag) {
                    filtered = filtered.filter(d => d.tags && d.tags.includes(selectedTag));
                }
                if (filterMood) {
                    filtered = filtered.filter(d => d.mood === filterMood);
                }
                filtered.sort((a, b) => {
                    switch (sortBy) {
                        case 'date-desc': return new Date(b.createdAt) - new Date(a.createdAt);
                        case 'date-asc': return new Date(a.createdAt) - new Date(b.createdAt);
                        case 'title': return a.title.localeCompare(b.title);
                        default: return 0;
                    }
                });
                setFilteredDiaries(filtered);
            }, [diaries, searchTerm, selectedTag, filterMood, sortBy]);

            const handleSaveDiary = () => {
                if (!formData.title || !formData.content) {
                    alert('請填寫標題和內容');
                    return;
                }
                const diary = {
                    ...formData,
                    id: currentDiary?.id || Date.now().toString(),
                    wordCount: formData.content.length,
                    createdAt: currentDiary?.createdAt || new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                if (currentDiary) {
                    setDiaries(diaries.map(d => d.id === diary.id ? diary : d));
                } else {
                    setDiaries([diary, ...diaries]);
                }
                resetForm();
            };

            const handleDeleteDiary = (id) => {
                if (window.confirm('確定要刪除這篇日記嗎？')) {
                    setDiaries(diaries.filter(d => d.id !== id));
                    if (currentDiary?.id === id) setCurrentDiary(null);
                }
            };

            const handleEditDiary = (diary) => {
                setCurrentDiary(diary);
                setFormData(diary);
                setShowNewDiary(true);
            };

            const toggleFavorite = (id) => {
                setDiaries(diaries.map(d => 
                    d.id === id ? { ...d, isFavorite: !d.isFavorite } : d
                ));
            };

            const resetForm = () => {
                setFormData({
                    title: '', content: '', tags: [], mood: '😊',
                    weather: '☀️', isPrivate: false, isFavorite: false
                });
                setCurrentDiary(null);
                setShowNewDiary(false);
            };

            const handleTagToggle = (tag) => {
                setFormData(prev => ({
                    ...prev,
                    tags: (prev.tags || []).includes(tag)
                        ? prev.tags.filter(t => t !== tag)
                        : [...(prev.tags || []), tag]
                }));
            };

            const exportDiaries = () => {
                const dataStr = JSON.stringify(diaries, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `diary_backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            const importDiaries = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        setDiaries([...imported, ...diaries]);
                        alert('匯入成功！');
                    } catch (error) {
                        alert('匯入失敗，請確認檔案格式正確');
                    }
                };
                reader.readAsText(file);
            };

            // 統計數據
            const getStats = () => {
                const total = diaries.length;
                const moodStats = {};
                const tagStats = {};
                let totalWords = 0;
                const favorites = diaries.filter(d => d.isFavorite).length;

                diaries.forEach(diary => {
                    moodStats[diary.mood] = (moodStats[diary.mood] || 0) + 1;
                    if (diary.tags) {
                        diary.tags.forEach(tag => {
                            tagStats[tag] = (tagStats[tag] || 0) + 1;
                        });
                    }
                    totalWords += (diary.wordCount || diary.content?.length || 0);
                });

                return { 
                    total, 
                    moodStats, 
                    tagStats, 
                    totalWords, 
                    avgWords: total ? Math.round(totalWords / total) : 0,
                    favorites
                };
            };

            const stats = getStats();
            const themeColors = {
                purple: 'purple',
                pink: 'pink',
                blue: 'blue',
                green: 'green',
                orange: 'orange'
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gradient-to-br from-purple-50 to-blue-50'}`}>
                    {/* 頂部導航 */}
                    <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} shadow-lg sticky top-0 z-50`}>
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-4">
                            <h1 className={`text-2xl font-bold text-${themeColor}-600`}>📔 我的日記本</h1>
                            <div className="flex items-center gap-2 flex-wrap">
                                <button 
                                    onClick={() => setShowStats(!showStats)} 
                                    className={`p-2 rounded-lg ${showStats ? 'bg-purple-100' : 'hover:bg-gray-100'}`}
                                    title="統計"
                                >
                                    <Icon name="chart" />
                                </button>
                                <button 
                                    onClick={() => setShowCalendar(!showCalendar)} 
                                    className={`p-2 rounded-lg ${showCalendar ? 'bg-purple-100' : 'hover:bg-gray-100'}`}
                                    title="日曆"
                                >
                                    <Icon name="calendar" />
                                </button>
                                <button onClick={exportDiaries} className="p-2 hover:bg-gray-100 rounded-lg" title="匯出">
                                    <Icon name="download" />
                                </button>
                                <label className="p-2 hover:bg-gray-100 rounded-lg cursor-pointer" title="匯入">
                                    <Icon name="upload" />
                                    <input type="file" accept=".json" onChange={importDiaries} className="hidden" />
                                </label>
                                <button 
                                    onClick={() => setShowSettings(!showSettings)} 
                                    className={`p-2 rounded-lg ${showSettings ? 'bg-purple-100' : 'hover:bg-gray-100'}`}
                                    title="設定"
                                >
                                    <Icon name="settings" />
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-gray-100 rounded-lg" title="深色模式">
                                    <Icon name={darkMode ? 'sun' : 'moon'} />
                                </button>
                            </div>
                        </div>
                        
                        {/* 統計面板 */}
                        {showStats && (
                            <div className={`border-t ${darkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-200 bg-gray-50'} p-4`}>
                                <div className="max-w-7xl mx-auto">
                                    <h3 className="font-bold text-lg mb-4">📊 統計資訊</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-4">
                                        <div className={`text-center p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <div className="text-3xl font-bold text-purple-600">{stats.total}</div>
                                            <div className="text-sm text-gray-500">總日記數</div>
                                        </div>
                                        <div className={`text-center p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <div className="text-3xl font-bold text-blue-600">{stats.totalWords}</div>
                                            <div className="text-sm text-gray-500">總字數</div>
                                        </div>
                                        <div className={`text-center p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <div className="text-3xl font-bold text-green-600">{stats.avgWords}</div>
                                            <div className="text-sm text-gray-500">平均字數</div>
                                        </div>
                                        <div className={`text-center p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <div className="text-2xl">{Object.keys(stats.moodStats).sort((a,b) => stats.moodStats[b] - stats.moodStats[a])[0] || '😊'}</div>
                                            <div className="text-sm text-gray-500">最常心情</div>
                                        </div>
                                        <div className={`text-center p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <div className="text-3xl font-bold text-red-600">{stats.favorites}</div>
                                            <div className="text-sm text-gray-500">我的最愛</div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className={`p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <h4 className="font-semibold mb-2">心情分布</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {Object.entries(stats.moodStats).map(([mood, count]) => (
                                                    <div key={mood} className="flex items-center gap-1 bg-gray-100 dark:bg-gray-600 px-3 py-1 rounded-full">
                                                        <span className="text-xl">{mood}</span>
                                                        <span className="text-sm font-semibold">{count}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className={`p-4 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-white'} shadow`}>
                                            <h4 className="font-semibold mb-2">熱門標籤</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {Object.entries(stats.tagStats).sort((a,b) => b[1] - a[1]).slice(0, 10).map(([tag, count]) => (
                                                    <div key={tag} className="flex items-center gap-1 bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-300 px-3 py-1 rounded-full">
                                                        <span>#{tag}</span>
                                                        <span className="text-sm font-semibold">({count})</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 設定面板 */}
                        {showSettings && (
                            <div className={`border-t ${darkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-200 bg-gray-50'} p-4`}>
                                <div className="max-w-7xl mx-auto">
                                    <h3 className="font-bold text-lg mb-4">⚙️ 設定</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium mb-2">主題顏色</label>
                                            <div className="flex gap-2">
                                                {Object.keys(themeColors).map(color => (
                                                    <button
                                                        key={color}
                                                        onClick={() => setThemeColor(color)}
                                                        className={`w-10 h-10 rounded-full gradient-${color} ${themeColor === color ? 'ring-4 ring-offset-2 ring-gray-400' : ''}`}
                                                        title={color}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                        <div className="pt-4 border-t">
                                            <button 
                                                onClick={() => {
                                                    if (window.confirm('確定要清除所有日記嗎？此操作無法復原！')) {
                                                        setDiaries([]);
                                                        localStorage.removeItem('myDiaries');
                                                        alert('已清除所有日記');
                                                    }
                                                }}
                                                className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600"
                                            >
                                                清除所有日記
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* 左側欄 */}
                        <div className={`lg:col-span-1 ${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-xl p-6 max-h-[calc(100vh-120px)] overflow-y-auto`}>
                            <div className="space-y-4">
                                <div className="relative">
                                    <div className="absolute left-3 top-3">
                                        <Icon name="search" className="w-5 h-5 text-gray-400" />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="搜尋日記..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className={`w-full pl-10 pr-4 py-2 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-gray-300'} focus:ring-2 focus:ring-purple-500 focus:outline-none`}
                                    />
                                </div>

                                <div className="flex flex-wrap gap-2">
                                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode ? 'bg-gray-700 text-white' : 'bg-gray-100'}`}>
                                        <option value="date-desc">最新優先</option>
                                        <option value="date-asc">最舊優先</option>
                                        <option value="title">標題排序</option>
                                    </select>
                                    <select value={filterMood} onChange={(e) => setFilterMood(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode ? 'bg-gray-700 text-white'
