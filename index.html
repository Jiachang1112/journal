    /* =========================
       日期安全小工具
    ==========================*/
    const toDate = (val) => {
      try {
        if (!val) return null;
        if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
        if (typeof val === 'object' && typeof val.toDate === 'function') {
          const d = val.toDate(); return isNaN(d.getTime()) ? null : d;
        }
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
      } catch { return null; }
    };
    const localDateKey = (d) => {
      if (!(d instanceof Date) || isNaN(d.getTime())) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };

    /* ============== 新增：雜湊工具（SHA-256） ============== */
    async function sha256Hex(text){
      try{
        const enc = new TextEncoder().encode(text);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){
        return `plain:${text}`;
      }
    }

    /* ============== 新增：Streak 計算與徽章 ============== */
    function calcStreak(diaries){
      const set = new Set();
      diaries.forEach(d=>{
        const dt = toDate(d.createdAt); if(!dt) return;
        set.add(localDateKey(dt));
      });
      if(set.size===0) return { streak:0, best:0, hasToday:false };

      const keys = Array.from(set).sort();
      let best = 1, cur = 1;
      for(let i=1;i<keys.length;i++){
        const prev = new Date(keys[i-1]);
        const now  = new Date(keys[i]);
        const diff = Math.round((now - prev)/86400000);
        if(diff===1){ cur++; best=Math.max(best,cur); }
        else if(diff>1){ cur=1; }
      }

      const todayKey = localDateKey(new Date());
      const hasToday = set.has(todayKey);
      let streak = 0; let probe = new Date();
      while(set.has(localDateKey(probe))){ streak++; probe.setDate(probe.getDate()-1); }

      return { streak, best, hasToday };
    }

    const StreakBadge = ({ diaries }) => {
      const { streak, best, hasToday } = useMemo(()=>calcStreak(diaries), [diaries]);

          <span className="px-2 py-1 text-xs rounded-full primary-bg text-white">{tier.name}</span>

    /* =========================
       提醒（強化）
    ==========================*/
    const ReminderService = {
      key: 'diary_reminders_v2',
      load(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch{ return [] } },
      save(list){ localStorage.setItem(this.key, JSON.stringify(list)); },
      add(rem){
        const list=this.load(); list.push(rem); this.save(list);
      },
      remove(id){
        const list=this.load().filter(r=>r.id!==id); this.save(list);
      },
      _nextTime(cur, freq){
        if(freq==='DAILY'){ const d = new Date(cur); d.setDate(d.getDate()+1); return d; }
        if(freq==='WEEKLY'){ const d = new Date(cur); d.setDate(d.getDate()+7); return d; }
        return null;
      },
      scheduleTicker(){
        setInterval(()=>{
          let list = this.load(); const now = Date.now(); let dirty = false;
          for(const r of list){
            const due = new Date(r.at).getTime();
            if(now >= due){
              if(Notification?.permission==='granted'){ new Notification('日記提醒', { body: r.title || '該寫日記或查看備忘囉！' }); }
              if(r.freq && r.freq!=='ONCE'){
                const next = this._nextTime(new Date(r.at), r.freq);
                if(next){ r.at = next.toISOString(); r.fired = false; dirty = true; }
              }else{ r.fired = true; dirty = true; }
            }
          }
          const keep = list.filter(r => !(r.fired && (!r.freq || r.freq==='ONCE')));
          if(dirty || keep.length !== list.length){ this.save(keep); }
        }, 15000);
      },
      requestPermission(){
        if('Notification' in window && Notification.permission!=='granted'){ Notification.requestPermission(); }
      }
    };

    /* =========================
       Tag Cloud

    const TagCloud = ({ diaries, activeTag, onToggle }) => {
      const map = {};
      diaries.forEach(d => (d.tags||[]).forEach(t => map[t]=(map[t]||0)+1));

      const max = Math.max(...entries.map(e=>e[1]));
      return (
        <div className="flex flex-wrap gap-2">
          {entries.map(([tag,count])=>{
            const size = 12 + Math.round(8*(count/max));
            const active = activeTag===tag;
            return (

                onClick={()=>onToggle(tag)}
                className={`px-2 py-1 rounded-lg ${active?'primary-bg text-white':'bg-gray-100 hover:bg-gray-200'}`}
                style={{ fontSize: size }}
                title={`#${tag} ×${count}`}

    /* =========================
       Calendar
    ==========================*/
    const CalendarView = ({ diaries, onPickDate }) => {
      const [cur, setCur] = useState(new Date());
      const y = cur.getFullYear(), m = cur.getMonth();
      const first = new Date(y,m,1);
      const startDay = (first.getDay()+6)%7;
      const daysInMonth = new Date(y,m+1,0).getDate();

      const setMonth = (delta)=>{ const d=new Date(y,m+delta,1); setCur(d); };

      const hasMap = {};
      diaries.forEach(d=>{
        const dt = toDate(d.createdAt);
        if (dt) {
          const day = localDateKey(dt);
          if (day) hasMap[day] = (hasMap[day]||0)+1;
        }
      });

      const cells=[];
      for(let i=0;i<startDay;i++) cells.push(null);
      for(let d=1; d<=daysInMonth; d++) cells.push(new Date(y,m,d));

      return (
        <div className="border rounded-2xl p-4">
          <div className="flex items-center justify-between mb-2">
            <button onClick={()=>setMonth(-1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">‹</button>
            <div className="font-bold">{y} 年 {m+1} 月</div>
            <button onClick={()=>setMonth(1)} className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">›</button>
          </div>
          <div className="grid grid-cols-7 gap-2 text-center text-sm text-gray-500 mb-2">
            {['一','二','三','四','五','六','日'].map(d=><div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-2">
            {cells.map((d,i)=>{
              if(!d) return <div key={i}></div>;
              const key = localDateKey(d);
              const count = hasMap[key]||0;
              return (
                <button key={i}
                  onClick={()=>onPickDate(key)}
                  className={`h-20 rounded-xl border relative ${count? 'primary-border border-2 bg-purple-50':'border-gray-200'}`}
                >
                  <div className="absolute top-2 left-2 text-sm">{d.getDate()}</div>
                  {count>0 && (
                    <div className="absolute bottom-2 right-2 text-xs px-2 py-0.5 rounded-full primary-bg text-white">
                      {count} 篇
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    /* =========================
       Charts
    ==========================*/
    const Charts = ({ diaries, darkMode }) => {
      const moodRef = useRef(null);
      const dailyRef = useRef(null);
      const moodChart = useRef(null);
      const dailyChart = useRef(null);

      const moodCounts = useMemo(()=>{
        const map = Object.fromEntries(moods.map(m=>[m,0]));
        diaries.forEach(d => map[d.mood]=(map[d.mood]||0)+1);
        return map;
      },[diaries]);

      const dailyCounts = useMemo(()=>{
        const map = {};
        diaries.forEach(d=>{
          const dt = toDate(d.createdAt);
          if (dt) {
            const day = localDateKey(dt);
            if (day) map[day]=(map[day]||0)+1;
          }
        });
        const keys = Object.keys(map).sort();
        return { labels: keys, data: keys.map(k=>map[k]) };
      },[diaries]);

      useEffect(()=>{
        if(moodChart.current){ moodChart.current.destroy(); }
        if(dailyChart.current){ dailyChart.current.destroy(); }

        moodChart.current = new Chart(moodRef.current, {
          type:'doughnut',
          data:{
            labels:Object.keys(moodCounts),
            datasets:[{ data:Object.values(moodCounts) }]
          },
          options:{ plugins:{legend:{position:'bottom'}} }
        });

        dailyChart.current = new Chart(dailyRef.current, {
          type:'bar',
          data:{
            labels: dailyCounts.labels,
            datasets:[{ label:'每日篇數', data: dailyCounts.data }]
          },
          options:{
            scales:{ x:{ ticks:{ color: darkMode?'#fff':'#000' } },
                     y:{ ticks:{ color: darkMode?'#fff':'#000' } } },
            plugins:{ legend:{ display:false } }
          }
        });
      },[moodCounts, dailyCounts, darkMode]);

      const total = diaries.length || 0;
      const happy = moodCounts['😊']||0;

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
            <h4 className="font-bold mb-2">心情分佈</h4>
            <canvas ref={moodRef} height="220"></canvas>
            <div className="mt-3 text-sm text-gray-500">共 {total} 篇，😊 {happy} 篇</div>
          </div>
          <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow p-4`}>
            <h4 className="font-bold mb-2">每日篇數</h4>
            <canvas ref={dailyRef} height="220"></canvas>
          </div>
        </div>
      );
    };

    const SettingsPanel = ({

      return (

                  <button onClick={()=>onApplyCoupon(couponCode)} className="px-3 py-2 rounded-lg border hover:bg-gray-50">套用優惠券</button>

                {isAdmin && (
                  <div className="mt-4 border-t pt-4">
                    <div className="text-sm text-gray-600 mb-2">（管理員）建立優惠券</div>
                    <div className="grid sm:grid-cols-3 gap-2">
                      <input value={newCoupon.code} onChange={e=>setNewCoupon({...newCoupon, code:e.target.value})} className="border rounded-lg p-2" placeholder="代碼，如 PRO30"/>
                      <input type="number" min="1" value={newCoupon.months} onChange={e=>setNewCoupon({...newCoupon, months:parseInt(e.target.value||'1')})} className="border rounded-lg p-2" placeholder="延長月數"/>
                      <select value={newCoupon.active} onChange={e=>setNewCoupon({...newCoupon, active:(e.target.value==='true')})} className="border rounded-lg p-2">
                        <option value="true">啟用</option>

                  </div>

              <section>

                <div className="flex items-center gap-2">
                  <input
                    type={privPwdVisible ? 'text' : 'password'}
                    value={privPwdInput}
                    onChange={e=>setPrivPwdInput(e.target.value)}
                    className="flex-1 border rounded-lg p-2"
                    placeholder="輸入新密碼"
                  />
                  <button onClick={()=>setPrivPwdVisible(v=>!v)} className="px-3 py-2 rounded-lg border hover:bg-gray-50">
                    {privPwdVisible?'隱藏':'顯示'}
                  </button>
                </div>
                <div className="flex items-center gap-2 mt-2">
                  <button onClick={savePrivatePwd} className="px-3 py-2 rounded-lg primary-bg text-white">設定密碼</button>
                  <button onClick={clearPrivatePwd} className="px-3 py-2 rounded-lg border hover:bg-gray-50">清除密碼</button>
                </div>
                <div className="text-xs text-gray-500 mt-2">
                  目前狀態：{currentHashed ? <span class="text-green-600">已設定</span> : <span class="text-red-600">尚未設定</span>}
                </div>
              </section>

              {/* ② 外觀 */}
              <section>
                <h3 className="font-semibold mb-2">外觀</h3>
                <div className="flex items-center gap-3 mb-3">
                  <label className="text-sm text-gray-500">主題色</label>
                  <input type="color" value={themeColor} onChange={e=>setThemeColor(e.target.value)} />
                  <button onClick={()=>setThemeColor('#7c3aed')} className="px-2 py-1 rounded bg-gray-100">預設紫</button>
                  <button onClick={()=>setThemeColor('#0ea5e9')} className="px-2 py-1 rounded bg-gray-100">藍</button>
                  <button onClick={()=>setThemeColor('#f97316')} className="px-2 py-1 rounded bg-gray-100">橘</button>
                </div>
                <div className="flex items-center gap-3">

              {/* ③ 上傳 / 下載 */}
              <section>

                <div className="flex flex-wrap items-center gap-3">

                    <Icon name="download"/><span>匯出 JSON</span>
                  </button>
                  <label className="px-3 py-2 rounded-lg border hover:bg-gray-50 cursor-pointer flex items-center gap-2">
                    <Icon name="import"/><span>匯入 JSON</span>
                    <input type="file" accept="application/json" className="hidden" onChange={e=>e.target.files[0]&&importDiaries(e.target.files[0])}/>
                  </label>
                  <button onClick={onBackupToStorage} className="px-3 py-2 rounded-lg border hover:bg-gray-50">備份到 Firebase Storage</button>
                  <button onClick={onRestoreFromStorage} className="px-3 py-2 rounded-lg border hover:bg-gray-50">從 Storage 還原</button>
                </div>
              </section>

              {/* ④ 提醒（本地通知） */}
              <section>
                <h3 className="font-semibold mb-2">提醒</h3>
                <div className="grid sm:grid-cols-2 gap-3 items-end">
                  <input value={title} onChange={e=>setTitle(e.target.value)} className="border rounded-lg p-2" placeholder="提醒內容，如：晚上 9 點寫日記"/>
                  <div className="flex items-center gap-2">
                    <input type="datetime-local" value={when} onChange={e=>setWhen(e.target.value)} className="border rounded-lg p-2"/>
                    <select value={freq} onChange={e=>setFreq(e.target.value)} className="border rounded-lg p-2">

                  </div>
                  <button onClick={()=>{ if(!when){alert('請選擇時間');return;} onAddReminder({title, when, freq}); setTitle(''); setWhen(''); setFreq('ONCE'); }} className="sm:col-span-2 w-full primary-bg text-white rounded-lg py-2">新增提醒</button>
                </div>
                <div className="mt-3">
                  <div className="text-sm text-gray-500 mb-1">目前提醒</div>
                  {reminders.length===0 ? <div className="text-gray-400 text-sm">尚無提醒</div> :
                    <div className="space-y-2">
                      {reminders.map(r=>{
                        const dt = toDate(r.at);
                        const txt = dt ? dt.toLocaleString('zh-TW') : '—';
                        return (
                          <div key={r.id} className="flex items-center justify-between border rounded-lg p-2">
                            <div>
                              <div className="font-medium">{r.title||'(無標題)'}</div>
                              <div className="text-xs text-gray-500">{txt} · {r.freq||'ONCE'}</div>
                            </div>
                            <button onClick={()=>onRemoveReminder(r.id)} className="px-2 py-1 rounded bg-red-50 text-red-600">刪除</button>
                          </div>
                        );
                      })}
                    </div>
                  }
                  <button onClick={()=>ReminderService.requestPermission()} className="mt-3 px-3 py-2 rounded-lg border hover:bg-gray-50 flex items-center gap-2">
                    <Icon name="bell"/><span>允許桌面通知</span>
                  </button>
                </div>
              </section>

              {/* ⑤ 實用工具 */}
              <section>
                <h3 className="font-semibold mb-2">實用工具</h3>
                <div className="flex flex-wrap gap-2">
                  <button onClick={todayShortcut} className="px-3 py-2 rounded-lg border hover:bg-gray-50">跳到今天</button>
                  <button onClick={toggleFavoritesOnly} className={`px-3 py-2 rounded-lg border hover:bg-gray-50 ${favoritesOnly?'bg-yellow-50':''}`}>只看最愛：{favoritesOnly?'ON':'OFF'}</button>
                </div>
                <div className="text-xs text-gray-500 mt-2">
                  備註：真正收費請串接金流（如 Stripe / LINE Pay），此處僅示範會員狀態與優惠券流程。
                </div>
              </section>

            </div>
          </div>
        </div>
      );
    };

    /* =========================
       App 主體
    ==========================*/
    const DiaryApp = () => {
      // 狀態
      const [user, setUser] = useState(null);
      const [diaries, setDiaries] = useState([]);
      const [filteredDiaries, setFilteredDiaries] = useState([]);
      const [currentDiary, setCurrentDiary] = useState(null);
      const [showNewDiary, setShowNewDiary] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedTag, setSelectedTag] = useState('');
      const [sortBy, setSortBy] = useState('date-desc');
      const [filterMood, setFilterMood] = useState('');
      const [darkMode, setDarkMode] = useState(false);
      const [themeColor, setThemeColor] = useState(localStorage.getItem('themeColor')||'#7c3aed');
      const [dateFilter, setDateFilter] = useState(''); // YYYY-MM-DD
      const [uploading, setUploading] = useState(false);
      const [settingsOpen, setSettingsOpen] = useState(false);

      // Premium
      const [showPremium, setShowPremium] = useState(false);

      // 會員 / Profile / 角色
      const [profile, setProfile]     = useState(null); // {role, membership{tier,expiresAt}}
      const isAdmin = profile?.role === 'admin';
      const membership = profile?.membership || { tier:'free', expiresAt:null };

      // 只看最愛
      const [favoritesOnly, setFavoritesOnly] = useState(false);

      const [formData, setFormData] = useState({
        title:'', content:'', tags:[], mood:'😊', weather:'☀️',
        isPrivate:false, isFavorite:false, images:[], remindAt:'' // ISO string
      });

      useEffect(()=>{ ReminderService.requestPermission(); ReminderService.scheduleTicker(); },[]);
      useEffect(()=>{ document.documentElement.style.setProperty('--primary', themeColor); localStorage.setItem('themeColor', themeColor); },[themeColor]);

      // 深色樣式持久化（可選）
      useEffect(()=>{ localStorage.setItem('darkMode', darkMode ? '1' : '0'); }, [darkMode]);
      useEffect(()=>{ const dm = localStorage.getItem('darkMode'); if(dm==='1') setDarkMode(true); },[]);

      // Auth + Firestore
      useEffect(()=>{
        const unsub = auth.onAuthStateChanged(async (u)=>{
          setUser(u||null);
          if(u){
            db.collection('users').doc(u.uid).onSnapshot(s=>{
              if(s.exists){
                const d = s.data();
                setProfile({ role: d.role||'user', membership: d.membership||{tier:'free',expiresAt:null}, privatePasswordHash: d.privatePasswordHash });
              }else{
                setProfile({ role:'user', membership:{ tier:'free', expiresAt:null }, privatePasswordHash: undefined });
              }
            });

            db.collection('users').doc(u.uid).collection('diaries')
              .orderBy('createdAt','desc')
              .onSnapshot(snap=>{
                const arr = [];
                snap.forEach(doc=>arr.push({ id:doc.id, ...doc.data() }));
                setDiaries(arr);
              }, err=>alert('讀取日記失敗：'+err.message));
          }else{
            const sample = [
              { id:'1', title:'美好的一天', content:'今天天氣很好，去公園散步...', tags:['生活','健康'], mood:'😊', weather:'☀️', isPrivate:false, isFavorite:true, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), images:[] },
              { id:'2', title:'工作上的挑戰', content:'今天遇到了一個難題...', tags:['工作','學習'], mood:'🤔', weather:'☁️', isPrivate:false, isFavorite:false, createdAt:new Date(Date.now()-86400000).toISOString(), updatedAt:new Date(Date.now()-86400000).toISOString(), images:[] },
              { id:'3', title:'週末計畫', content:'這個週末想去爬山...', tags:['生活','興趣'], mood:'😍', weather:'🌈', isPrivate:false, isFavorite:false, createdAt:new Date(Date.now()-86400000*2).toISOString(), updatedAt:new Date(Date.now()-86400000*2).toISOString(), images:[] }
            ];
            setProfile(null);
            setDiaries(sample);
          }
        });
        return ()=>unsub();
      },[]);

      // 過濾排序（安全日期）
      useEffect(()=>{
        let filtered = [...diaries];
        if (searchTerm) {
          filtered = filtered.filter(d =>
            (d.title||'').toLowerCase().includes(searchTerm.toLowerCase()) ||
            (d.content||'').toLowerCase().includes(searchTerm.toLowerCase())
          );
        }
        if (selectedTag) filtered = filtered.filter(d => (d.tags||[]).includes(selectedTag));
        if (filterMood) filtered = filtered.filter(d => d.mood === filterMood);
        if (dateFilter) {
          filtered = filtered.filter(d => {
            const dt = toDate(d.createdAt);
            return dt ? localDateKey(dt) === dateFilter : false;
          });
        }
        if (favoritesOnly) filtered = filtered.filter(d => d.isFavorite);

        filtered.sort((a,b)=>{
          const da = toDate(a.createdAt);
          const dbb = toDate(b.createdAt);
          const ta = da ? da.getTime() : 0;
          const tb = dbb ? dbb.getTime() : 0;
          switch (sortBy) {
            case 'date-desc': return tb - ta;
            case 'date-asc' : return ta - tb;
            case 'title'    : return (a.title||'').localeCompare(b.title||'');
            default: return 0;
          }
        });
        setFilteredDiaries(filtered);
      },[diaries, searchTerm, selectedTag, filterMood, sortBy, dateFilter, favoritesOnly]);

      // 圖片上傳
      const onUploadImages = async (files)=>{
        if(!files || files.length===0) return;
        setUploading(true);
        try{
          const urls=[];
          for(const f of files){
            if(!user){
              urls.push(URL.createObjectURL(f));
            }else{
              const id = formData.id || (currentDiary?.id) || db.collection('_').doc().id;
              const ref = storage.ref().child(`${user.uid}/${id}/${Date.now()}_${f.name}`);
              await ref.put(f);
              const url = await ref.getDownloadURL();
              urls.push(url);
            }
          }
          setFormData(prev=>({...prev, images:[...(prev.images||[]), ...urls]}));
        }catch(e){
          alert('上傳失敗：'+e.message);
        }finally{
          setUploading(false);
        }
      };

      // 儲存日記
      const handleSaveDiary = async ()=>{
        if(!formData.title || !formData.content){
          alert('請填寫標題和內容'); return;
        }
        const docData = {
          title: formData.title,
          content: formData.content,
          tags: formData.tags||[],
          mood: formData.mood||'😊',
          weather: formData.weather||'☀️',
          isPrivate: !!formData.isPrivate,
          isFavorite: !!formData.isFavorite,
          images: formData.images||[],
          createdAt: currentDiary?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };
        if(formData.remindAt){
          const when = new Date(formData.remindAt);
          if (!isNaN(when.getTime())) {
            ReminderService.add({
              id: (currentDiary?.id)||docData.createdAt,
              at: when.toISOString(),
              title: docData.title,
              freq: 'ONCE',
              fired:false
            });
            alert('提醒已設定：'+when.toLocaleString('zh-TW'));
          } else {
            alert('提醒時間格式不正確，已忽略。');
          }
        }

        if(user){
          const col = db.collection('users').doc(user.uid).collection('diaries');
          if(currentDiary){ await col.doc(currentDiary.id).set(docData, { merge:true }); }
          else { await col.add(docData); }
        }else{
          const id = currentDiary?.id || Date.now().toString();
          const newItem = { id, ...docData };
          if(currentDiary){ setDiaries(diaries.map(d=>d.id===id?newItem:d)); }
          else{ setDiaries([newItem, ...diaries]); }
        }
        resetForm();
      };

      const handleDeleteDiary = async (id)=>{
        if(!confirm('確定要刪除這篇日記嗎？')) return;
        if(user){ await db.collection('users').doc(user.uid).collection('diaries').doc(id).delete(); }
        else{ setDiaries(diaries.filter(d=>d.id!==id)); }
        if(currentDiary?.id===id) setCurrentDiary(null);
      };

      const handleEditDiary = (diary)=>{
        setCurrentDiary(diary);
        setFormData({ ...diary, remindAt:'' });
        setShowNewDiary(true);
      };

      const toggleFavorite = async (id)=>{
        if(user){
          const doc = diaries.find(d=>d.id===id);
          await db.collection('users').doc(user.uid).collection('diaries').doc(id)
            .set({ isFavorite: !doc.isFavorite, updatedAt:new Date().toISOString() }, { merge:true });
        }else{
          setDiaries(diaries.map(d=>d.id===id?{...d,isFavorite:!d.isFavorite}:d));
        }
      };

      const resetForm = ()=>{
        setFormData({ title:'',content:'',tags:[],mood:'😊',weather:'☀️',isPrivate:false,isFavorite:false,images:[], remindAt:'' });
        setCurrentDiary(null);
        setShowNewDiary(false);
      };

      const handleTagToggle = (tag)=>{
        setFormData(prev=>({
          ...prev,
          tags: prev.tags.includes(tag) ? prev.tags.filter(t=>t!==tag) : [...prev.tags, tag]
        }));
      };

      const exportDiaries = ()=>{
        const dataStr = JSON.stringify(diaries, null, 2);
        const blob = new Blob([dataStr],{ type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url; a.download=`diary_backup_${localDateKey(new Date())}.json`; a.click();
      };

      const importDiaries = async (file)=>{
        try{
          const text = await file.text();
          const arr = JSON.parse(text);
          if(!Array.isArray(arr)) throw new Error('JSON 格式不正確（需要陣列）');
          if(user){
            const batch = db.batch();
            const col = db.collection('users').doc(user.uid).collection('diaries');
            arr.forEach(d=>{
              const ref = d.id ? col.doc(d.id) : col.doc();
              batch.set(ref, {
                title:d.title||'',
                content:d.content||'',
                tags:d.tags||[],
                mood:d.mood||'😊',
                weather:d.weather||'☀️',
                isPrivate:!!d.isPrivate,
                isFavorite:!!d.isFavorite,
                images:d.images||[],
                createdAt:d.createdAt||new Date().toISOString(),
                updatedAt:new Date().toISOString()
              }, { merge:true });
            });
            await batch.commit();
            alert('已匯入至雲端');
          }else{
            const map = Object.fromEntries(diaries.map(d=>[d.id,d]));
            arr.forEach(d=>{ const id=d.id||(Date.now()+Math.random()).toString(); map[id]={ id, ...d }; });
            setDiaries(Object.values(map).sort((a,b)=>{
              const da=toDate(a.createdAt), dbb=toDate(b.createdAt);
              return (dbb?dbb.getTime():0)-(da?da.getTime():0);
            }));
            alert('已匯入（本地模式）');
          }
        }catch(e){
          alert('匯入失敗：'+e.message);
        }
      };

      // 提醒清單（設定面板顯示用）
      const reminders = useMemo(()=>ReminderService.load(), [settingsOpen]);

      const onAddReminder = ({title, when, freq})=>{
        const id = `rem_${Date.now()}`;
        const dt = new Date(when);
        if (isNaN(dt.getTime())) { alert('時間格式不正確'); return; }
        ReminderService.add({ id, title, at: dt.toISOString(), freq, fired:false });
        alert('已新增提醒');
      };
      const onRemoveReminder = (id)=>{ ReminderService.remove(id); alert('已刪除提醒'); };

      // 會員：設定等級（示範）
      const onSetMembershipTier = async (tier)=>{
        if(!user){ alert('請先登入'); return; }
        const expiresAt = membership?.expiresAt ? toDate(membership.expiresAt) : new Date();
        if(tier==='free'){
          await db.collection('users').doc(user.uid).set({ membership:{ tier:'free', expiresAt:null }}, {merge:true});
        }else{
          const base = expiresAt || new Date();
          base.setDate(base.getDate()+30);
          await db.collection('users').doc(user.uid).set({ membership:{ tier, expiresAt: base.toISOString() }},{merge:true});
        }
        alert('會員狀態已更新（示範）');
      };

      // 管理員：建立優惠券
      const onCreateCoupon = async ({code, months, active})=>{
        if(!user || !isAdmin){ alert('需要管理員權限'); return; }
        if(!code){ alert('請輸入代碼'); return; }
        await db.collection('coupons').doc(code).set({
          code,
          discountMonths: Math.max(1, parseInt(months||'1')),
          active: !!active,
          createdBy: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge:true });
        alert('已建立/更新優惠券：'+code);
      };

      // 套用優惠券（示範：延長會員期限 / 設定層級）
      const onApplyCoupon = async (code)=>{
        if(!user){ alert('請先登入'); return; }
        if(!code){ alert('請輸入優惠券代碼'); return; }
        const snap = await db.collection('coupons').doc(code).get();
        if(!snap.exists){ alert('優惠券不存在'); return; }
        const c = snap.data();
        if(!c.active){ alert('此優惠券未啟用'); return; }

        const usedId = `${user.uid}_${code}`;
        const used = await db.collection('coupon_redemptions').doc(usedId).get();
        if(used.exists){ alert('此帳號已使用過該優惠券'); return; }

        const now = new Date();
        const cur = membership?.expiresAt ? toDate(membership.expiresAt) : now;
        const base = (cur && cur>now ? cur : now);
        base.setMonth(base.getMonth() + (c.discountMonths||1));
        await db.collection('users').doc(user.uid).set({
          membership:{ tier: (membership?.tier && membership.tier!=='free') ? membership.tier : 'pro', expiresAt: base.toISOString() }
        }, { merge:true });
        await db.collection('coupon_redemptions').doc(usedId).set({
          uid:user.uid, code, redeemedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`已套用優惠券，會員到期：${base.toLocaleDateString('zh-TW')}`);
      };

      // Premium 付款（示範）
      const onPurchase = async (plan)=> {
        if(!user){ alert('請先登入'); return; }
        const now = new Date();
        let base = membership?.expiresAt ? toDate(membership.expiresAt) : now;
        if(!base || base < now) base = now;
        if(plan==='monthly'){ base.setMonth(base.getMonth()+1); }
        if(plan==='yearly'){ base.setFullYear(base.getFullYear()+1); }
        await db.collection('users').doc(user.uid).set({
          membership:{ tier:'pro', expiresAt: base.toISOString() }
        }, { merge:true });
        alert(`升級成功！到期：${base.toLocaleDateString('zh-TW')}`);
        setShowPremium(false);
      };

      // 備份/還原
      const onBackupToStorage = async ()=>{
        if(!user){ alert('請先登入'); return; }
        const payload = JSON.stringify(diaries, null, 2);
        const ref = storage.ref().child(`${user.uid}/backups/diaries_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`);
        await ref.put(new Blob([payload],{type:'application/json'}));
        alert('已備份到 Storage');
      };
      const onRestoreFromStorage = async ()=>{
        if(!user){ alert('請先登入'); return; }
        const listRef = storage.ref().child(`${user.uid}/backups/`);
        const list = await listRef.list({ maxResults: 1 });
        if(!list.items.length){ alert('沒有備份檔'); return; }
        const url = await list.items[0].getDownloadURL();
        const res = await fetch(url);
        const arr = await res.json();
        const batch = db.batch();
        const col = db.collection('users').doc(user.uid).collection('diaries');
        arr.forEach(d=>{
          const ref = d.id ? col.doc(d.id) : col.doc();
          batch.set(ref, d, { merge:true });
        });
        await batch.commit();
        alert('已從 Storage 還原最新備份');
      };

      const todayShortcut = ()=>{
        const today = localDateKey(new Date());
        setDateFilter(today);
        setCurrentDiary(null);
        setShowNewDiary(false);
      };
      const toggleFavoritesOnly = ()=> setFavoritesOnly(v=>!v);

      // UI
      return (
        <div className={`min-h-screen ${darkMode?'bg-gray-900 text-white':'bg-transparent'}`}>
          {/* Top Bar */}
          <div className={`${darkMode?'bg-gray-800':'bg-white'} shadow-lg sticky top-0 z-50`}>
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-4">
              <h1 className="text-2xl font-bold primary-text">📔 我的日記本</h1>

              <div className="flex items-center gap-3 flex-wrap">
                {/* Get Premium */}
                <button onClick={()=>setShowPremium(true)} className="px-3 py-1 rounded-lg primary-bg text-white">
                  Get Premium
                </button>

                {/* 設定面板 */}
                <button onClick={()=>setSettingsOpen(true)} className="p-2 hover:bg-gray-100 rounded-lg" title="設定">
                  <Icon name="gear"/>
                </button>

                {/* Auth */}
                <AuthBar user={user}/>
              </div>
            </div>
          </div>

          {/* ===== 新增：Streak 徽章（Top 下方） ===== */}
          <div className="max-w-7xl mx-auto px-4 pt-4">
            <StreakBadge diaries={diaries}/>
          </div>

          {/* Get Premium Modal */}
          <PremiumModal
            open={showPremium}
            onClose={()=>setShowPremium(false)}
            onApplyCoupon={onApplyCoupon}
            onPurchase={onPurchase}
            membership={membership}
            user={user}
          />

          {/* 設定面板 */}
          <SettingsPanel
            open={settingsOpen}
            onClose={()=>setSettingsOpen(false)}
            exportDiaries={exportDiaries}
            importDiaries={importDiaries}
            themeColor={themeColor}
            setThemeColor={setThemeColor}
            reminders={ReminderService.load()}
            onAddReminder={onAddReminder}
            onRemoveReminder={onRemoveReminder}
            profile={profile}
            isAdmin={isAdmin}
            onCreateCoupon={onCreateCoupon}
            onApplyCoupon={onApplyCoupon}
            membership={membership}
            onSetMembershipTier={onSetMembershipTier}
            onBackupToStorage={onBackupToStorage}
            onRestoreFromStorage={onRestoreFromStorage}
            todayShortcut={todayShortcut}
            toggleFavoritesOnly={toggleFavoritesOnly}
            favoritesOnly={favoritesOnly}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            user={user}
          />

          {/* 主區 */}
          <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* 左欄：篩選 + 新增 + 清單 */}
            <div className={`lg:col-span-1 ${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6 max-h-screen overflow-y-auto`}>
              <div className="space-y-4">
                {/* 搜尋 */}
                <div className="relative">
                  <div className="absolute left-3 top-3"><Icon name="search" className="w-5 h-5 text-gray-400"/></div>
                  <input type="text" placeholder="搜尋日記..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                    className={`w-full pl-10 pr-4 py-2 rounded-lg border ${darkMode?'bg-gray-700 border-gray-600 text-white':'border-gray-300'} focus:ring-2 focus:outline-none`}/>
                </div>

                {/* 排序 / 心情 */}
                <div className="flex flex-wrap gap-2">
                  <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode?'bg-gray-700 text-white':'bg-gray-100'}`}>
                    <option value="date-desc">最新優先</option>
                    <option value="date-asc">最舊優先</option>
                    <option value="title">標題排序</option>
                  </select>
                  <select value={filterMood} onChange={e=>setFilterMood(e.target.value)} className={`px-3 py-1 rounded-full text-sm ${darkMode?'bg-gray-700 text-white':'bg-gray-100'}`}>
                    <option value="">所有心情</option>
                    {moods.map(m=> <option key={m} value={m}>{m}</option>)}
                  </select>
                  <button onClick={todayShortcut} className="px-2 py-1 rounded-full text-sm border">今天</button>
                  <button onClick={toggleFavoritesOnly} className={`px-2 py-1 rounded-full text-sm border ${favoritesOnly?'bg-yellow-50':''}`}>只看最愛</button>
                </div>

                {/* 標籤雲 */}
                <div>
                  <div className="text-sm mb-2 text-gray-500">標籤雲（點擊篩選）</div>
                  <TagCloud diaries={diaries} activeTag={selectedTag} onToggle={(t)=> setSelectedTag(selectedTag===t?'':t) } />
                </div>

                {/* 新增 */}
                <button onClick={()=>{resetForm(); setShowNewDiary(true);}}
                  className="w-full primary-bg text-white py-3 rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
                  <Icon name="plus"/> 新增日記
                </button>

                {/* 清單 */}
                <div className="space-y-3">
                  {filteredDiaries.length===0 ? (
                    <div className="text-center py-8 text-gray-400"><p>還沒有日記，快來寫一篇吧！</p></div>
                  ) : filteredDiaries.map(d=>{
                    const dt = toDate(d.createdAt);
                    const dateText = dt ? dt.toLocaleDateString('zh-TW') : '—';
                    return (
                      <div key={d.id}
                        onClick={()=>{ setCurrentDiary(d); setShowNewDiary(false); setDateFilter(''); }}
                        className={`p-4 rounded-lg cursor-pointer transition ${currentDiary?.id===d.id ? 'bg-purple-100 border-2 primary-border' : darkMode?'bg-gray-700 hover:bg-gray-600':'bg-gray-50 hover:bg-gray-100'}`}>
                        <div className="flex items-start justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <span className="text-2xl">{d.mood}</span>
                            <span className="text-lg">{d.weather}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            {d.isFavorite && <Icon name="heart" className="w-4 h-4 text-red-500" fill={true}/>}
                            {d.isPrivate && <Icon name="lock" className="w-4 h-4"/>}
                          </div>
                        </div>
                        <h3 className="font-bold mb-1">{d.title}</h3>
                        <p className="text-sm text-gray-500 mb-2">{dateText}</p>

                        {/* 私密日記不顯示內容摘要 */}
                        {d.isPrivate ? (
                          <div className="text-xs text-gray-500 italic flex items-center gap-1">
                            <Icon name="lock" className="w-3 h-3" />
                            <span>私密內容已隱藏</span>
                          </div>
                        ) : (
                          <p className="text-sm line-clamp-2">{d.content}</p>
                        )}

                        {(d.tags||[]).length>0 && (
                          <div className="flex gap-1 mt-2 flex-wrap">
                            {d.tags.map(t=><span key={t} className="text-xs bg-purple-200 text-purple-700 px-2 py-1 rounded">#{t}</span>)}
                          </div>
                        )}
                        {d.images?.length>0 && (
                          <div className="mt-2 flex gap-2 overflow-x-auto">
                            {d.images.slice(0,3).map((url,i)=>(
                              <img key={i} src={url} className="w-16 h-16 object-cover rounded-lg border"/>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* 右欄：編輯/檢視 + 日曆 + 圖表 */}
            <div className="lg:col-span-2 grid grid-cols-1 gap-6">
              {/* 日曆 */}
              <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                <h3 className="font-bold mb-3 flex items-center gap-2"><Icon name="calendar"/><span>日曆檢視</span></h3>
                <CalendarView diaries={diaries} onPickDate={(d)=>{ setDateFilter(d); setCurrentDiary(null); setShowNewDiary(false); }} />
                {dateFilter && (
                  <div className="mt-3 text-sm">
                    目前篩選日期：<span className="font-semibold">{dateFilter}</span>
                    <button onClick={()=>setDateFilter('')} className="ml-2 px-2 py-0.5 rounded bg-gray-200 hover:bg-gray-300">清除</button>
                  </div>
                )}
              </div>

              {/* 編輯 or 內容 */}
              <div className={`${darkMode?'bg-gray-800':'bg-white'} rounded-2xl shadow-xl p-6`}>
                {showNewDiary ? (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between mb-2">
                      <h2 className="text-2xl font-bold">{currentDiary?'編輯日記':'新增日記'}</h2>
                      <button onClick={resetForm} className="p-2 hover:bg-gray-100 rounded-lg"><Icon name="x" className="w-6 h-6"/></button>
                    </div>

                    <input type="text" placeholder="標題" value={formData.title}
                      onChange={e=>setFormData({...formData, title:e.target.value})}
                      className={`w-full text-2xl font-bold p-3 rounded-lg border ${darkMode?'bg-gray-700 border-gray-600 text-white':'border-gray-300'} focus:ring-2 focus:outline-none`}/>
                    <div className="text-sm text-gray-500">標題字數：{(formData.title||'').length}</div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium mb-2">心情</label>
                        <div className="flex gap-2 flex-wrap">
                          {moods.map(m=>(
                            <button key={m} onClick={()=>setFormData({...formData,mood:m})}
                              className={`text-3xl p-2 rounded-lg transition ${formData.mood===m?'bg-purple-200 scale-110':'hover:bg-gray-100'}`}>
                              {m}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium mb-2">天氣</label>
                        <div className="flex gap-2 flex-wrap">
                          {weathers.map(w=>(
                            <button key={w} onClick={()=>setFormData({...formData,weather:w})}
                              className={`text-3xl p-2 rounded-lg transition ${formData.weather===w?'bg-purple-200 scale-110':'hover:bg-gray-100'}`}>
                              {w}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium mb-2">標籤</label>
                      <div className="flex gap-2 flex-wrap">
                        {allTags.map(tag=>(
                          <button key={tag} onClick={()=>handleTagToggle(tag)}
                            className={`px-3 py-1 rounded-full text-sm transition ${formData.tags.includes(tag)?'primary-bg text-white':'bg-gray-200 hover:bg-gray-300'}`}>
                            #{tag}
                          </button>
                        ))}
                      </div>
                    </div>

                    <textarea placeholder="今天發生了什麼事呢..." value={formData.content}
                      onChange={e=>setFormData({...formData, content:e.target.value})}
                      className={`w-full h-64 p-4 rounded-lg border ${darkMode?'bg-gray-700 border-gray-600 text-white':'border-gray-300'} focus:ring-2 focus:outline-none resize-none`}/>
                    <div className="text-sm text-gray-500">內容字數：{(formData.content||'').length}</div>

                    {/* 圖片上傳 */}
                    <div className="space-y-2">
                      <label className="block text-sm font-medium">圖片上傳</label>
                      <div className="flex items-center gap-2">
                        <label className="px-3 py-2 rounded-lg border cursor-pointer hover:bg-gray-50 flex items-center gap-2">
                          <Icon name="image"/><span>選擇圖片</span>
                          <input type="file" accept="image/*" className="hidden" multiple
                                 onChange={e=>onUploadImages(e.target.files)}/>
                        </label>
                        {uploading && <span className="text-sm text-gray-500">上傳中...</span>}
                      </div>
                      {formData.images?.length>0 && (
                        <div className="flex gap-2 flex-wrap">
                          {formData.images.map((url,i)=>(
                            <div key={i} className="relative">
                              <img src={url} className="w-24 h-24 object-cover rounded-lg border"/>
                              <button onClick={()=>setFormData(prev=>({...prev, images: prev.images.filter((_,idx)=>idx!==i)}))}
                                className="absolute -top-2 -right-2 bg-black/60 text-white rounded-full w-6 h-6 flex items-center justify-center">×</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* 私密 / 最愛 */}
                    <div className="flex items-center gap-4 flex-wrap">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={formData.isPrivate}
                               onChange={e=>setFormData({...formData,isPrivate:e.target.checked})} className="w-5 h-5"/>
                        <Icon name="lock"/><span>私密日記</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={formData.isFavorite}
                               onChange={e=>setFormData({...formData,isFavorite:e.target.checked})} className="w-5 h-5"/>
                        <Icon name="heart"/><span>加入最愛</span>
                      </label>
                    </div>

                    {/* 提醒（本地通知） */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium mb-2">提醒時間（本地）</label>
                        <input type="datetime-local" value={formData.remindAt}
                          onChange={e=>setFormData({...formData, remindAt:e.target.value})}
                          className="w-full border rounded-lg p-2"/>
                        <div className="text-xs text-gray-500 mt-1">到時會發出桌面通知（需保持瀏覽器開啟或定期檢查）。</div>
                      </div>
                    </div>

                    <button onClick={handleSaveDiary}
                      className="w-full primary-bg text-white py-3 rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
                      <Icon name="save"/> 儲存日記
                    </button>
                  </div>
                ) : currentDiary ? (
                  (currentDiary.isPrivate
                    ? <PrivateDiaryViewer currentDiary={currentDiary} user={user} profile={profile}
                        onEdit={handleEditDiary} onDelete={handleDeleteDiary} toggleFavorite={toggleFavorite}/>
                    : <DiaryViewer currentDiary={currentDiary} onEdit={handleEditDiary} onDelete={handleDeleteDiary} toggleFavorite={toggleFavorite}/>
                  )
                ) : (
                  <div className="flex items-center justify-center h-full text-gray-400">
                    <div className="text-center">
                      <Icon name="calendar" className="w-20 h-20 mx-auto mb-4"/>
                      <p className="text-xl">選擇一篇日記來查看，或建立新的日記</p>
                    </div>
                  </div>
                )}
              </div>

              {/* 圖表 */}
              <Charts diaries={diaries} darkMode={darkMode}/>
            </div>
          </div>
        </div>
      );
    };

    /* ========== 密碼檢視器與一般檢視器 ========== */
    const PrivateDiaryViewer = ({ currentDiary, user, profile, onEdit, onDelete, toggleFavorite }) => {
      const [inputPwd, setInputPwd] = React.useState('');
      const [unlocked, setUnlocked] = React.useState(false);
      const savedHash = (profile?.privatePasswordHash) || localStorage.getItem('privatePasswordHash') || '';

      const checkPassword = async ()=>{
        if(!savedHash){ alert('尚未設定私密日記密碼'); return; }
        const hash = await sha256Hex(inputPwd);
        if(hash === savedHash){
          setUnlocked(true);
        }else{
          alert('密碼錯誤');
        }
      };

      if(!unlocked){
        return (
          <div className="text-center py-20">
            <Icon name="lock" className="w-16 h-16 mx-auto mb-4 text-gray-400"/>
            <p className="text-gray-600 mb-4">這是一篇私密日記，請輸入密碼以查看內容</p>
            <div className="flex justify-center gap-2">
              <input type="password" value={inputPwd} onChange={e=>setInputPwd(e.target.value)} className="border rounded-lg p-2"/>
              <button onClick={checkPassword} className="primary-bg text-white rounded-lg px-3">解鎖</button>
            </div>
          </div>
        );
      }

      return <DiaryViewer currentDiary={currentDiary} onEdit={onEdit} onDelete={onDelete} toggleFavorite={toggleFavorite} />;
    };

    const DiaryViewer = ({ currentDiary, onEdit, onDelete, toggleFavorite }) => (
      <div className="space-y-6">
        <div className="flex items-start justify-between flex-wrap gap-4">
          <div>
            <div className="flex items-center gap-3 mb-4">
              <span className="text-5xl">{currentDiary.mood}</span>
              <span className="text-4xl">{currentDiary.weather}</span>
            </div>
            <h2 className="text-3xl font-bold mb-2">{currentDiary.title}</h2>
            <p className="text-sm text-gray-500">
              {(()=>{ const dt = toDate(currentDiary.createdAt); return dt ? dt.toLocaleString('zh-TW') : '—'; })()}
            </p>
          </div>
          <div className="flex gap-2">
            {toggleFavorite && (
              <button onClick={()=>toggleFavorite(currentDiary.id)} className="p-2 hover:bg-gray-100 rounded-lg">
                <Icon name="heart" className={`w-6 h-6 ${currentDiary.isFavorite?'text-red-500':''}`} fill={currentDiary.isFavorite}/>
              </button>
            )}
            {onEdit && <button onClick={()=>onEdit(currentDiary)} className="p-2 hover:bg-gray-100 rounded-lg"><Icon name="edit" className="w-6 h-6"/></button>}
            {onDelete && <button onClick={()=>onDelete(currentDiary.id)} className="p-2 hover:bg-red-100 text-red-600 rounded-lg"><Icon name="trash" className="w-6 h-6"/></button>}
          </div>
        </div>

        {(currentDiary.tags||[]).length>0 && (
          <div className="flex gap-2 flex-wrap">
            {currentDiary.tags.map(t=><span key={t} className="bg-purple-200 text-purple-700 px-3 py-1 rounded-full">#{t}</span>)}
          </div>
        )}

        {currentDiary.images?.length>0 && (
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            {currentDiary.images.map((url,i)=><img key={i} src={url} className="w-full h-40 object-cover rounded-xl border"/>)}
          </div>
        )}

        <div className="prose max-w-none">
          <p className="text-lg whitespace-pre-wrap">{currentDiary.content}</p>
        </div>

        {currentDiary.isPrivate && (
          <div className="flex items-center gap-2 text-gray-500 text-sm">
            <Icon name="lock" className="w-4 h-4"/><span>這是一篇私密日記</span>
          </div>
        )}
      </div>
    );

    ReactDOM.render(<DiaryApp/>, document.getElementById('root'));
  </script>
</body>
</html>
